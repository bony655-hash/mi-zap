function importarCopiaSeguridad(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      const nuevoEstado = parsed && parsed.state ? parsed.state : parsed; // admite copia o estado directo
      if(!nuevoEstado || !Array.isArray(nuevoEstado.products)){
        showToast("El archivo no parece una copia válida de la zapatería.", "err");
        return;
      }
      const nProd = nuevoEstado.products.length;
      const nVentas = (nuevoEstado.sales||[]).length;
      // Guardar el estado a restaurar para usarlo desde el modal de confirmación
      window.__pendingRestore = { nuevoEstado, inputEl, nProd, nVentas };
      document.getElementById("modal-root").innerHTML = `
        <div class="modal-overlay">
          <div class="modal" style="max-width:380px;">
            <h3>📂 Restaurar copia</h3>
            <p>Vas a sustituir <b>todos los datos actuales</b> por los de la copia (<b>${nProd} productos, ${nVentas} ventas</b>).</p>
            <p style="color:var(--ink-dim);font-size:13px;">Los datos que tengas ahora se perderán.</p>
            <div class="modal-actions" style="justify-content:center;gap:12px;">
              <button class="btn secondary" onclick="closeModal(); window.__pendingRestore=null;">Cancelar</button>
              <button class="btn accent" onclick="confirmarRestaurarCopia()">📂 Sí, restaurar</button>
            </div>
          </div>
        </div>`;
      inputEl.value = "";
      return; // el modal se encarga de continuar
    }catch(err){
      console.error(err);
      showToast("No se pudo leer el archivo de copia.", "err");
    }
    inputEl.value = "";
  };
  reader.readAsText(file);
}

function confirmarRestaurarCopia(){
  const p = window.__pendingRestore;
  if(!p){ closeModal(); return; }
  window.__pendingRestore = null;
  state = p.nuevoEstado;
  if(!state.settings) state.settings = defaultState().settings;
  aplicarAjustesLocales();   // el bloque de códigos y la impresora son de este terminal
  // Valores por defecto de los ajustes propios del dispositivo
  if(state.settings.prefijoEAN===undefined) state.settings.prefijoEAN="20";
  if(state.settings.contadorEAN===undefined) state.settings.contadorEAN=0;
  if(state.settings.autoEAN===undefined) state.settings.autoEAN=true;
  if(state.settings.bloqueEAN===undefined) state.settings.bloqueEAN=null;
  if(state.settings.etiqFormato===undefined) state.settings.etiqFormato="apli01787";
  if(state.settings.etiqOffsetX===undefined) state.settings.etiqOffsetX=0;
  if(state.settings.etiqOffsetY===undefined) state.settings.etiqOffsetY=0;
  if(state.settings.etiqEscala===undefined) state.settings.etiqEscala=100;
  if(state.settings.nif===undefined) state.settings.nif="";
  if(state.settings.serieFactura===undefined) state.settings.serieFactura="T";
  // "D" se confundía con la serie de diciembre (26D): pasa a "DEV"
  if(!state.settings.serieDevolucion || /^d$/i.test(String(state.settings.serieDevolucion).trim())) state.settings.serieDevolucion="DEV";
  if(state.settings.autoImprimir===undefined) state.settings.autoImprimir=true;
  if(state.settings.cajonHabilitado===undefined) state.settings.cajonHabilitado=false;
  if(!state.tickets) state.tickets = [];

  saveState();
  document.getElementById("storeName").textContent = (state.settings.nombreTienda || "Mil Pasos").toUpperCase();

  showToast(`Copia restaurada: ${p.nProd} productos, ${p.nVentas} ventas ✓`, "ok");
}

// ---------------- GRÁFICOS ----------------
function monthKey(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){ const [y,m]=key.split('-'); return MONTH_NAMES[parseInt(m)-1]+' '+y.slice(2); }
function lastNMonthKeys(n){
  const arr=[]; const now=new Date();
  for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); arr.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  return arr;
}
function lastNYearKeys(n){
  const arr=[]; const y=new Date().getFullYear();
  for(let i=n-1;i>=0;i--) arr.push(String(y-i));
  return arr;
}
function periodKeysFor(granularity){ return granularity==='anual' ? lastNYearKeys(5) : lastNMonthKeys(12); }
function periodKeyOf(iso, granularity){ return granularity==='anual' ? String(new Date(iso).getFullYear()) : monthKey(iso); }
function periodLabelOf(key, granularity){ return granularity==='anual' ? key : monthLabel(key); }

function modelKey(marca,modelo){ return marca+' — '+modelo; }
function allModelKeys(){
  const set = new Set();
  state.products.forEach(p=> set.add(modelKey(p.marca,p.modelo)));
  state.sales.forEach(s=> set.add(modelKey(s.marca,s.modelo)));
  return Array.from(set).sort();
}
function modelosPorMarca(){
  const map = {};
  allModelKeys().forEach(k=>{
    const marca = k.split(' — ')[0];
    if(!map[marca]) map[marca] = [];
    map[marca].push(k);
  });
  Object.keys(map).forEach(marca=> map[marca].sort((a,b)=>a.localeCompare(b,'es')));
  return map;
}
function getSelectedModelKeys(){
  if(informesSeleccion===null) return topModelsUnits(6).map(e=>e[0]);
  return informesSeleccion;
}
function toggleModeloSeleccionado(key, checked){
  if(informesSeleccion===null) informesSeleccion = getSelectedModelKeys();
  if(checked){ if(!informesSeleccion.includes(key)) informesSeleccion.push(key); }
  else informesSeleccion = informesSeleccion.filter(k=>k!==key);
  renderSinScroll();
}
function toggleMarcaCompleta(marca, checked){
  if(informesSeleccion===null) informesSeleccion = getSelectedModelKeys();
  const modelos = allModelKeys().filter(k=>k.split(' — ')[0]===marca);
  if(checked){
    modelos.forEach(k=>{ if(!informesSeleccion.includes(k)) informesSeleccion.push(k); });
  } else {
    informesSeleccion = informesSeleccion.filter(k=>!modelos.includes(k));
  }
  renderSinScroll();
}
function seleccionarTopModelos(){ informesSeleccion = topModelsUnits(6).map(e=>e[0]); renderSinScroll(); }
function seleccionarTodosModelos(){ informesSeleccion = allModelKeys(); renderSinScroll(); }
function seleccionarNingunModelo(){ informesSeleccion = []; renderSinScroll(); }
function setInformesPeriodo(p){ informesPeriodo = p; render(); }

function salesByModelSeries(models, granularity){
  const periods = periodKeysFor(granularity);
  const series = models.map(model=>{
    const data = periods.map(pk=> state.sales.filter(s=> modelKey(s.marca,s.modelo)===model && periodKeyOf(s.fecha,granularity)===pk).reduce((sum,s)=>sum+s.cantidad,0));
    return {label:model, data};
  });
  return {labels: periods.map(pk=>periodLabelOf(pk,granularity)), series};
}
function topModelsUnits(limit, salesData){
  const data = salesData || state.sales;
  const totals={};
  data.forEach(s=>{ const key=modelKey(s.marca,s.modelo); totals[key]=(totals[key]||0)+s.cantidad; });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,limit);
}
function brandDistribution(salesData){
  const data = salesData || state.sales;
  const totals={};
  data.forEach(s=>{ totals[s.marca]=(totals[s.marca]||0)+s.total; });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]);
}
function generoDistribution(salesData){
  const data = salesData || state.sales;
  const totals={ mujer:0, hombre:0, unisex:0, nino:0 };
  data.forEach(s=>{ const g=s.genero||'unisex'; totals[g]=(totals[g]||0)+s.cantidad; });
  return Object.entries(totals).filter(e=>e[1]>0).map(e=>[generoLabel(e[0]), e[1]]);
}
function generoDistribucionEuros(salesData){
  const data = salesData || state.sales;
  const totals={ mujer:{unidades:0,importe:0}, hombre:{unidades:0,importe:0}, unisex:{unidades:0,importe:0}, nino:{unidades:0,importe:0} };
  let granTotal = 0;
  data.forEach(s=>{
    const g = s.genero||'unisex';
    totals[g].unidades += s.cantidad;
    totals[g].importe += s.total;
    granTotal += s.total;
  });
  return Object.entries(totals)
    .filter(e=>e[1].unidades>0)
    .map(e=>({ label:generoLabel(e[0]), unidades:e[1].unidades, importe:e[1].importe, pctVentas: granTotal? (e[1].importe/granTotal*100):0 }))
    .sort((a,b)=>b.importe-a.importe);
}
function totalSalesByPeriod(granularity){
  const periods = periodKeysFor(granularity);
  const data = periods.map(pk=> state.sales.filter(s=>periodKeyOf(s.fecha,granularity)===pk).reduce((sum,s)=>sum+s.total,0));
  return {labels: periods.map(pk=>periodLabelOf(pk,granularity)), data};
}

let productFormTallas = {};
let precioVentaPreciso = 0;
// ================= GENERADOR DE CÓDIGOS DE BARRAS EAN-13 =================
// Prefijo 20-29: rango reservado por GS1 para uso interno de establecimiento.
// No colisiona nunca con códigos de fabricante.

function eanDigitoControl(doce){
  var suma = 0;
  for(var i=0; i<12; i++){
    suma += parseInt(doce.charAt(i),10) * (i%2===0 ? 1 : 3);
  }
  return String((10 - (suma % 10)) % 10);
}

function eanValido(code){
  if(!/^\d{13}$/.test(code||"")) return false;
  return eanDigitoControl(code.slice(0,12)) === code.charAt(12);
}

// Genera el siguiente EAN-13 interno libre (prefijo + contador correlativo)
// Cada dispositivo reserva su propio bloque de 2 dígitos la primera vez que
// genera un código. Así el PC, el móvil y el Kozen no pueden chocar aunque
// generen códigos a la vez y sin conexión.
function bloqueDispositivo(){
  if(state.settings.bloqueEAN === null || state.settings.bloqueEAN === undefined){
    var usados = {};
    state.products.forEach(function(p){
      tallasParaTipo(p.tipoArticulo||'zapatos').forEach(function(t){
        var bc = tallaInfo(p,t).barcode;
        if(bc && bc.length===13 && bc.slice(0,2)===state.settings.prefijoEAN) usados[bc.slice(2,4)] = true;
      });
    });
    var libre = null;
    for(var intento=0; intento<200 && libre===null; intento++){
      var cand = String(Math.floor(Math.random()*100)).padStart(2,'0');
      if(!usados[cand]) libre = cand;
    }
    state.settings.bloqueEAN = libre || '00';
    // Solo local: el bloque es un ajuste propio de este terminal (está en
    // AJUSTES_LOCALES). Llamar a saveState() aquí empujaría la tienda entera
    // a Firebase por asignar un número que a nadie más le importa, y ese
    // envío podía reabrir el aviso de duplicados sin venir a cuento.
    guardarAjustesLocales();
  }
  return state.settings.bloqueEAN;
}

function generarEAN13(){
  if(!state.settings.prefijoEAN) state.settings.prefijoEAN = '20';
  if(!state.settings.contadorEAN) state.settings.contadorEAN = 0;
  var bloque = bloqueDispositivo();
  var intentos = 0;
  while(intentos < 100000000){
    state.settings.contadorEAN++;
    var base = state.settings.prefijoEAN + bloque + String(state.settings.contadorEAN).padStart(8,'0');
    base = base.slice(0,12);
    var code = base + eanDigitoControl(base);
    if(!findByBarcode(code)) return code;
    intentos++;
  }
  return null;
}

// ---- CODE 128 (subconjunto B: alfanumérico) ----
var C128_PATRONES = ['11011001100','11001101100','11001100110','10010011000','10010001100','10001001100','10011001000','10011000100','10001100100','11001001000','11001000100','11000100100','10110011100','10011011100','10011001110','10111001100','10011101100','10011100110','11001110010','11001011100','11001001110','11011100100','11001110100','11101101110','11101001100','11100101100','11100100110','11101100100','11100110100','11100110010','11011011000','11011000110','11000110110','10100011000','10001011000','10001000110','10110001000','10001101000','10001100010','11010001000','11000101000','11000100010','10110111000','10110001110','10001101110','10111011000','10111000110','10001110110','11101110110','11010001110','11000101110','11011101000','11011100010','11011101110','11101011000','11101000110','11100010110','11101101000','11101100010','11100011010','11101111010','11001000010','11110001010','10100110000','10100001100','10010110000','10010000110','10000101100','10000100110','10110010000','10110000100','10011010000','10011000010','10000110100','10000110010','11000010010','11001010000','11110111010','11000010100','10001111010','10100111100','10010111100','10010011110','10111100100','10011110100','10011110010','11110100100','11110010100','11110010010','11011011110','11011110110','11110110110','10101111000','10100011110','10001011110','10111101000','10111100010','11110101000','11110100010','10111011110','10111101110','11101011110','11110101110','11010000100','11010010000','11010011100','11000111010'];
var C128_STOP = '1100011101011';

function code128Patron(texto){
  if(!texto) return null;
  var codigos = [104]; // START B
  for(var i=0;i<texto.length;i++){
    var c = texto.charCodeAt(i);
    if(c < 32 || c > 126) return null;
    codigos.push(c - 32);
  }
  var suma = codigos[0];
  for(var j=1;j<codigos.length;j++) suma += codigos[j]*j;
  codigos.push(suma % 103); // dígito de control
  var bits = '';
  for(var k=0;k<codigos.length;k++) bits += C128_PATRONES[codigos[k]];
  return bits + C128_STOP;
}

function code128SVG(texto, anchoMm, altoMm){
  var bits = code128Patron(texto);
  if(!bits) return '<div style="font-size:10px;color:#c00;">Texto no válido para Code 128</div>';
  anchoMm = anchoMm || 40; altoMm = altoMm || 14;
  var total = bits.length;
  var modulo = 100 / (total + 20);
  var x = modulo * 10;
  var barras = '';
  for(var i=0;i<total;i++){
    if(bits.charAt(i)==='1') barras += '<rect x="'+(x+i*modulo).toFixed(3)+'" y="0" width="'+modulo.toFixed(3)+'" height="78" fill="#000"/>';
  }
  return '<svg viewBox="0 0 100 100" width="'+anchoMm+'mm" height="'+altoMm+'mm" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="display:block;">'
    + '<rect width="100" height="100" fill="#fff"/>' + barras
    + '<text x="50" y="96" font-family="monospace" font-size="11" text-anchor="middle" fill="#000">'+escapeHtml(texto)+'</text></svg>';
}

// Dibuja el código en el formato adecuado según su contenido
function dibujarCodigo(code, anchoMm, altoMm){
  if(eanValido(code)) return barcodeSVG(code, anchoMm, altoMm);
  return code128SVG(code, anchoMm, altoMm);
}

// ---- Codificación de barras EAN-13 ----
var EAN_L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
var EAN_G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
var EAN_R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
var EAN_PARIDAD = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

function eanPatron(code){
  if(!eanValido(code)) return null;
  var primero = parseInt(code.charAt(0),10);
  var par = EAN_PARIDAD[primero];
  var bits = '101';
  for(var i=1; i<=6; i++){
    var d = parseInt(code.charAt(i),10);
    bits += (par.charAt(i-1)==='L' ? EAN_L[d] : EAN_G[d]);
  }
  bits += '01010';
  for(var j=7; j<=12; j++){
    bits += EAN_R[parseInt(code.charAt(j),10)];
  }
  bits += '101';
  return bits;
}

// Dibuja el código como SVG (sin librerías externas, funciona sin conexión)
function barcodeSVG(code, anchoMm, altoMm){
  var bits = eanPatron(code);
  if(!bits) return '<div style="font-size:10px;color:#c00;">Código no válido</div>';
  anchoMm = anchoMm || 37;
  altoMm  = altoMm  || 20;
  var total = bits.length;          // 95 módulos
  var modulo = 100 / (total + 11);  // margen de silencio a cada lado
  var x = modulo * 5.5;
  var barras = '';
  var alturaBarra = 78;
  var alturaLarga = 88;
  for(var i=0; i<total; i++){
    var esGuarda = (i<3) || (i>=45 && i<50) || (i>=total-3);
    if(bits.charAt(i)==='1'){
      barras += '<rect x="'+(x + i*modulo).toFixed(3)+'" y="0" width="'+modulo.toFixed(3)+'" height="'+(esGuarda?alturaLarga:alturaBarra)+'" fill="#000"/>';
    }
  }
  var t1 = code.charAt(0);
  var t2 = code.slice(1,7);
  var t3 = code.slice(7);
  var fs = 11;
  return '<svg viewBox="0 0 100 100" width="'+anchoMm+'mm" height="'+altoMm+'mm" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="display:block;">'
    + '<rect width="100" height="100" fill="#fff"/>'
    + barras
    + '<text x="'+(modulo*1.5).toFixed(2)+'" y="97" font-family="monospace" font-size="'+fs+'" fill="#000">'+t1+'</text>'
    + '<text x="'+(modulo*(5.5+24)).toFixed(2)+'" y="97" font-family="monospace" font-size="'+fs+'" text-anchor="middle" fill="#000">'+t2+'</text>'
    + '<text x="'+(modulo*(5.5+70)).toFixed(2)+'" y="97" font-family="monospace" font-size="'+fs+'" text-anchor="middle" fill="#000">'+t3+'</text>'
    + '</svg>';
}

// ---- Botones del formulario de producto ----
// Avisos creados por "generar código" MIENTRAS el formulario está abierto.
// Si se cierra sin guardar, el código no llegó a aplicarse a ningún
// artículo, así que su aviso se retira del historial: dejarlo ahí sería
// engañoso, porque el producto sigue con el código de antes.
var _avisosSesionFormulario = [];

function generarCodigoTalla(talla){
  var code = generarEAN13();
  if(!code){ showToast("No se pudo generar un código libre.", "err"); return; }
  var sel = talla==='ÚNICA'
    ? document.getElementById("f-bolso-barcode")
    : document.querySelector('.barcode-input[data-talla="'+talla+'"]');
  if(sel){ sel.value = code; }
  // Sin guardar aquí: el código solo está en el campo del formulario, no en
  // la ficha del producto. Si se llamara a saveState() ahora, sincronizaría
  // con Firebase y podría reabrir el aviso de duplicados en el historial por
  // algo que todavía ni siquiera está guardado. Se persiste cuando se pulsa
  // "Guardar" en el propio formulario.
  var idAviso = showToast("Código "+code+" generado ✓", "ok");
  if(idAviso) _avisosSesionFormulario.push(idAviso);
}

function generarCodigosVacios(){
  var inputs = document.querySelectorAll('.barcode-input');
  var stocks = document.querySelectorAll('.stock-input');
  var stockPorTalla = {};
  stocks.forEach(function(s){ stockPorTalla[s.dataset.talla] = parseInt(s.value)||0; });
  var n = 0;
  inputs.forEach(function(inp){
    if(!inp.value.trim() && stockPorTalla[inp.dataset.talla] > 0){
      var c = generarEAN13();
      if(c){ inp.value = c; n++; }
    }
  });
  var bolso = document.getElementById("f-bolso-barcode");
  if(bolso && !bolso.value.trim()){
    var cb = generarEAN13();
    if(cb){ bolso.value = cb; n++; }
  }
  // Igual que arriba: no se persiste hasta que se guarde el formulario.
  var idAviso = showToast(n ? n+" código(s) generado(s) ✓" : "No hay tallas con stock sin código.", n?"ok":"err");
  if(n && idAviso) _avisosSesionFormulario.push(idAviso);
}

// Cierra el formulario de producto SIN guardar: retira del historial
// cualquier aviso de "código generado" creado durante esta edición, porque
// ninguno llegó a aplicarse de verdad.
function cerrarFormularioProducto(){
  if(_avisosSesionFormulario.length && state.avisos && state.avisos.length){
    var idsSesion = {};
    _avisosSesionFormulario.forEach(function(id){ idsSesion[id] = true; });
    var antes = state.avisos.length;
    // Solo se retiran si siguen sin validar: si el usuario ya los marcó
    // como leídos desde Informes, se respeta esa acción y no se tocan.
    state.avisos = state.avisos.filter(function(a){ return !(idsSesion[a.id] && !a.validado); });
    if(state.avisos.length !== antes){ try{ storage.set(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
  }
  _avisosSesionFormulario = [];
  closeModal();
}

// Dibuja una etiqueta de muestra a escala real dentro de la app
function actualizarPreviewEtiqueta(){
  var cont = document.getElementById("etiq-preview");
  if(!cont) return;
  var fmt = formatoEtiquetaActual();
  var esc = (state.settings.etiqEscala||100)/100;

  // Primer artículo con código, o un ejemplo si no hay ninguno
  var muestra = null;
  for(var i=0;i<state.products.length && !muestra;i++){
    var p = state.products[i];
    var tallas = tallasParaTipo(p.tipoArticulo||'zapatos');
    for(var j=0;j<tallas.length;j++){
      var info = tallaInfo(p,tallas[j]);
      if(info.barcode){ muestra = {p:p, talla:tallas[j], code:info.barcode}; break; }
    }
  }
  if(!muestra){
    var demo = '20' + '00' + '00000001';
    muestra = {p:{marca:'(ejemplo)', modelo:'Sin artículos con código', precioVenta:0, promo:{activo:false}}, talla:'40', code: demo + eanDigitoControl(demo)};
  }

  var pvp = precioConIVA(precioBaseConPromo(muestra.p));
  var anchoBC = Math.min(fmt.ancho - 8, 46);
  var altoBC  = Math.max(9, Math.min(fmt.alto * 0.42, 16));

  cont.innerHTML =
      '<div style="width:'+(fmt.ancho*esc)+'mm;height:'+(fmt.alto*esc)+'mm;background:#fff;border:1px dashed var(--line);'
    + 'padding:2.5mm 3mm;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:var(--shadow);">'
    + '<div><div style="font-size:10pt;font-weight:bold;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+escapeHtml(muestra.p.marca)+'</div>'
    + '<div style="font-size:8pt;color:#333;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+escapeHtml(muestra.p.modelo)+'</div></div>'
    + '<div style="display:flex;justify-content:center;">'+dibujarCodigo(muestra.code, anchoBC*esc, altoBC*esc)+'</div>'
    + '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:8.5pt;">'
    + '<span>Talla '+muestra.talla+'</span><span style="font-size:11pt;font-weight:bold;">'+eur(pvp)+'</span></div>'
    + '</div>';
}

function actualizarTotalEtiquetas(){

  var porHoja = fmt.cols * fmt.filas;
  var elT = document.getElementById("etiq-total");
  var elH = document.getElementById("etiq-hojas");
  if(elT) elT.textContent = total;
  if(elH) elH.textContent = Math.ceil(total/porHoja);
}

function etiquetasPorStock(){
  Object.keys(etiquetasSeleccion).forEach(function(k){
    var partes = k.split('|');
    var p = state.products.find(function(x){ return x.id===partes[0]; });
    if(p) etiquetasSeleccion[k] = tallaInfo(p,partes[1]).stock||0;
  });
  renderEtiquetasModal();
}

function etiquetasFijas(n){
  Object.keys(etiquetasSeleccion).forEach(function(k){ etiquetasSeleccion[k] = n; });
  renderEtiquetasModal();
}

function imprimirHojaEtiquetas(){
  var etiquetas = [];
  Object.keys(etiquetasSeleccion).forEach(function(k){
    var n = etiquetasSeleccion[k]||0;
    if(n<=0) return;
    var partes = k.split('|');
    var p = state.products.find(function(x){ return x.id===partes[0]; });
    if(!p) return;
    var talla = partes[1];
    var info = tallaInfo(p,talla);
    if(!info.barcode) return;
    for(var i=0;i<n;i++) etiquetas.push({p:p, talla:talla, code:info.barcode});
  });

  if(!etiquetas.length){ showToast("Indica al menos una etiqueta.", "err", false); return; }

  var fmt = formatoEtiquetaActual();
  var porHoja = fmt.cols * fmt.filas;
  var offX = state.settings.etiqOffsetX || 0;
  var offY = state.settings.etiqOffsetY || 0;
  var esc  = (state.settings.etiqEscala || 100) / 100;
  var anchoBC = Math.min(fmt.ancho - 8, 46);
  var altoBC  = Math.max(9, Math.min(fmt.alto * 0.42, 16));

  var celdas = etiquetas.map(function(e){
    var pvp = precioConIVA(precioBaseConPromo(e.p));
    return '<div class="etq">'
      + '<div class="etq-marca">'+escapeHtml(e.p.marca)+'</div>'
      + '<div class="etq-modelo">'+escapeHtml(e.p.modelo)+'</div>'
      + '<div class="etq-bc">'+dibujarCodigo(e.code, anchoBC*esc, altoBC*esc)+'</div>'
      + '<div class="etq-pie"><span>Talla '+e.talla+'</span><span class="etq-pvp">'+eur(pvp)+'</span></div>'
      + '</div>';
  }).join('');

  // Completar la última hoja con celdas vacías para no descuadrar la rejilla
  var resto = etiquetas.length % porHoja;
  if(resto) for(var i=0;i<porHoja-resto;i++) celdas += '<div class="etq etq-vacia"></div>';

  var htmlEtiquetas = `
    <!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Etiquetas</title>
    <style>
      @page{ size: A4 portrait; margin: 0; }
      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;background:#e9e9e9;font-family:Arial,Helvetica,sans-serif;}
      .hoja{
        width:210mm; min-height:297mm; background:#fff; margin:0 auto;
        padding:${(fmt.margenSup + offY).toFixed(2)}mm 0 0 ${(fmt.margenIzq + offX).toFixed(2)}mm;
        display:grid; grid-template-columns:repeat(${fmt.cols},${fmt.ancho}mm); grid-auto-rows:${fmt.alto}mm;
        page-break-after:always;
      }
      .etq{
        width:${fmt.ancho}mm; height:${fmt.alto}mm; padding:2.5mm 3mm;
        display:flex; flex-direction:column; justify-content:space-between;
        overflow:hidden;
      }
      .etq-vacia{visibility:hidden;}
      .etq-marca{font-size:10pt;font-weight:bold;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .etq-modelo{font-size:8pt;color:#333;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .etq-bc{display:flex;justify-content:center;margin:0.5mm 0;}
      .etq-pie{display:flex;justify-content:space-between;align-items:baseline;font-size:8.5pt;}
      .etq-pvp{font-size:11pt;font-weight:bold;}
      .barra-no-print{text-align:center;padding:10px;background:#333;color:#fff;font-size:13px;}
      .barra-no-print button{padding:8px 18px;font-size:14px;cursor:pointer;margin-left:10px;}
      @media print{ .barra-no-print{display:none;} html,body{background:#fff;} .hoja{margin:0;} }
    </style></head><body>
    <div class="hoja">${celdas}</div>

  `;
  imprimirDocumento(htmlEtiquetas, "Etiquetas");
  closeModal();

// Lee el archivo de imagen elegido, lo reescala (máx. 500px de lado) y lo comprime a JPEG
// para no disparar el tamaño guardado, y llama a callback(dataUrl) cuando está listo.
function procesarFotoInput(inputEl, callback){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 700;
      let w = img.width, h = img.height;
      if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      // Fondo blanco (por si la imagen original es PNG con transparencia)
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function closeModal(){ document.getElementById("modal-root").innerHTML=""; }

function actualizarPreviewPVP(){
  const el = document.getElementById("f-venta");
  const preview = document.getElementById("f-venta-preview");
  if(!el || !preview) return;
  const conIva = parseFloat(el.value)||0;
  if(conIva<=0){ preview.textContent = ""; return; }
  const ivaRate = state.settings.ivaRate;
  const sinIva = conIva/(1+ivaRate/100);
  preview.textContent = `Base imponible: ${eur(sinIva)} + IVA (${ivaRate}%)`;
}

function saveProduct(id){
  const marca = document.getElementById("f-marca").value.trim();
  const modelo = document.getElementById("f-modelo").value.trim();
  if(!marca || !modelo){ alert("Marca y modelo son obligatorios."); return; }
  const tipoArticulo = document.getElementById("f-tipo").value;
  const categoria = document.getElementById("f-categoria").value.trim();
  const genero = document.getElementById("f-genero").value;
  const precioCompra = parseFloat(document.getElementById("f-compra").value)||0;
  const pvpConIvaTecleado = parseFloat(document.getElementById("f-venta").value)||0;
  // El precio lo elige el usuario tal cual, ya con IVA incluido: no se
  // redondea a ninguna terminación "bonita". Internamente se sigue
  // guardando sin IVA (así el resto de la app no cambia), calculado por
  // simple división, sin tocar la cifra que el usuario ha decidido cobrar.
  const precioVenta = pvpConIvaTecleado/(1+state.settings.ivaRate/100);
  const promoActivo = document.getElementById("f-promo-activa").checked;
  const promoTipo = document.getElementById("f-promo-tipo").value;
  const promoValor = parseFloat(document.getElementById("f-promo-valor").value)||0;

  const tallas = {};
  if(esTipoUnico(tipoArticulo)){
    const stockEl = document.getElementById("f-bolso-stock");
    const barcodeEl = document.getElementById("f-bolso-barcode");
    tallas['ÚNICA'] = { stock: parseInt(stockEl.value)||0, barcode: barcodeEl.value.trim() };
  }else{
    document.querySelectorAll(".stock-input").forEach(inp=>{
      const t = inp.dataset.talla;
      tallas[t] = tallas[t] || {stock:0, barcode:""};
      tallas[t].stock = parseInt(inp.value)||0;
    });
    document.querySelectorAll(".barcode-input").forEach(inp=>{
      const t = inp.dataset.talla;
      tallas[t] = tallas[t] || {stock:0, barcode:""};
      tallas[t].barcode = inp.value.trim();
    });
  }

  // Autogenerar EAN-13 para tallas con stock que se queden sin código
  if(state.settings.autoEAN !== false){
    let autoGen = 0;
    Object.keys(tallas).forEach(t=>{
      if(tallas[t].stock > 0 && !tallas[t].barcode){
        const c = generarEAN13();
        if(c){ tallas[t].barcode = c; autoGen++; }
      }
    });
    if(autoGen) setTimeout(()=>showToast(autoGen+" código(s) EAN-13 generado(s) automáticamente ✓","ok"), 400);
  }

  if(id){
    const p = state.products.find(x=>x.id===id);
    Object.assign(p, {marca,modelo,tipoArticulo,categoria,genero,precioCompra,precioVenta,promo:{activo:promoActivo,tipo:promoTipo,valor:promoValor},tallas,foto:productFormFoto,_mod:Date.now()});
  }else{
    state.products.push({id:uid(),marca,modelo,tipoArticulo,categoria,genero,precioCompra,precioVenta,promo:{activo:promoActivo,tipo:promoTipo,valor:promoValor},tallas,foto:productFormFoto,_mod:Date.now()});
  }
  saveState();
  // El código quedó realmente aplicado: sus avisos son legítimos y se
  // conservan en el historial, no se retiran al cerrar.
  _avisosSesionFormulario = [];
  closeModal();
  render();
}

// guardado, sin agrupar, lo que hacía muy difícil encontrar un artículo
// con el almacén ya crecido).
function opcionesProductosPorMarca(){
  var porMarca = {};
  state.products.forEach(function(p){
    var marca = (p.marca || '(Sin marca)').trim() || '(Sin marca)';
    if(!porMarca[marca]) porMarca[marca] = [];
    porMarca[marca].push(p);
  });
  var marcas = Object.keys(porMarca).sort(function(a,b){ return a.localeCompare(b,'es',{sensitivity:'base'}); });
  return marcas.map(function(marca){
    var productos = porMarca[marca].slice().sort(function(a,b){
      return (a.modelo||'').localeCompare(b.modelo||'','es',{sensitivity:'base'});
    });
    var opciones = productos.map(function(p){
      return '<option value="'+p.id+'">'+escapeHtml(p.modelo)+'</option>';
    }).join('');
    return '<optgroup label="'+escapeHtml(marca)+'">'+opciones+'</optgroup>';
  }).join('');
}

function updateCartTalla(i, nuevaTalla){
  const line = cart[i];
  const p = state.products.find(x=>x.id===line.productId);
  if(!p) return;
  const dupIndex = cart.findIndex((l,idx)=> idx!==i && l.productId===line.productId && String(l.talla)===String(nuevaTalla));
  if(dupIndex>=0){
    cart[dupIndex].cantidad += line.cantidad;
    cart.splice(i,1);
  } else {
    const info = tallaInfo(p, nuevaTalla);
    line.talla = nuevaTalla;
    line.cantidad = Math.max(1, Math.min(line.cantidad, Math.max(info.stock,1)));
  }
  render();
}

function updateCartQty(i, value){
  const p = state.products.find(x=>x.id===cart[i].productId);
  const info = tallaInfo(p, cart[i].talla);
  const max = info.stock + cart[i].cantidad;
  cart[i].cantidad = Math.max(1, Math.min(parseInt(value)||1, max));
  render();
}

// Calcula las líneas de venta aplicando primero la promoción propia del producto (si tiene)
// y después, sobre ese subtotal, un descuento puntual opcional (p. ej. para un cliente habitual).
// El descuento se reparte proporcionalmente entre las líneas del carrito.
function computeLinesConDescuento(lines, descuento){
  const ivaRate = state.settings.ivaRate;
  const raw = lines.map(line=>{
    // --- Artículo manual (no en catálogo) ---
    if(line.productId === '__manual__'){
      const pvpConIva = line.precioManualConIva || 0;
      const baseSinIva = pvpConIva / (1 + ivaRate/100);
      let baseConDescLinea = baseSinIva;
      const dl = line.descuento;
      if(dl && dl.activo && dl.valor>0){
        const pvpLinea = pvpConIva * line.cantidad;
        const pvpDesc = dl.tipo==='porcentaje' ? pvpLinea*(1-dl.valor/100) : Math.max(0, pvpLinea-dl.valor);
        baseConDescLinea = (pvpDesc / line.cantidad) / (1 + ivaRate/100);
      }
      const rawSubtotal = baseConDescLinea * line.cantidad;
      return { line, p:null,
        marca:line.marcaManual, modelo:line.modeloManual, talla:line.tallaManual,
        baseConPromo:baseSinIva, baseConDescLinea, rawSubtotal, esManual:true,
        descuentoLineaImporte:(baseSinIva-baseConDescLinea)*line.cantidad*(1+ivaRate/100)
      };
    }
    // --- Artículo del catálogo ---
    const p = state.products.find(x=>x.id===line.productId);
    if(!p) return null;
    // 1) Precio base tras la promoción del producto (almacén)
    const baseConPromo = precioBaseConPromo(p);

    // 2) Descuento manual por línea (independiente por artículo)
    // El descuento opera siempre sobre el precio CON IVA (el que ve el cliente):
    // - Porcentaje: se reduce ese % del PVP final.
    // - Importe fijo: se resta directamente del total de la línea con IVA.
    // No se aplica el redondeo automático (,00/,50/,90/,99) porque el cliente
    // está especificando exactamente cuánto quiere pagar.
    let baseConDescLinea = baseConPromo;
    const dl = line.descuento;
    if(dl && dl.activo && dl.valor>0){
      const pvpLineaConIva = precioConIVA(baseConPromo) * line.cantidad; // total línea con IVA
      let pvpLineaDescuentado;
      if(dl.tipo==='porcentaje'){
        pvpLineaDescuentado = pvpLineaConIva * (1 - dl.valor/100);
      } else {
        // dl.valor = importe total a restar de esta línea (en €, con IVA incluido)
        pvpLineaDescuentado = Math.max(0, pvpLineaConIva - dl.valor);
      }
      // Convertir de vuelta a precio sin IVA por unidad (para que el cálculo de totales sea coherente)
      baseConDescLinea = (pvpLineaDescuentado / line.cantidad) / (1 + state.settings.ivaRate/100);
    }
    const rawSubtotal = baseConDescLinea * line.cantidad;
    return { line, p, baseConPromo, baseConDescLinea, rawSubtotal, esManual:false,
             descuentoLineaImporte: (precioConIVA(baseConPromo) - precioConIVA(baseConDescLinea)) * line.cantidad };
  }).filter(Boolean);

  const rawTotal = raw.reduce((a,r)=>a+r.rawSubtotal, 0);

  // 3) Descuento global de factura (se reparte proporcionalmente entre líneas)
  let descuentoFacturaImporte = 0;
  const descuentoFacturaPorLinea = raw.map(()=>0);
  if(descuento && descuento.valor>0){
    descuentoFacturaImporte = descuento.tipo==='porcentaje'
      ? rawTotal*(descuento.valor/100)
      : Math.min(descuento.valor, rawTotal);
    raw.forEach((r,i)=>{
      const factor = rawTotal>0 ? r.rawSubtotal/rawTotal : 0;
      descuentoFacturaPorLinea[i] = descuentoFacturaImporte * factor;
    });
  }

  let subtotalT=0, ivaT=0, totalT=0;
  const salesLines = raw.map((r,i)=>{
    const subtotal = r.rawSubtotal - descuentoFacturaPorLinea[i];
    const iva = subtotal*(state.settings.ivaRate/100);
    const total = subtotal+iva;
    const dl = r.line.descuento;

    if(r.esManual){
      subtotalT+=subtotal; ivaT+=iva; totalT+=total;
      return {
        productId:'__manual__', marca:r.marca, modelo:r.modelo, talla:r.talla, genero:'unisex',
        cantidad:r.line.cantidad, subtotal, iva, total, beneficio:subtotal, // beneficio desconocido, igual al subtotal
        precioOriginalUnit: r.baseConPromo, promoTipo:null, promoValor:null, precioTrasPromoUnit:r.baseConPromo,
        descManualActivo: !!(dl && dl.activo && dl.valor>0),
        descManualTipo: dl?.tipo||null, descManualValor: dl?.valor||null,
        descManualImporte: r.descuentoLineaImporte,
        descuentoPuntualLinea: descuentoFacturaPorLinea[i],
        esManual: true
      };
    }

    const beneficio = subtotal - (r.p.precioCompra*r.line.cantidad);
    subtotalT+=subtotal; ivaT+=iva; totalT+=total;
    const promoActiva = !!(r.p.promo && r.p.promo.activo);
    return {
      productId:r.p.id, marca:r.p.marca, modelo:r.p.modelo, talla:r.line.talla, genero:r.p.genero||'unisex',
      cantidad:r.line.cantidad, subtotal, iva, total, beneficio,
      precioOriginalUnit: r.p.precioVenta,
      promoTipo: promoActiva ? r.p.promo.tipo : null,
      promoValor: promoActiva ? r.p.promo.valor : null,
      precioTrasPromoUnit: r.baseConPromo,
      // Descuento manual por línea
      descManualActivo: !!(dl && dl.activo && dl.valor>0),
      descManualTipo: dl ? dl.tipo : null,
      descManualValor: dl ? dl.valor : null,
      descManualImporte: r.descuentoLineaImporte,
      // Descuento global de factura prorrateado a esta línea
      descuentoPuntualLinea: descuentoFacturaPorLinea[i],
      esManual: false
    };
  });
  const descuentoLineaTotal = raw.reduce((a,r)=>a+r.descuentoLineaImporte,0);
  const descuentoImporte = descuentoFacturaImporte + descuentoLineaTotal;
  return { salesLines, subtotalT, ivaT, totalT, descuentoImporte, descuentoFacturaImporte, descuentoLineaTotal };
}

function cartDescuentoActual(){
  if(!(cartDescuentoActivo && cartDescuentoValor>0)) return null;
  return { tipo: cartDescuentoTipo, valor: cartDescuentoValor };
}

function cartTotals(){
  const { subtotalT, ivaT, totalT, descuentoImporte } = computeLinesConDescuento(cart, cartDescuentoActual());
  return { subtotal:subtotalT, iva:ivaT, total:totalT, descuentoImporte };
}

// Implementación de SHA-256 en JS puro (no depende de crypto.subtle, que puede no
// estar disponible dentro del iframe con sandbox donde corre este artefacto).
// ============ SERIES DE FACTURACIÓN POR MES ============
// La serie cambia sola el día 1 a las 00:00 y rige hasta el último día
// del mes a las 23:59, según la fecha del propio ticket.
var SERIES_MES = ['E','F','M','A','MY','J','JL','AG','S','O','N','D'];

function serieDelMes(fechaIso){
  var d = fechaIso ? new Date(fechaIso) : new Date();
  // Dos cifras del año + letra del mes: 26S, 26O, 27E...
  // Al incluir el año, cada serie arranca en 0001 en enero sin que
  // puedan coincidir dos facturas con el mismo número entre ejercicios.
  return String(d.getFullYear()).slice(-2) + SERIES_MES[d.getMonth()];
}

// El número NO puede depender de cuántos tickets haya en el equipo: los
// antiguos se retiran a la biblioteca y la numeración se reiniciaría,
// generando duplicados. Se lleva un contador propio por serie.
function siguienteNumeroSerie(serie){
  if(!state.settings.contadoresSerie) state.settings.contadoresSerie = {};
  var cont = state.settings.contadoresSerie;

  if(cont[serie] === undefined){
    // Primera vez con esta serie: arrancar por encima de lo ya emitido
    var mayor = 0;
    (state.tickets || []).forEach(function(t){
      var ns = t.numSerieFactura || '';
      var partes = ns.split('/');
      if(partes.length === 2 && partes[0] === serie){
        var n = parseInt(partes[1], 10);
        if(!isNaN(n) && n > mayor) mayor = n;
      }
    });
    cont[serie] = mayor;
  }

  cont[serie] = cont[serie] + 1;
  return cont[serie];
}

async function registerTicket(lines, fechaIso, skipStock, descuento, metodoPago){
  const ticketId = uid();
  const { salesLines: computedLines, subtotalT, ivaT, totalT, descuentoImporte } = computeLinesConDescuento(lines, descuento);

  if(!skipStock){
    computedLines.forEach(cl=>{
      const p = state.products.find(x=>x.id===cl.productId);
      if(!p) return;
      const info = tallaInfo(p, cl.talla);
      p.tallas[cl.talla].stock = Math.max(0, (info.stock||0) - cl.cantidad);
    });
  }
  const salesLines = computedLines.map(cl=> ({ id:uid(), ticketId, fecha:fechaIso, ...cl }));

  const serie = serieDelMes(fechaIso);
  const numero = siguienteNumeroSerie(serie);
  const numSerieFactura = `${serie}/${String(numero).padStart(4,'0')}`;
  const descuentoInfo = (descuento && descuentoImporte>0) ? { tipo:descuento.tipo, valor:descuento.valor, importe:descuentoImporte, ambito: descuento.ambito||'factura' } : null;
  const ticket = { id:ticketId, numero, numSerieFactura, fecha:fechaIso, subtotal:subtotalT, iva:ivaT, total:totalT, descuento:descuentoInfo, metodoPago:metodoPago||'efectivo', estadoPago:'completada', datosCliente:null };
  state.tickets.push(ticket);
  state.sales.push(...salesLines);
  // Subir este ticket como documento independiente (~1 KB en vez de reescribir todo)
  setTimeout(function(){ subirTicket(ticket.id); }, 0);
  return ticket;
}

// Suma la denominación pulsada al importe entregado. Antes los billetes
// sustituían el valor y las monedas sumaban; ahora todo suma, que es lo
// natural al ir contando lo que deja el cliente.
function sumarEfectivo(valor, total){
  var inp = document.getElementById('ef-pago');
  if(!inp) return;
  var actual = parseFloat(inp.value) || 0;
  // Redondeo a céntimos para evitar arrastres del tipo 0,30000000000000004
  inp.value = (Math.round((actual + valor) * 100) / 100).toFixed(2);
  calcularCambioEfectivo(total);
}

function borrarEfectivo(total){
  var inp = document.getElementById('ef-pago');
  if(!inp) return;
  inp.value = '';
  calcularCambioEfectivo(total);
}

// Detecta pantalla táctil de forma fiable. Se usa para no enfocar campos al
// abrir un cuadro: en táctil el teclado saltaría solo y taparía los botones.
function esPantallaTactil(){
  try{
    if(navigator.maxTouchPoints !== undefined) return navigator.maxTouchPoints > 0;
    if(navigator.msMaxTouchPoints !== undefined) return navigator.msMaxTouchPoints > 0;
    if(window.matchMedia) return window.matchMedia('(pointer: coarse)').matches;
  }catch(e){}
  return 'ontouchstart' in window;
}

function calcularCambioEfectivo(total){
  var pago = parseFloat(document.getElementById('ef-pago').value) || 0;
  var resDiv = document.getElementById('ef-resultado');
  var errDiv = document.getElementById('ef-error');
  var cambioDiv = document.getElementById('ef-cambio');
  var btnCobrar = document.getElementById('ef-btn-cobrar');
  if(!resDiv) return;

  if(pago <= 0){
    resDiv.style.display='none'; errDiv.style.display='none';
    if(btnCobrar){ btnCobrar.style.opacity='0.4'; btnCobrar.style.pointerEvents='none'; }
    return;
  }
  // Comparar en céntimos enteros. El total puede llegar con arrastre de
  // coma flotante (73,450000000000003) y entonces un pago de 73,45 € se
  // consideraba insuficiente aunque fuese el importe exacto.
  var pagoCent  = Math.round(pago * 100);
  var totalCent = Math.round(total * 100);
  var cambio = (pagoCent - totalCent) / 100;
  if(pagoCent < totalCent){
    resDiv.style.display='none'; errDiv.style.display='block';
    if(btnCobrar){ btnCobrar.style.opacity='0.4'; btnCobrar.style.pointerEvents='none'; }
  } else {
    errDiv.style.display='none'; resDiv.style.display='block';
    cambioDiv.textContent = eur(cambio);
    if(btnCobrar){ btnCobrar.style.opacity='1'; btnCobrar.style.pointerEvents='auto'; }
  }
}

// ---------------- DEVOLUCIONES Y GARANTÍAS ----------------
function cantidadDevueltaDe(saleId){
  return state.devoluciones.filter(d=>d.saleId===saleId).reduce((a,d)=>a+d.cantidad,0);
}
function maxDevolvible(sale){
  return Math.max(0, sale.cantidad - cantidadDevueltaDe(sale.id));
}
function estadoDevolucion(sale){
  const devuelto = cantidadDevueltaDe(sale.id);
  if(devuelto <= 0) return null;
  // 'parcial' avisa de que la línea aún tiene pares sin devolver;
  // 'total' de que está cerrada.
  return devuelto >= sale.cantidad ? 'total' : 'parcial';
}

async function registerDevolucion(sale, cantidad, motivo, reponerStock){
  const precioUnitConIva = sale.total / sale.cantidad;
  const importe = precioUnitConIva * cantidad;
  const ivaProporcional = (sale.iva/sale.cantidad) * cantidad;
  const serie = state.settings.serieDevolucion || "DEV";
  // Contador propio, igual que las facturas: el número no puede depender de
  // cuántas devoluciones haya cargadas en este equipo.
  const numero = siguienteNumeroSerie(serie);
  const numSerie = `${serie}/${String(numero).padStart(3,'0')}`;
  const fechaIso = new Date().toISOString();

  if(reponerStock){
    const p = state.products.find(x=>x.id===sale.productId);
    if(p){
      const info = tallaInfo(p, sale.talla);
      if(!p.tallas[sale.talla]) p.tallas[sale.talla] = {stock:0, barcode:""};
      p.tallas[sale.talla].stock = (info.stock||0) + cantidad;
    }
  }

  const devolucion = {
    id: uid(), numero, numSerie, fecha: fechaIso, saleId: sale.id, ticketId: sale.ticketId,
    productId: sale.productId, marca: sale.marca, modelo: sale.modelo, talla: sale.talla, genero: sale.genero,
    cantidad, motivo, importe, iva: ivaProporcional, reponerStock: !!reponerStock
  };
  state.devoluciones.push(devolucion);
  return devolucion;
}

async function confirmarDevolucion(saleId){
  const sale = state.sales.find(s=>s.id===saleId);

  const motivo = document.getElementById("dev-motivo").value;

  const cantidad = Math.max(1, Math.min(parseInt(document.getElementById("dev-cantidad").value)||1, max));
  const reponerStock = document.getElementById("dev-reponer").checked;
  try{
    await registerDevolucion(sale, cantidad, motivo, reponerStock);

    closeModal();

    showToast(motivo==='garantia' ? "Garantía registrada ✓" : "Devolución registrada ✓", "ok");

  }
}

// ---------------- utils ----------------
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

// ============ COMPROBACIÓN DE VERSIÓN AL ARRANCAR ============
// El Service Worker puede tardar en activarse, y algunos navegadores sirven
// el HTML desde su propia caché. Esto compara la versión que se está
// ejecutando con la publicada en el servidor y, si no coinciden, limpia las
// cachés y recarga. Funciona en cualquier dispositivo, con SW o sin él.
function comprobarVersionPublicada(){
  // Navegadores antiguos (p. ej. el del TPV) pueden no tener fetch
  if(typeof fetch !== 'function') return;
  // Evitar bucles: como máximo un refresco forzado por sesión
  var yaForzado = false;
  try{ yaForzado = sessionStorage.getItem('mp-refresco-forzado') === '1'; }catch(e){}

  fetch('./index.html?v=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.text() : null; })
    .then(function(txt){
      if(!txt) return;
      var m = txt.match(/APP_VERSION\s*=\s*"([^"]+)"/);
      if(!m) return;
      var publicada = m[1];
      if(publicada === APP_VERSION) return;   // ya estamos al día

      if(yaForzado){
        // Ya se intentó en esta sesión: avisar en vez de recargar en bucle
        showToast('Hay una versión más reciente (' + publicada + '). Cierra y vuelve a abrir la app.', 'err');
        return;
      }
      try{ sessionStorage.setItem('mp-refresco-forzado','1'); }catch(e){}

      showToast('Actualizando a la versión ' + publicada + '...', 'ok', false);

      // Vaciar las cachés del navegador y volver a cargar
      var limpiar = (window.caches && caches.keys)
        ? caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })
        : Promise.resolve();

      limpiar.then(function(){
        if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
          return navigator.serviceWorker.getRegistrations().then(function(regs){
            return Promise.all(regs.map(function(r){ return r.update().catch(function(){}); }));
          });
        }
      }).catch(function(){}).then(function(){
        setTimeout(function(){ window.location.reload(); }, 800);
      });
    })
    .catch(function(){ /* sin conexión: se sigue usando lo que hay */ });
}

// Arrancar Firebase y luego cargar el estado
// Si un campo numérico empieza en "0" (precio o stock todavía sin
// rellenar) y se escribe sin borrarlo antes, el dígito se pega detrás del
// cero en vez de sustituirlo, y queda algo como "01". Vaciarlo al tocarlo
// lo evita sin depender de seleccionar texto, que en los campos numéricos
// no se comporta igual en todos los navegadores.
// Si un campo numérico empieza en "0" (precio o stock todavía sin
// rellenar) y se escribe sin borrarlo antes, el dígito se pega detrás del
// cero en vez de sustituirlo, y queda algo como "01". Vaciarlo al tocarlo
// lo evita sin depender de seleccionar texto, que en los campos numéricos
// no se comporta igual en todos los navegadores.
// El cambio de valor se retrasa al siguiente ciclo (setTimeout 0): hacerlo
// en el mismo instante en que el campo recibe el foco puede interrumpir el
// aviso interno que Android usa para decidir si muestra el teclado, y en
// el Kozen el teclado directamente no llegaba a aparecer.
// Si un campo numérico empieza en "0" (precio o stock todavía sin
// rellenar) y se escribe sin borrarlo antes, el dígito se pega detrás del
// cero en vez de sustituirlo, y queda algo como "01". Vaciarlo al tocarlo
// lo evita sin depender de seleccionar texto, que en los campos numéricos
// no se comporta igual en todos los navegadores.
// El cambio de valor se retrasa al siguiente ciclo (setTimeout 0) por
// prudencia, aunque se comprobó que el teclado que no aparecía en el Kozen
// no tenía relación con esto: era Android ocultando el teclado en pantalla
// al detectar el lector de códigos de barras como un teclado físico.
document.addEventListener('focusin', function(e){
  var el = e.target;
  if(el && el.tagName === 'INPUT' && el.type === 'number' && el.value === '0'){
    setTimeout(function(){
      if(document.activeElement === el && el.value === '0') el.value = '';
    }, 0);
  }
});
document.addEventListener('focusout', function(e){
  var el = e.target;
  if(el && el.tagName === 'INPUT' && el.type === 'number' && el.value.trim() === ''){
    el.value = '0';
  }
});

// ---- LECTOR DE CÓDIGOS GLOBAL EN VENTAS ----
// Antes había que tocar el cuadro "Esperando código de barras" antes de
// escanear. Un lector de código de barras es, para el sistema, un teclado:
// "teclea" el código y termina con Intro. La diferencia con una persona
// tecleando es la velocidad — un lector encadena los caracteres en unos
// pocos milisegundos, mucho más rápido de lo que nadie escribe a mano —,
// así que en vez de exigir el foco en un campo concreto, se detecta el
// escaneo por esa velocidad, esté el foco donde esté.
(function(){
  var buffer = '';
  var ultimaTecla = 0;
  var UMBRAL_MS = 60;     // más separado que esto, no es un lector
  var MIN_LARGO = 5;      // ningún código de barras real es más corto

  document.addEventListener('keydown', function(e){
    if(currentTab !== 'ventas') { buffer = ''; return; }

    // Si el foco está en otro campo de texto que no sea el propio cuadro
    // de escaneo, se respeta lo que el usuario esté tecleando a mano ahí
    // (el nombre de un artículo manual, una cantidad...) y no se procesa
    // como código de barras.
    var activo = document.activeElement;
    var esOtroCampo = activo && (activo.tagName === 'INPUT' || activo.tagName === 'TEXTAREA' || activo.tagName === 'SELECT')
      && activo.id !== 'scan-ventas';
    if(esOtroCampo){ buffer = ''; return; }

    var ahora = Date.now();
    if(ahora - ultimaTecla > UMBRAL_MS) buffer = '';   // demasiado lento: empieza de cero
    ultimaTecla = ahora;

    if(e.key === 'Enter'){
      if(buffer.length >= MIN_LARGO){
        handleScanVenta(buffer);
        var campo = document.getElementById('scan-ventas');
        if(campo) campo.value = '';
      }
      buffer = '';
      return;
    }
    // Solo un carácter imprimible por pulsación (letras, números...);
    // se ignoran teclas de control (Shift, Tab, flechas...)
    if(e.key.length === 1) buffer += e.key;
  });
})();

iniciarFirebase();
loadState().then(function(){
  // Aviso de actualización. Se compara con la última versión que se ejecutó
  // en ESTE dispositivo, guardada en localStorage. Así funciona sea quien sea
  // quien haya provocado la recarga: la comprobación de versión, el Service
  // Worker al activarse, o un refresco manual. Antes solo cubría el primer
  // caso y las actualizaciones del Service Worker pasaban desapercibidas.
  try{
    var CLAVE_VER = STORAGE_KEY + '-ultima-version';
    var anterior = localStorage.getItem(CLAVE_VER);
    localStorage.setItem(CLAVE_VER, APP_VERSION);
    try{ sessionStorage.removeItem('mp-actualizado-desde'); sessionStorage.removeItem('mp-refresco-forzado'); }catch(e){}

    if(anterior && anterior !== APP_VERSION){
      setTimeout(function(){
        showToast('✅ Aplicación actualizada: ' + anterior + ' → ' + APP_VERSION, 'ok', true);
      }, 900);
    } else if(!anterior){
      // Primera vez en este dispositivo: no es una actualización
      setTimeout(function(){
        showToast('Mil Pasos v' + APP_VERSION + ' lista en este dispositivo', 'ok');
      }, 900);
    }
  }catch(e){}
  // Buscar la versión más reciente publicada, en cualquier dispositivo
  setTimeout(comprobarVersionPublicada, 1200);
  // Activar escucha en tiempo real una vez cargado el estado inicial
  iniciarEscuchaFirebase();

  if(!fbTickets) return;

  // ¿Primera vez con la nueva estructura? Migrar los tickets existentes.
  if(!state.settings.ventasEnColeccion){
    migrarTicketsAColeccion().then(function(r){
      if(!r.total){
        // Sin tickets que migrar: activar directamente
        state.settings.ventasEnColeccion = true;
        saveState();
        iniciarEscuchaTickets();
        return;
      }
      if(r.fallos){
        showToast('⚠️ Migración incompleta: '+r.fallos+' ticket(s) fallaron. Se reintentará al recargar.', 'err');
        return;   // no se aligera nada; los datos siguen intactos donde estaban
      }
      aligerarDocumentoPrincipal().then(function(ok){
        if(ok) iniciarEscuchaTickets();
      });
    });
  } else {
    iniciarEscuchaTickets();
  }
  revisarOcupacion();
});

// Reloj en tiempo real en la cabecera
function actualizarReloj(){
  const el = document.getElementById('header-clock');
  if(!el) return;
  const ahora = new Date();
  const fecha = ahora.toLocaleDateString('es-ES', {weekday:'short', day:'2-digit', month:'short'});
  const hora  = ahora.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  el.textContent = fecha + ' · ' + hora;
}
actualizarReloj();
setInterval(actualizarReloj, 1000);

// Registrar el Service Worker — con manejo de errores robusto para dispositivos
// como Kozen donde el SW puede no estar disponible (protocolo file://, WebView restringido, etc.)
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.update();

      // Activa de inmediato cualquier versión nueva, sin preguntar.
      function activarSiHay(){
        // Caso 1: quedó una versión esperando de una visita anterior.
        // Sin esto la actualización se queda bloqueada para siempre.
        if(reg.waiting){ reg.waiting.postMessage('skipWaiting'); return; }
        // Caso 2: se está instalando ahora mismo
        if(reg.installing){
          reg.installing.addEventListener('statechange', function(){
            if(this.state === 'installed' && navigator.serviceWorker.controller){
              this.postMessage('skipWaiting');
            }
          });
        }
      }
      activarSiHay();

      reg.addEventListener('updatefound', () => {
        const nuevoSW = reg.installing;
        if(!nuevoSW) return;
        nuevoSW.addEventListener('statechange', () => {
          if(nuevoSW.state === 'installed' && navigator.serviceWorker.controller){
            nuevoSW.postMessage('skipWaiting');
          }
        });
      });

      // Recarga automática, pero nunca en mitad de un cobro
      let recargando = false;
      function recargarCuandoSeaSeguro(){
        if(recargando) return;
        var hayCarrito  = (typeof cart !== 'undefined' && cart && cart.length > 0);
        var hayModal    = !!(document.getElementById('modal-root') && document.getElementById('modal-root').innerHTML.trim());
        if(hayCarrito || hayModal){
          // Esperar a terminar la venta; se reintenta cada 5 segundos
          setTimeout(recargarCuandoSeaSeguro, 5000);
          return;
        }
        recargando = true;
        window.location.reload();
      }
      navigator.serviceWorker.addEventListener('controllerchange', recargarCuandoSeaSeguro);

      // Aviso que envía el propio Service Worker al activarse
      navigator.serviceWorker.addEventListener('message', ev => {
        if(ev.data && ev.data.tipo === 'nueva-version') recargarCuandoSeaSeguro();
      });

      // Buscar versión nueva cada 5 minutos (terminal siempre encendido, p.ej. el TPV)
      function buscarActualizacion(){
        try{
          var p = reg.update();
          // En navegadores antiguos update() no devuelve promesa
          if(p && typeof p.then === 'function') p.then(activarSiHay).catch(function(){});
          else setTimeout(activarSiHay, 1500);
        }catch(e){}
      }
      setInterval(buscarActualizacion, 5*60*1000);
      // Y al volver a la app tras tenerla en segundo plano (móvil)
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible'){ buscarActualizacion(); comprobarVersionPublicada(); }
      });
    }).catch(err => console.log('SW no disponible en este entorno:', err));
  });
}

// Capturar errores JavaScript no manejados para mostrar un mensaje útil en lugar de pantalla en blanco
window.onerror = function(msg, src, line, col, err){
  const ya = document.getElementById('fatal-error');
  if(ya) return;
  const div = document.createElement('div');
  div.id = 'fatal-error';
  div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;text-align:center;';
  div.innerHTML = '<div style="font-size:48px;margin-bottom:16px;">⚠️</div>'
    + '<h2 style="color:#E53E3E;margin-bottom:8px;">Error al cargar la app</h2>'
    + '<p style="color:#555;margin-bottom:20px;">' + (msg||'Error desconocido') + '</p>'
    + '<button onclick="location.reload()" style="background:#239886;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:16px;cursor:pointer;">🔄 Reintentar</button>'
    + '<p style="color:#999;font-size:12px;margin-top:16px;">Línea ' + line + ' · ' + (src||'') + '</p>';
  document.body.appendChild(div);
  return false;
};
