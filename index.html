<title>Mil Pasos — Zapatería y complementos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    /* Marca "Mil Pasos" — tomados del logotipo */
    --marca-menta:#AEFFDF;
    --marca-menta-med:#70D0B4;
    --marca-menta-osc:#239886;
    --marca-verde-osc:#307757;
    --marca-lila:#D7D7F3;
    --marca-negro:#010101;
    --canvas:#F1FAF6;
    --paper:#FFFFFF;
    --ink:#10231D;
    --ink-dim:#456459;
    --line:#D5EDE3;
    --coral:#1F8F72;
    --coral-dark:#146B55;
    --teal:#239886;
    --teal-light:#DFFBF0;
    --gold:#F2B705;
    --gold-dark:#B98600;
    --violet:#7A6BC4;
    --violet-light:#D7D7F3;
    --red:#E63946;
    --red-light:#FDEBEC;
    --bg:#0C2620;
    --panel:#123A31;
    --panel-light:#1A4E42;
    --text:#EAFBF4;
    --text-dim:#8FBCAD;
    --amber:var(--gold);
    --green:var(--teal);
    --blue:var(--violet);
    --receipt:var(--canvas);
    --receipt-alt:#EAEBE3;
    --receipt-line:var(--line);
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 2px 10px rgba(30,26,43,.06), 0 10px 24px rgba(30,26,43,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:var(--font-body);}
  #app{width:100%;max-width:100%;margin:0;}

  /* ---- cabecera ---- */
  .console{
    background:var(--paper);color:var(--ink);padding:14px 24px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(35,152,134,.14);flex-wrap:wrap;
    background:linear-gradient(90deg,#8FE5C8 0%,var(--marca-menta) 40%,var(--marca-menta) 60%,#8FE5C8 100%);
  }
  .console-left{display:flex;align-items:center;gap:12px;}
  .logo-mark{
    width:42px;height:42px;border-radius:50%;
    box-shadow:0 3px 10px rgba(35,152,134,.30);
    flex-shrink:0;overflow:hidden;
  }
  .logo-mark img{width:100%;height:100%;display:block;object-fit:cover;}
  .brand-led{
    font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.3px;
    color:var(--marca-negro);text-transform:none;
  }
  .brand-sub{
    font-size:8.5px;letter-spacing:2.2px;color:#144036;
    font-weight:600;text-transform:uppercase;
  }
  .barcode-deco{display:none;}
  .tabs{display:flex;gap:6px;background:rgba(255,255,255,.55);padding:5px;border-radius:999px;}
  .tabs button{
    font-family:var(--font-display);font-size:13.5px;font-weight:700;letter-spacing:.1px;
    background:transparent;border:none;color:var(--ink-dim);
    padding:9px 18px;cursor:pointer;border-radius:999px;display:flex;align-items:center;gap:7px;
    transition:background .15s ease, color .15s ease;
  }
  .tabs button.active{color:var(--marca-menta);background:var(--marca-negro);}
  .tabs button:hover:not(.active){color:var(--ink);background:#fff;}

  main.receipt-area{background:var(--canvas);color:var(--ink);padding:22px clamp(10px,2.2vw,32px) 60px;min-height:70vh;}

  h2.section-title{
    font-family:var(--font-display);font-size:23px;font-weight:800;letter-spacing:-.3px;color:var(--ink);
    margin:4px 0 18px;display:flex;align-items:center;gap:10px;text-transform:none;
  }
  h2.section-title:before{
    content:"";width:8px;height:24px;border-radius:4px;display:inline-block;
    background:var(--marca-lila);
  }
  h3.sub-title{font-family:var(--font-display);font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-dim);margin:20px 0 10px;}

  /* ---- panel de escaneo (elemento distintivo, único bloque oscuro) ---- */
  .scan-console{
    background:var(--marca-lila);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;
    box-shadow:0 4px 14px rgba(122,107,196,.22);
  }
  .scan-label{font-family:var(--font-mono);font-size:11px;color:var(--marca-negro);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;}
  .scan-row{display:flex;align-items:center;gap:10px;}
  .scan-cursor{color:var(--marca-negro);animation:blink 1s step-start infinite;font-family:var(--font-mono);}
  @keyframes blink{50%{opacity:0;}}
  input.scan-input{
    flex:1;background:#FFFFFF;border:1px solid #B6B6E2;color:var(--marca-negro);
    font-family:var(--font-mono);font-size:18px;letter-spacing:2px;padding:12px 14px;border-radius:var(--radius-sm);
  }
  input.scan-input::placeholder{color:#6A6A8C;}
  input.scan-input:focus{outline:none;border-color:var(--marca-menta-osc);box-shadow:0 0 0 3px rgba(35,152,134,.22);}

  /* Pila de avisos: no desaparecen solos, se cierran con un clic */
  #toast-stack{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:8px;align-items:center;
    z-index:100;max-width:min(92vw,560px);pointer-events:none;
  }
  .toast{
    background:var(--ink);color:#fff;font-family:var(--font-body);font-weight:600;font-size:13.5px;
    padding:12px 42px 12px 22px;border-radius:999px;border:none;position:relative;
    box-shadow:0 8px 20px rgba(16,35,29,.32);cursor:pointer;pointer-events:auto;
    opacity:0;transform:translateY(12px);transition:opacity .2s ease, transform .2s ease;
    max-width:100%;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.saliendo{opacity:0;transform:translateY(8px) scale(.96);}
  .toast:after{
    content:"✕";position:absolute;right:16px;top:50%;transform:translateY(-50%);
    font-size:12px;font-weight:700;opacity:.65;
  }
  .toast:hover:after{opacity:1;}
  .toast.ok{background:var(--teal);}
  .toast.err{background:var(--red);}
  .toast-contador{
    background:var(--marca-negro);color:var(--marca-menta);font-size:11.5px;font-weight:700;
    padding:5px 14px;border-radius:999px;pointer-events:auto;cursor:pointer;
  }

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  input,select{
    font-family:var(--font-body);font-size:14px;padding:9px 12px;border:1.5px solid var(--line);
    border-radius:var(--radius-sm);background:#fff;color:var(--ink);
  }
  input:focus,select:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-light);}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-dim);display:block;margin-bottom:4px;font-weight:700;}
  .field{margin-bottom:12px;}
  .field-row{display:flex;gap:12px;flex-wrap:wrap;}
  .field-row .field{flex:1;min-width:140px;}

  button.btn{
    font-family:var(--font-body);font-weight:700;font-size:13.5px;cursor:pointer;
    padding:10px 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;
    transition:transform .1s ease, box-shadow .15s ease;
  }
  button.btn:hover{background:#000;}
  button.btn:active{transform:scale(.97);}
  button.btn.accent{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 4px 12px rgba(255,90,60,.35);}
  button.btn.accent:hover{background:var(--coral-dark);}
  button.btn.secondary{background:#fff;color:var(--ink);border-color:var(--line);}
  button.btn.secondary:hover{background:var(--canvas);}
  button.btn.danger{background:transparent;color:var(--red);border-color:var(--red);}
  button.btn.danger:hover{background:var(--red);color:#fff;}
  button.btn.small{padding:6px 13px;font-size:12px;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:clamp(10px,1.4vw,18px);}

  .ticket{background:#fff;border:none;box-shadow:var(--shadow);border-radius:var(--radius);padding:18px;position:relative;}
  .product-photo{
    margin:-18px -18px 14px -18px;height:170px;background-size:contain;background-repeat:no-repeat;background-position:center;
    border-radius:var(--radius) var(--radius) 0 0;background-color:#fff;border-bottom:1px solid var(--line);
  }
  .ticket-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px;}
  .ticket-head h3{font-family:var(--font-display);font-size:18px;font-weight:800;margin:0;color:var(--ink);text-transform:none;}
  .ticket-head .modelo{font-size:12.5px;color:var(--ink-dim);}
  .ticket-cat{font-family:var(--font-body);font-size:10.5px;font-weight:700;color:var(--violet);background:var(--violet-light);padding:3px 9px;border-radius:999px;text-transform:none;}
  .genero-badge{font-family:var(--font-body);font-size:10.5px;padding:3px 9px;border-radius:999px;text-transform:none;font-weight:700;}
  .genero-mujer{color:#A8266B;background:#FCE7F1;}
  .genero-hombre{color:#2451B8;background:#E7EEFD;}
  .genero-unisex{color:var(--ink-dim);background:var(--canvas);}
  .genero-nino{color:#1E8A62;background:var(--teal-light);}
  .dev-badge{font-family:var(--font-body);font-size:10.5px;padding:3px 9px;border-radius:999px;text-transform:none;font-weight:700;}
  .dev-parcial{background:#E8A33D;color:#3A2500;}
  .dev-total{background:var(--red);color:#fff;}
  .estado-completada{background:var(--teal-light);color:var(--teal);font-weight:700;font-size:10.5px;padding:3px 9px;border-radius:999px;}
  .estado-pendiente{background:#FFF3D2;color:#8A6300;font-weight:700;font-size:10.5px;padding:3px 9px;border-radius:999px;cursor:pointer;border:none;}
  .promo-breakdown{font-family:var(--font-mono);font-size:10.5px;color:var(--teal);margin-top:2px;}
  .promo-breakdown s{color:var(--ink-dim);}
  .icon-chip{
    width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:22px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);
  }
  .icon-chip.tipo-zapatos{background:#FFE9E3;}
  .icon-chip.tipo-bolsos{background:var(--violet-light);}
  .icon-chip.tipo-ropa_bebe{background:var(--teal-light);}

  .receipt{font-family:var(--font-mono);font-size:11px;line-height:1.5;color:#111;background:#fff;padding:8px 6px;width:280px;margin:0 auto;box-shadow:0 0 0 1px var(--receipt-line);}
  .receipt hr{border:none;border-top:1px dashed #999;margin:8px 0;}
  .r-center{text-align:center;}
  .r-bold{font-weight:bold;}
  .r-row{display:flex;justify-content:space-between;gap:10px;}
  .r-total{font-size:15px;font-weight:bold;border-top:1px solid #111;margin-top:4px;padding-top:4px;}
  .r-item{margin:6px 0;}
  .r-item-name{font-weight:bold;}
  .r-item-row{display:flex;justify-content:space-between;}
  .r-promo{font-size:10.5px;color:#444;}
  .r-promo s{color:#999;}

  @media print{
    body *{visibility:hidden;}
    #receipt-printable, #receipt-printable *{visibility:visible;}
    #receipt-printable{position:absolute;left:0;top:0;width:80mm;}
    .no-print{display:none !important;}
  }

  .price-row{display:flex;gap:14px;font-family:var(--font-mono);font-size:12.5px;margin:10px 0;color:var(--ink-dim);flex-wrap:wrap;}
  .price-row b{color:var(--ink);}
  .promo-badge{display:inline-block;background:var(--gold);color:#3a2c00;font-size:10.5px;font-family:var(--font-body);font-weight:700;padding:3px 9px;border-radius:999px;margin-left:6px;}

  .studs{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 14px;}
  .stud{
    min-width:36px;height:36px;padding:0 8px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:9.5px;font-weight:bold;flex-direction:column;line-height:1;
    border:none;color:#0B6B5F;background:var(--teal-light);
  }
  .stud small{font-size:9px;font-weight:normal;opacity:.75;}
  .stud.low{background:#FFF3D2;color:#8A6300;}
  .stud.empty{background:var(--red-light);color:var(--red);}
  .stud.has-code:after{content:"";}
  .tipo-badge{font-family:var(--font-body);font-size:10.5px;padding:3px 9px;border-radius:999px;text-transform:none;font-weight:700;color:var(--coral-dark);background:#FFE9E3;}

  .ticket-actions{display:flex;gap:8px;margin-top:10px;border-top:1px dashed var(--receipt-line);padding-top:10px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(22,18,33,.55);display:flex;align-items:flex-start;
    justify-content:center;padding:40px 16px;overflow:auto;z-index:50;
  }
  .modal{background:#fff;border:none;box-shadow:0 20px 50px rgba(22,18,33,.35);border-radius:var(--radius);padding:26px;max-width:600px;width:100%;}
  .modal h3{font-family:var(--font-display);font-weight:800;margin-top:0;color:var(--ink);text-transform:none;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow);}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);}
  th{font-family:var(--font-body);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-dim);background:var(--canvas);}

  /* Dentro de cada día los tickets alternan blanco / sombreado, empezando
     siempre en blanco. Nunca dos seguidos del mismo tono. */
  tr.ticket-row-a{background:#FFFFFF;}
  tr.ticket-row-b{background:#E4DEF5;}
  /* Al pasar el ratón se cambia de COLOR (menta de la marca), no solo de
     intensidad: así el resaltado nunca se confunde con las filas lila.
     Cada tono conserva su propia versión para no perder de vista si el
     ticket era blanco o sombreado. */
  tbody tr.ticket-row-a:hover{background:#CFF3E3;}
  tbody tr.ticket-row-b:hover{background:#A5E3CB;}
  tbody tr.ticket-row-a:hover td, tbody tr.ticket-row-b:hover td{background:transparent;}
  tbody tr.ticket-row-a:hover td:first-child, tbody tr.ticket-row-b:hover td:first-child{
    box-shadow:inset 4px 0 0 var(--marca-menta-osc);
  }
  tr.dia-sep td{
    background:#C3BAE8;
    color:var(--marca-negro);
    font-family:var(--font-display);
    font-weight:800;font-size:12.5px;letter-spacing:.4px;
    padding:10px 12px;border-bottom:2px solid #8E7FC9;border-top:2px solid #8E7FC9;
    text-transform:capitalize;position:sticky;left:0;
  }
  tr.dia-sep td .dia-total{float:right;font-weight:700;font-variant-numeric:tabular-nums;}
  tr.ticket-spacer td{height:8px;border:none;background:transparent;padding:0;}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
  th.sortable:hover{background:var(--canvas);color:var(--coral);}
  th.sortable.sort-active{color:var(--coral);}
  th.sortable .sort-icon{display:inline-block;margin-left:4px;font-size:10px;opacity:0.4;vertical-align:middle;}
  th.sortable.sort-active .sort-icon{opacity:1;}
  td.num,th.num{text-align:right;font-family:var(--font-mono);}

  table.talla-editor td, table.talla-editor th{padding:6px 8px;}
  table.talla-editor input{width:100%;padding:5px 6px;font-size:12.5px;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
  .kpi{background:#fff;box-shadow:var(--shadow);border-radius:var(--radius);padding:16px 18px;display:flex;gap:12px;align-items:flex-start;}
  .kpi .kpi-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--violet-light);flex-shrink:0;}
  .kpi .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-dim);font-weight:700;}
  .kpi .value{font-family:var(--font-display);font-size:22px;color:var(--ink);margin-top:3px;font-weight:800;}
  .kpi.beneficio .kpi-icon{background:var(--teal-light);}
  .kpi.beneficio .value{color:var(--teal);}

  .note{background:#FFF8E1;border-left:4px solid var(--gold);padding:11px 14px;font-size:13px;color:#6b5300;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:12px;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-dim);font-family:var(--font-display);font-size:16px;font-weight:700;}

  /* Dos columnas para paneles secundarios: reduce el scroll de Informes */
  .panel-duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-bottom:8px;}
  @media (max-width:900px){ .panel-duo{grid-template-columns:1fr;} }
  .charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:10px;}
  .chart-card{background:#fff;box-shadow:var(--shadow);border-radius:var(--radius);padding:18px;}
  .chart-card h4{margin:0 0 12px;font-family:var(--font-display);font-size:13.5px;font-weight:800;text-transform:none;letter-spacing:0;color:var(--ink);}
  .chart-card canvas{max-height:260px;}
  .charts-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  .cart-empty{padding:20px;text-align:center;color:var(--ink-dim);font-size:13.5px;}

  .model-checks{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto;padding:4px 2px;}
  .marca-details{border-bottom:1px solid var(--receipt-line);padding:4px 0;}
  .marca-details summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);padding:4px 2px;}
  .marca-details summary::-webkit-details-marker{display:none;}
  .marca-details summary:before{content:"▸";font-size:11px;color:var(--ink-dim);width:10px;display:inline-block;}
  .marca-details[open] summary:before{content:"▾";}
  .marca-details summary input{width:auto;margin:0;}
  .marca-count{font-size:11px;color:var(--ink-dim);font-weight:normal;}
  .modelo-checks{display:flex;flex-direction:column;gap:3px;padding:4px 0 8px 26px;}
  .model-check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);text-transform:none;letter-spacing:0;white-space:nowrap;}
  .model-check input{width:auto;}

  #btn-abrir-caja:hover{opacity:0.85;}
  #header-clock{font-variant-numeric:tabular-nums;}
  @media(max-width:640px){
    #header-clock{display:none;}
    #btn-abrir-caja{padding:7px 10px;font-size:12px;}
    #btn-abrir-caja span{display:none;}
  }
  @media (min-width:641px) and (max-width:1024px){
    main.receipt-area{padding:16px 14px 60px;}
    .grid-cards{grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:12px;}
    .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
    .tabs button{padding:9px 12px;font-size:12.5px;}
    table{font-size:12.5px;}
    th,td{padding:8px 7px;}
  }
  @media (max-width:900px){
    .charts-grid, .charts-grid-2{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .console{flex-direction:column;align-items:stretch;padding:12px 14px;gap:10px;}
    .console-left{justify-content:center;}
    .tabs{width:100%;justify-content:space-between;}
    .tabs button{flex:1;justify-content:center;padding:9px 4px;font-size:11px;}
    main.receipt-area{padding:12px 8px 60px;}
    .grid-cards{grid-template-columns:1fr;}
    .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
    .kpi{padding:11px 12px;}
    .modal{padding:14px;max-width:100%;margin:8px;}
    .modal-actions{flex-wrap:wrap;gap:8px;}
    .modal-actions .btn{flex:1;min-width:120px;text-align:center;}
    .field-row{flex-direction:column;gap:8px;}
    .field-row .field{min-width:0;width:100%;}
    .toolbar{gap:6px;flex-wrap:wrap;}
    .toolbar select,.toolbar input[type="text"],.toolbar input[type="date"]{width:100%;min-width:0;}
    button.btn{padding:10px 12px;font-size:13px;}
    button.btn.small{padding:7px 10px;font-size:12px;}
    h2.section-title{font-size:18px;}
    .ticket{padding:12px;}
    .scan-console{padding:12px 10px;}
    input.scan-input{font-size:15px;letter-spacing:1px;padding:10px 10px;}
    .ticket-actions{flex-wrap:wrap;gap:6px;}
    .ticket-actions .btn{flex:1;min-width:100px;text-align:center;justify-content:center;}
    .price-row{flex-wrap:wrap;gap:8px;font-size:12px;}
    table{font-size:12px;}
    th,td{padding:7px 6px;}
    .sub-title{font-size:14px;}
    .product-photo{height:140px;}
  }
  @media (max-width:400px){
    .tabs button{font-size:10px;padding:8px 2px;}
    main.receipt-area{padding:10px 6px 60px;}
    .modal{padding:12px;margin:4px;}
    button.btn{padding:9px 10px;font-size:12px;}
  }
</style>
</head>
<body>
<div id="app">

<script>
const APP_VERSION = "11.13";
const STORAGE_KEY = "zapateria-data-v2";

// ---- FIREBASE: sincronización entre dispositivos ----
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB7RiGRQLEILzqGj_Bi2T65DTvn_uv4njs",
  authDomain: "mi-zap.firebaseapp.com",
  projectId: "mi-zap",
  storageBucket: "mi-zap.firebasestorage.app",
  messagingSenderId: "1049246581162",
  appId: "1:1049246581162:web:da09671b042c3c42402bd3"
};

var fbApp = null;
var fbDb  = null;
var fbRef = null;
var fbTickets = null;   // subcolección: un documento por ticket
var fbEscuchando = false;
var _guardandoEnFb = false; // evita bucle: guardar→onSnapshot→guardar

function iniciarFirebase(){
  try{
    if(typeof firebase === 'undefined'){
      console.warn('Firebase SDK no cargado — sin sincronización en la nube');
      setTimeout(function(){ showToast('⚠️ Firebase no disponible. Comprueba la conexión a internet.','err'); }, 2000);
      return;
    }
    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    fbDb  = firebase.firestore();
    fbRef = fbDb.collection('zapateria').doc('estado');
    fbTickets = fbRef.collection('tickets');
    fbDb.enablePersistence({synchronizeTabs:true}).catch(function(err){
      console.log('Firebase offline persistence:', err.code);
    });
    console.log('Firebase iniciado ✓');
    setTimeout(function(){ showToast('☁️ Firebase conectado','ok'); }, 1500);
  }catch(e){
    console.error('Error iniciando Firebase:', e);
    setTimeout(function(){ showToast('⚠️ Error Firebase: '+e.message,'err'); }, 1500);
  }
}

// Guarda en Firebase todo el estado EXCEPTO las fotos (pueden exceder el límite de 1MB)
// Las fotos se guardan solo en localStorage de cada dispositivo.
var _timerSync = null;
// ============ AJUSTES PROPIOS DE CADA DISPOSITIVO ============
// Estos NO viajan por Firebase: son distintos en el PC, el móvil y el Kozen.
// - bloqueEAN / contadorEAN: si se copiaran, dos terminales generarían el mismo código.
// - etiq*: cada terminal puede imprimir en una impresora distinta.
// - cajon*: el hardware conectado es propio de cada terminal.
// - escpos*/rawbtMetodo: la impresora térmica y el método de conexión con
//   RawBT son del terminal físico que la tiene enchufada (el Kozen). Si esto
//   viajase por Firebase, abrir la app en el móvil o el PC (donde no hay
//   impresora) podría apagar la impresión del Kozen sin que nadie la tocara
//   allí — fue justo lo que pasó y dejó de imprimir en silencio.
var AJUSTES_LOCALES = ['bloqueEAN','contadorEAN','etiqFormato','etiqOffsetX','etiqOffsetY','etiqEscala','cajonHabilitado','cajonModo',
  'escposActivo','rawbtMetodo','escposEuro','escposEuroByte','escposMargenPie','escposLogo','escposLogoOffsetX','escposPagina','escposColumnas','escposCortar','escposCajon'];

function guardarAjustesLocales(){
  try{
    if(!state || !state.settings) return;
    var loc = {};
    AJUSTES_LOCALES.forEach(function(k){
      if(state.settings[k] !== undefined) loc[k] = state.settings[k];
    });
    localStorage.setItem(STORAGE_KEY+'-dispositivo', JSON.stringify(loc));
  }catch(e){}
}

var AJUSTES_LOCALES_DEFECTO = {
  bloqueEAN:null, contadorEAN:0, etiqFormato:'apli01787',
  etiqOffsetX:0, etiqOffsetY:0, etiqEscala:100,
  cajonHabilitado:false, cajonModo:null,
  escposActivo:false, rawbtMetodo:'auto', escposEuro:'eur', escposEuroByte:null,
  escposMargenPie:6, escposLogo:true, escposLogoOffsetX:0, escposPagina:19, escposColumnas:48,
  escposCortar:true, escposCajon:true
};

function aplicarAjustesLocales(){
  try{
    if(!state) return;
    if(!state.settings) state.settings = {};
    var loc = {};
    try{
      var raw = localStorage.getItem(STORAGE_KEY+'-dispositivo');
      if(raw) loc = JSON.parse(raw) || {};
    }catch(e){}
    AJUSTES_LOCALES.forEach(function(k){
      if(loc[k] !== undefined) state.settings[k] = loc[k];
      else if(state.settings[k] === undefined) state.settings[k] = AJUSTES_LOCALES_DEFECTO[k];
    });
  }catch(e){}
}

function limpiarAjustesLocales(obj){
  if(obj && obj.settings){
    AJUSTES_LOCALES.forEach(function(k){ delete obj.settings[k]; });
  }
  return obj;
}

// ============ FUSIÓN DE ESTADOS (evita perder ventas) ============
// Firebase guarda un único documento. Si dos terminales trabajan a la vez
// y uno sustituye el estado del otro, se pierden ventas. Aquí no se
// sustituye: se combinan los dos estados registro a registro por su id.

function _indicePorId(lista){
  var idx = {};
  (lista||[]).forEach(function(r){ if(r && r.id) idx[r.id] = r; });
  return idx;
}

// Une dos listas sin perder nada. Ante el mismo id, gana el más reciente.
function _unir(listaA, listaB, campoFecha){
  var res = {};
  [listaA||[], listaB||[]].forEach(function(lista){
    lista.forEach(function(r){
      if(!r || !r.id) return;
      var prev = res[r.id];
      if(!prev){ res[r.id] = r; return; }
      var fa = (r._mod || (campoFecha ? r[campoFecha] : 0) || 0);
      var fb = (prev._mod || (campoFecha ? prev[campoFecha] : 0) || 0);
      if(String(fa) > String(fb)) res[r.id] = r;
    });
  });
  return Object.keys(res).map(function(k){ return res[k]; });
}

// Devuelve las unidades que hay que descontar/reponer por registros que
// el otro lado todavía no conocía.
function _ajusteStock(registrosNuevos, signo, acumulador){
  registrosNuevos.forEach(function(r){
    if(!r.productId || !r.talla) return;
    var clave = r.productId + '|' + r.talla;
    acumulador[clave] = (acumulador[clave] || 0) + signo * (r.cantidad || 0);
  });
}

function fusionarEstados(local, remoto){
  if(!local || !local.products) return remoto;
  if(!remoto || !remoto.products) return local;

  var resultado = JSON.parse(JSON.stringify(remoto));

  // --- Registros que cada lado tiene y el otro no ---
  var remSales = _indicePorId(remoto.sales);
  var locSales = _indicePorId(local.sales);
  var remDevs  = _indicePorId(remoto.devoluciones);
  var locDevs  = _indicePorId(local.devoluciones);

  var ventasSoloLocales = (local.sales||[]).filter(function(s){ return s.id && !remSales[s.id]; });
  var devsSoloLocales   = (local.devoluciones||[]).filter(function(d){ return d.id && !remDevs[d.id]; });

  // --- Unir las tres colecciones: nunca se descarta un registro ---
  resultado.sales        = _unir(local.sales,        remoto.sales,        'fecha');
  resultado.tickets      = _unir(local.tickets,      remoto.tickets,      'fecha');
  resultado.devoluciones = _unir(local.devoluciones, remoto.devoluciones, 'fecha');

  // --- Productos: se conserva la ficha más reciente de cada uno ---
  resultado.products = _unir(local.products, remoto.products, null);

  // --- Aplicar borrados hechos en cualquiera de los dos lados ---
  resultado.borrados = {};
  [local.borrados||{}, remoto.borrados||{}].forEach(function(b){
    Object.keys(b).forEach(function(id){
      if(!resultado.borrados[id] || b[id] > resultado.borrados[id]) resultado.borrados[id] = b[id];
    });
  });
  resultado.products = resultado.products.filter(function(p){
    var borradoEn = resultado.borrados[p.id];
    if(!borradoEn) return true;
    // Si se editó después de borrarlo, el producto se conserva
    return (p._mod || 0) > borradoEn;
  });

  // --- Stock ---
  // La base debe ser el stock REMOTO (que ya refleja las ventas que la nube
  // conoce). Sobre él se aplican solo las ventas y devoluciones que este
  // terminal hizo y la nube todavía no tenía. Si se tomara el stock local
  // como base, esas ventas se descontarían dos veces.
  var locProds = _indicePorId(local.products);
  var remProds = _indicePorId(remoto.products);

  // Productos cuya ficha se editó aquí después que en la nube: en ellos el
  // stock lo tecleó el usuario (entrada de mercancía), así que manda el local
  // y no se le aplican ajustes.
  var editadosAqui = {};

  resultado.products.forEach(function(p){
    var loc = locProds[p.id], rem = remProds[p.id];
    if(!rem) return;                     // producto nuevo de este terminal
    if(loc && (loc._mod||0) > (rem._mod||0)){ editadosAqui[p.id] = true; return; }
    // Copiar el stock remoto talla a talla, conservando los códigos de barras
    if(!p.tallas) p.tallas = {};
    Object.keys(rem.tallas||{}).forEach(function(t){
      if(!p.tallas[t]) p.tallas[t] = {stock:0, barcode:""};
      p.tallas[t].stock = (rem.tallas[t].stock)||0;
    });
  });

  var ajustes = {};
  _ajusteStock(ventasSoloLocales.filter(function(s){ return !editadosAqui[s.productId]; }), -1, ajustes);
  devsSoloLocales.forEach(function(d){
    if(d.reponerStock && d.productId && d.talla && !editadosAqui[d.productId]){
      var k = d.productId + '|' + d.talla;
      ajustes[k] = (ajustes[k] || 0) + (d.cantidad || 0);
    }
  });

  Object.keys(ajustes).forEach(function(clave){
    var partes = clave.split('|');
    var p = resultado.products.find(function(x){ return x.id === partes[0]; });
    if(!p || !p.tallas) return;
    if(!p.tallas[partes[1]]) p.tallas[partes[1]] = {stock:0, barcode:""};
    var actual = p.tallas[partes[1]].stock || 0;
    p.tallas[partes[1]].stock = Math.max(0, actual + ajustes[clave]);
  });

  // --- Los avisos son de este terminal: no se pierden al fusionar ---
  resultado.avisos = (local.avisos && local.avisos.length) ? local.avisos : (remoto.avisos || []);

  // --- Ordenar por fecha para que el historial quede coherente ---
  resultado.sales.sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||'')); });
  resultado.tickets.sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||'')); });
  resultado.devoluciones.sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||'')); });

  resultado._fusionadas = ventasSoloLocales.length;
  return resultado;
}

// Detecta números de factura repetidos (dos terminales sin conexión pueden
// asignar el mismo). No se renumera nada: se avisa para poder corregirlo.
function detectarFacturasDuplicadas(){
  var vistos = {}, dup = {};
  (state.tickets||[]).forEach(function(t){
    if(!t.numSerieFactura) return;
    if(vistos[t.numSerieFactura]) dup[t.numSerieFactura] = true;
    vistos[t.numSerieFactura] = true;
  });
  return Object.keys(dup);
}

// Detecta códigos de barras asignados a más de un artículo o talla
function detectarCodigosDuplicados(){
  var vistos = {}, dup = {};
  (state.products||[]).forEach(function(p){
    tallasParaTipo(p.tipoArticulo||'zapatos').forEach(function(t){
      var bc = tallaInfo(p,t).barcode;
      if(!bc) return;
      var etiqueta = p.marca + ' ' + p.modelo + ' T' + t;
      if(vistos[bc]){
        if(!dup[bc]) dup[bc] = [vistos[bc]];
        dup[bc].push(etiqueta);
      } else {
        vistos[bc] = etiqueta;
      }
    });
  });
  return dup;
}

// La comprobación se lanza en CADA sincronización. Si avisara siempre,
// bastaría con guardar cualquier cosa para que el historial se rellenara
// justo después de borrarlo. Solo se avisa cuando el problema cambia.
var _ultimaIncidencia = null;

function firmaIncidencias(){
  var facturas = detectarFacturasDuplicadas();
  var mapaCod = detectarCodigosDuplicados();
  var codigos = Object.keys(mapaCod);
  // La firma incluye cuántos artículos afecta cada código: así se detecta
  // también que un problema ya conocido haya empeorado.
  var detalle = codigos.slice().sort().map(function(c){
    return c + ':' + (mapaCod[c] ? mapaCod[c].length : 0);
  }).join(',');
  return {
    facturas: facturas,
    codigos: codigos,
    firma: facturas.slice().sort().join(',') + '|' + detalle
  };
}

function avisarIncidenciasSync(){
  var inc = firmaIncidencias();

  // Mismo problema que la última vez: ya está anotado, no se repite
  if(inc.firma === _ultimaIncidencia) return;
  _ultimaIncidencia = inc.firma;

  if(inc.facturas.length){
    setTimeout(function(){
      showToast('⚠️ '+inc.facturas.length+' nº de factura repetido(s): '+inc.facturas.slice(0,3).join(', ')+'. Revísalo en Informes.', 'err');
    }, 1200);
  }
  if(inc.codigos.length){
    setTimeout(function(){
      showToast('⚠️ '+inc.codigos.length+' código(s) de barras duplicado(s). Revísalo antes de imprimir etiquetas.', 'err');
    }, 2600);
  }
}

// ============ VENTAS EN DOCUMENTOS INDEPENDIENTES ============
// El documento principal tiene un tope de 1 MB. Las ventas crecen sin parar
// (entre 3,5 y 14 MB al año), así que no pueden vivir ahí. Cada ticket pasa a
// ser su propio documento dentro de la subcolección "tickets", con sus líneas
// incluidas. Así el límite deja de aplicar y cada venta sube ~1 KB en vez de
// reescribir el documento entero.

var VENTANA_ESCUCHA_DIAS = 90;   // el listener sigue solo los últimos 3 meses
var _ticketsRemotosCargados = {};  // ids ya traídos de la nube

function _docDeTicket(ticket, lineas){
  return {
    t: ticket,
    l: lineas || [],
    _ts: Date.now()
  };
}

// Sube un ticket como documento propio. Se llama en cada venta.
function subirTicket(ticketId){
  if(!fbTickets) return Promise.resolve();
  var t = (state.tickets||[]).find(function(x){ return x.id===ticketId; });
  if(!t) return Promise.resolve();
  var lineas = (state.sales||[]).filter(function(s){ return s.ticketId===ticketId; });
  return fbTickets.doc(ticketId).set(_docDeTicket(t, lineas)).catch(function(err){
    console.error('No se pudo subir el ticket '+ticketId+':', err);
  });
}

// Borra el documento de un ticket eliminado
function borrarTicketRemoto(ticketId){
  if(!fbTickets) return Promise.resolve();
  return fbTickets.doc(ticketId).delete().catch(function(){});
}

function _fechaCorte(dias){
  var d = new Date();
  d.setDate(d.getDate() - dias);
  return d.toISOString();
}

// Incorpora al estado local un documento de ticket venido de la nube
function _incorporarTicketRemoto(data){
  if(!data || !data.t || !data.t.id) return false;
  var cambios = false;
  if(!state.tickets) state.tickets = [];
  if(!state.sales) state.sales = [];
  var existe = state.tickets.find(function(x){ return x.id===data.t.id; });
  if(!existe){ state.tickets.push(data.t); cambios = true; }
  var idsLocales = {};
  state.sales.forEach(function(s){ idsLocales[s.id] = true; });
  (data.l||[]).forEach(function(linea){
    if(linea && linea.id && !idsLocales[linea.id]){ state.sales.push(linea); cambios = true; }
  });
  return cambios;
}

// ---- MIGRACIÓN (fase 1): copiar los tickets del documento principal ----
// No se borra nada del principal hasta comprobar que todo está copiado.
function migrarTicketsAColeccion(){
  if(!fbTickets || !fbRef) return Promise.resolve({migrados:0, omitidos:0});
  var tickets = (state.tickets||[]).slice();
  if(!tickets.length) return Promise.resolve({migrados:0, omitidos:0});

  showToast('☁️ Migrando '+tickets.length+' ticket(s) a la nube...', 'ok');

  var migrados = 0, fallos = 0;
  var lotes = [];
  for(var i=0; i<tickets.length; i+=200) lotes.push(tickets.slice(i, i+200));

  var cadena = Promise.resolve();
  lotes.forEach(function(lote){
    cadena = cadena.then(function(){
      var batch = fbDb.batch();
      lote.forEach(function(t){
        var lineas = (state.sales||[]).filter(function(s){ return s.ticketId===t.id; });
        batch.set(fbTickets.doc(t.id), _docDeTicket(t, lineas));
      });
      return batch.commit().then(function(){ migrados += lote.length; })
                           .catch(function(e){ fallos += lote.length; console.error('Lote fallido:', e); });
    });
  });

  return cadena.then(function(){
    return {migrados:migrados, fallos:fallos, total:tickets.length};
  });
}

// Comprueba que todos los tickets locales están realmente en la nube
function verificarMigracion(){
  if(!fbTickets) return Promise.resolve({ok:false, motivo:'sin conexión'});
  return fbTickets.get().then(function(snap){
    var enNube = {};
    snap.forEach(function(d){ enNube[d.id] = true; });
    var faltan = (state.tickets||[]).filter(function(t){ return !enNube[t.id]; });
    return {
      ok: faltan.length===0,
      enNube: snap.size,
      locales: (state.tickets||[]).length,
      faltan: faltan.length
    };
  }).catch(function(e){ return {ok:false, motivo:e.message}; });
}

// Vacía las ventas del documento principal (solo tras verificar)
function aligerarDocumentoPrincipal(){
  return verificarMigracion().then(function(v){
    if(!v.ok){
      showToast('⚠️ No se aligera: faltan '+(v.faltan||'?')+' ticket(s) por migrar.', 'err');
      return false;
    }
    state.settings.ventasEnColeccion = true;
    guardarEnFirebase();
    showToast('✓ Documento principal aligerado: '+v.enNube+' ticket(s) en la nube', 'ok', true);
    return true;
  });
}

// ---- ESCUCHA DE TICKETS RECIENTES (fase 3) ----
// Se siguen en tiempo real solo los últimos 90 días. Lo anterior se descarga
// bajo demanda al pedir un periodo antiguo en Informes.
var fbTicketsEscuchando = false;

function iniciarEscuchaTickets(){
  if(!fbTickets || fbTicketsEscuchando) return;
  fbTicketsEscuchando = true;
  fbTickets.where('t.fecha', '>=', _fechaCorte(VENTANA_ESCUCHA_DIAS))
    .onSnapshot(function(snap){
      var nuevas = 0;
      snap.docChanges().forEach(function(ch){
        if(ch.type === 'removed'){
          var idq = ch.doc.id;
          state.tickets = (state.tickets||[]).filter(function(t){ return t.id!==idq; });
          state.sales   = (state.sales||[]).filter(function(s){ return s.ticketId!==idq; });
          return;
        }
        var data = ch.doc.data();
        if(!data || !data.t) return;
        var yaEstaba = (state.tickets||[]).some(function(t){ return t.id===data.t.id; });
        if(_incorporarTicketRemoto(data) && !yaEstaba) nuevas++;
      });
      if(snap.docChanges().length){
        state.sales.sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||'')); });
        state.tickets.sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||'')); });
        storage.set(STORAGE_KEY, JSON.stringify(state));
        render();
        if(nuevas) showToast('📲 '+nuevas+' venta(s) recibidas de otro dispositivo', 'ok');
      }
    }, function(err){
      console.error('Error escuchando tickets:', err);
      fbTicketsEscuchando = false;
    });
}

// Descarga tickets anteriores a la ventana de escucha (para informes antiguos)
var _historicoCargado = false;
function cargarHistorico(){
  if(!fbTickets) { showToast('Sin conexión: solo se muestra lo guardado en este equipo.', 'err'); return Promise.resolve(0); }
  if(_historicoCargado) return Promise.resolve(0);
  showToast('☁️ Cargando historial completo...', 'ok');
  return fbTickets.where('t.fecha', '<', _fechaCorte(VENTANA_ESCUCHA_DIAS)).get().then(function(snap){
    var n = 0;
    snap.forEach(function(d){ if(_incorporarTicketRemoto(d.data())) n++; });
    _historicoCargado = true;
    if(n){
      state.sales.sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||'')); });
      state.tickets.sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||'')); });
      storage.set(STORAGE_KEY, JSON.stringify(state));
      render();
    }
    showToast(n? '✓ '+n+' ticket(s) antiguos cargados' : 'No hay más historial en la nube', 'ok');
    return n;
  }).catch(function(e){
    showToast('No se pudo cargar el historial: '+e.message, 'err');
    return 0;
  });
}

// ============ BIBLIOTECA DE TICKETS ============
// Cada ticket es un "libro" con su propia signatura (el id) dentro de la
// colección de Firestore. La app no los guarda todos: mantiene en el equipo
// solo los recientes y va a buscar los antiguos cuando hacen falta.
// El acceso es permanente, pero no ocupan sitio hasta que se piden.

var DIAS_EN_EQUIPO = 120;      // lo que se conserva en el navegador
var _bibliotecaCargada = {};   // periodos ya traídos, para no repetir consultas

// ---- Consultar un libro concreto por su número de factura ----
function buscarEnBiblioteca(texto){
  texto = (texto||'').trim();
  if(!texto){ showToast('Escribe un número de ticket.', 'err', false); return; }

  // Primero mirar lo que ya está en el equipo
  var local = (state.tickets||[]).find(function(t){
    return t.numSerieFactura === texto || t.id === texto ||
           (t.numSerieFactura||'').replace(/^\w\//,'').replace(/^0+/,'') === texto.replace(/^0+/,'');
  });
  if(local){ abrirTicketImprimible(local.id, false); return; }

  if(!fbTickets){ showToast('Sin conexión: ese ticket no está en este equipo.', 'err'); return; }

  showToast('📚 Buscando en la biblioteca...', 'ok');
  fbTickets.where('t.numSerieFactura', '==', texto).get().then(function(snap){
    if(snap.size === 0){
      showToast('No se encontró ningún ticket con ese número.', 'err', false);
      return;
    }
    var encontrado = null;
    snap.forEach(function(d){ if(!encontrado) encontrado = d.data(); });
    _incorporarTicketRemoto(encontrado);
    storage.set(STORAGE_KEY, JSON.stringify(state));
    render();
    abrirTicketImprimible(encontrado.t.id, false);
  }).catch(function(e){
    showToast('No se pudo consultar la biblioteca: '+e.message, 'err');
  });
}

// ---- Traer un periodo concreto (para informes de fechas antiguas) ----
function traerPeriodoDeBiblioteca(desdeIso, hastaIso){
  if(!fbTickets) return Promise.resolve(0);
  var clave = desdeIso.slice(0,10)+'_'+hastaIso.slice(0,10);
  if(_bibliotecaCargada[clave]) return Promise.resolve(0);

  return fbTickets.where('t.fecha', '>=', desdeIso).where('t.fecha', '<=', hastaIso).get()
    .then(function(snap){
      var n = 0;
      snap.forEach(function(d){ if(_incorporarTicketRemoto(d.data())) n++; });
      _bibliotecaCargada[clave] = true;
      if(n){
        state.sales.sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||'')); });
        state.tickets.sort(function(a,b){ return String(a.fecha||'').localeCompare(String(b.fecha||'')); });
        storage.set(STORAGE_KEY, JSON.stringify(state));
        render();
        showToast('📚 '+n+' ticket(s) traídos de la biblioteca', 'ok');
      }
      return n;
    }).catch(function(e){
      console.error('Error consultando la biblioteca:', e);
      return 0;
    });
}

// Si el periodo pedido va más atrás de lo que hay en el equipo, traerlo solo
function asegurarPeriodoDisponible(desde, hasta){
  if(!fbTickets || !state.settings.ventasEnColeccion) return;
  var corte = _fechaCorte(DIAS_EN_EQUIPO);
  var desdeIso = desde ? new Date(desde+'T00:00:00').toISOString() : null;
  if(!desdeIso || desdeIso >= corte) return;   // ya lo tenemos en el equipo
  var hastaIso = hasta ? new Date(hasta+'T23:59:59').toISOString() : new Date().toISOString();
  traerPeriodoDeBiblioteca(desdeIso, hastaIso);
}

// ---- Aligerar el equipo: los libros antiguos se quedan en la biblioteca ----
// Solo se retira lo que se haya confirmado que está en la nube.
function aligerarEquipo(silencioso){
  if(!fbTickets || !state.settings.ventasEnColeccion){
    if(!silencioso) showToast('Necesita conexión para comprobar la biblioteca antes de liberar sitio.', 'err');
    return Promise.resolve(0);
  }
  var corte = _fechaCorte(DIAS_EN_EQUIPO);
  var candidatos = (state.tickets||[]).filter(function(t){ return String(t.fecha||'') < corte; });
  if(!candidatos.length){
    if(!silencioso) showToast('No hay nada que liberar: todo es reciente.', 'ok', false);
    return Promise.resolve(0);
  }

  return fbTickets.where('t.fecha', '<', corte).get().then(function(snap){
    var enNube = {};
    snap.forEach(function(d){ enNube[d.id] = true; });
    var retirables = candidatos.filter(function(t){ return enNube[t.id]; });
    var sinRespaldo = candidatos.length - retirables.length;

    if(!retirables.length){
      if(!silencioso) showToast('⚠️ No se retiró nada: esos tickets aún no están en la biblioteca.', 'err');
      return 0;
    }

    var ids = {};
    retirables.forEach(function(t){ ids[t.id] = true; });
    state.tickets = state.tickets.filter(function(t){ return !ids[t.id]; });
    state.sales   = state.sales.filter(function(s){ return !ids[s.ticketId]; });
    _bibliotecaCargada = {};   // se podrán volver a pedir
    storage.set(STORAGE_KEY, JSON.stringify(state));
    render();

    if(!silencioso){
      var msg = '📚 '+retirables.length+' ticket(s) antiguos guardados en la biblioteca';
      if(sinRespaldo) msg += ' ('+sinRespaldo+' se conservan aquí por no estar aún en la nube)';
      showToast(msg, 'ok');
    }
    return retirables.length;
  }).catch(function(e){
    if(!silencioso) showToast('No se pudo comprobar la biblioteca: '+e.message, 'err');
    return 0;
  });
}

// Estado de ocupación del equipo, para avisar antes de que se llene
function ocupacionEquipo(){
  var bytes = 0;
  try{ bytes = new Blob([JSON.stringify(state)]).size; }
  catch(e){ bytes = JSON.stringify(state).length; }
  return {
    bytes: bytes,
    kb: Math.round(bytes/1024),
    pct: Math.round((bytes/(5*1024*1024))*100),
    tickets: (state.tickets||[]).length
  };
}

function revisarOcupacion(){
  var o = ocupacionEquipo();
  if(o.pct >= 70){
    setTimeout(function(){
      showToast('📚 El equipo está al '+o.pct+'%. Puedes liberar sitio desde Informes → Biblioteca.', 'err');
    }, 3000);
  }
}

function guardarEnFirebase(){
  if(!fbRef) return;
  if(_guardandoEnFb) return;
  try{
    var sinFotos = JSON.parse(JSON.stringify(state));
    sinFotos.products.forEach(function(p){ delete p.foto; });
    limpiarAjustesLocales(sinFotos);   // el bloque de códigos y la impresora no se comparten
    delete sinFotos.avisos;            // los avisos son de este terminal
    // Las ventas viven en su propia subcolección: fuera del documento principal
    if(state.settings && state.settings.ventasEnColeccion){
      sinFotos.tickets = [];
      sinFotos.sales = [];
    }
    sinFotos._ts = Date.now();
    _guardandoEnFb = true;
    mostrarEstadoSync('guardando');
    // Timeout: si Firebase no responde en 8s, resetear icono a error
    if(_timerSync) clearTimeout(_timerSync);
    _timerSync = setTimeout(function(){
      _guardandoEnFb = false;
      mostrarEstadoSync('err');
    }, 8000);
    fbRef.set(sinFotos).then(function(){
      if(_timerSync) clearTimeout(_timerSync);
      _guardandoEnFb = false;
      mostrarEstadoSync('ok');
    }).catch(function(err){
      if(_timerSync) clearTimeout(_timerSync);
      _guardandoEnFb = false;
      console.error('Error guardando en Firebase:', err);
      mostrarEstadoSync('err');
      showToast('⚠️ Error al sincronizar: '+err.message, 'err');
    });
  }catch(e){
    if(_timerSync) clearTimeout(_timerSync);
    _guardandoEnFb = false;
    console.error('Error en guardarEnFirebase:', e);
  }
}

// Escucha cambios en Firebase y actualiza la app en todos los dispositivos
function iniciarEscuchaFirebase(){
  if(!fbRef || fbEscuchando) return;
  fbEscuchando = true;
  var _ultimoTs = 0; // para ignorar actualizaciones sin cambios reales
  fbRef.onSnapshot({includeMetadataChanges: false}, function(doc){
    if(_guardandoEnFb) return; // ignorar el eco de nuestro propio guardado
    if(!doc.exists) return;
    try{
      var remoto = doc.data();
      if(!remoto || !Array.isArray(remoto.products)) return;
      // Ignorar si el timestamp no cambió (mismos datos)
      if(remoto._ts && remoto._ts === _ultimoTs) return;
      _ultimoTs = remoto._ts || 0;
      // Conservar las fotos locales (no están en Firebase)
      var fotosLocales = {};
      if(state && state.products) state.products.forEach(function(p){ if(p.foto) fotosLocales[p.id]=p.foto; });
      var nVentasAntes = state && state.sales ? state.sales.length : 0;
      // Si las ventas ya viven en la subcolección, el documento principal las
      // trae vacías: se conservan las locales para no vaciar el historial.
      if(state.settings && state.settings.ventasEnColeccion){
        if(!remoto.tickets || !remoto.tickets.length) remoto.tickets = (state.tickets||[]).slice();
        if(!remoto.sales   || !remoto.sales.length)   remoto.sales   = (state.sales||[]).slice();
      }
      // FUSIÓN: combinar en vez de sustituir, para no perder lo hecho aquí
      var fusionado = fusionarEstados(state, remoto);
      var reenviar = fusionado._fusionadas > 0;   // el remoto no tenía ventas nuestras
      delete fusionado._fusionadas;
      state = fusionado;
      if(!state.settings) state.settings = {};
      aplicarAjustesLocales();   // recuperar lo que es propio de este terminal
      state.products.forEach(function(p){ if(fotosLocales[p.id]) p.foto=fotosLocales[p.id]; });
      // Migración de campos que puedan faltar
      if(!state.tickets) state.tickets=[];
      if(!state.devoluciones) state.devoluciones=[];
      state.tickets.forEach(function(t){ if(!t.estadoPago) t.estadoPago='completada'; if(t.datosCliente===undefined) t.datosCliente=null; });
      // Guardar en localStorage (copia local con fotos)
      storage.set(STORAGE_KEY, JSON.stringify(state));
      document.getElementById("storeName").textContent = (state.settings.nombreTienda||"Mil Pasos").toUpperCase();
      render();
      // Solo avisar si llegaron ventas nuevas de otro dispositivo
      if(state.sales.length > nVentasAntes){
        showToast('📲 '+(state.sales.length-nVentasAntes)+' venta(s) recibidas de otro dispositivo', 'ok');
      }
      // El icono vuelve a ☁️ (ya estaba OK antes de la actualización)
      mostrarEstadoSync('ok');
      avisarIncidenciasSync();
      // Si teníamos ventas que la nube no conocía, subirlas ahora
      if(reenviar){
        storage.set(STORAGE_KEY, JSON.stringify(state));
        setTimeout(function(){ guardarEnFirebase(); }, 300);
      }
    }catch(e){ console.error('Error procesando datos de Firebase:', e); }
  }, function(err){
    console.error('Error en listener Firebase:', err);
    mostrarEstadoSync('err');
    showToast('Error de sincronización: '+err.message, 'err');
  });
}

// Sistema de almacenamiento: usa localStorage (estándar en todos los navegadores,
// incluido Chrome en Android) con fallback al storage del entorno de Claude si está disponible.
// Esto corrige el bug por el que los datos (fotos, productos, ventas) desaparecían
// al cerrar la app instalada en Android.
const storage = {
  get(key){
    try{ const v = localStorage.getItem(key); return v ? {value:v} : null; }
    catch(e){ return null; }
  },
  set(key, value){
    try{ localStorage.setItem(key, value); return true; }
    catch(e){
      // localStorage lleno (puede pasar con muchas fotos): avisar al usuario
      console.error('Error guardando datos (localStorage lleno?):', e);
      return false;
    }
  },
  remove(key){
    try{ localStorage.removeItem(key); return true; }
    catch(e){ return false; }
  }
};

function startOfWeek(d){
  const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = (date.getDay()+6)%7; // lunes=0
  date.setDate(date.getDate()-dow);
  return date;
}
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

function matchesPeriodo(fechaIso, periodo, from, to, fechaEspecifica){
  if(periodo==='todos') return true;
  const d = new Date(fechaIso);
  const now = new Date();
  if(periodo==='hoy') return sameDay(d, now);
  if(periodo==='ayer'){ const y=new Date(now); y.setDate(y.getDate()-1); return sameDay(d,y); }
  if(periodo==='semana'){ return d>=startOfWeek(now); }
  if(periodo==='semana_pasada'){
    const startThis = startOfWeek(now);
    const startPrev = new Date(startThis); startPrev.setDate(startPrev.getDate()-7);
    return d>=startPrev && d<startThis;
  }
  if(periodo==='mes'){ return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); }
  if(periodo==='mes_pasado'){
    const prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
    return d.getFullYear()===prev.getFullYear() && d.getMonth()===prev.getMonth();
  }
  if(periodo==='trimestre'){
    const t=Math.floor(now.getMonth()/3);
    return d.getFullYear()===now.getFullYear() && Math.floor(d.getMonth()/3)===t;
  }
  if(periodo==='trimestre_pasado'){
    const tNow=Math.floor(now.getMonth()/3);
    const tPrev=tNow===0?3:tNow-1;
    const aPrev=tNow===0?now.getFullYear()-1:now.getFullYear();
    return d.getFullYear()===aPrev && Math.floor(d.getMonth()/3)===tPrev;
  }
  if(periodo==='anio'){ return d.getFullYear()===now.getFullYear(); }
  if(periodo==='anio_pasado'){ return d.getFullYear()===now.getFullYear()-1; }
  if(periodo==='personalizado'){
    if(from && d < new Date(from+"T00:00:00")) return false;
    if(to && d > new Date(to+"T23:59:59")) return false;
    return true;
  }
  if(periodo==='dia_especifico'){
    if(!fechaEspecifica) return true;
    return sameDay(d, new Date(fechaEspecifica+"T00:00:00"));
  }
  return true;
}
function matchesHistoryPeriod(fechaIso){
  return matchesPeriodo(fechaIso, historyPeriod, historyFrom, historyTo, historyFecha);
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function eur(n){ return (Math.round((n+Number.EPSILON)*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
// Igual, pero sin el símbolo de la moneda. Repetir " EUR" en cada línea del
// ticket (talla, base imponible, IVA...) suma 4 caracteres por línea que
// muchas impresoras no tienen margen para imprimir sin desbordar, aunque el
// ajuste "columnas" del panel diga lo contrario: ese ajuste solo cambia cómo
// rellenamos el texto aquí, no le dice nada a la impresora sobre su fuente
// real. Sin repetir la divisa en cada línea, el problema desaparece sin
// tener que adivinar el ancho físico exacto de cada impresora.
function eurSinDivisa(n){ return (Math.round((n+Number.EPSILON)*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pct(n){ return (Math.round(n*10)/10)+" %"; }
function tallasRange(){ const a=[]; for(let t=state.settings.tallaMin;t<=state.settings.tallaMax;t++) a.push(t); return a; }
const TALLAS_ROPA_BEBE = ['0-3M','3-6M','6-9M','9-12M','12-18M','18-24M','2A','3A','4A'];
const TALLAS_BOLSOS = ['ÚNICA'];
function tallasParaTipo(tipo){
  if(tipo==='bolsos' || tipo==='otros') return TALLAS_BOLSOS;
  if(tipo==='ropa_bebe') return TALLAS_ROPA_BEBE;
  return tallasRange();
}
// Tipos con una única referencia de stock (sin tallas): bolsos y ahora
// "otros" (paraguas, mochilas y demás artículos que no llevan talla).
function esTipoUnico(tipo){ return tipo==='bolsos' || tipo==='otros'; }
function tipoLabel(tipo){
  return { zapatos:"Zapatos", bolsos:"Bolsos", ropa_bebe:"Ropa de bebé", otros:"Otros" }[tipo] || "Zapatos";
}
function tipoIcono(tipo){

}
function tallaInfo(p,t){ return (p.tallas && p.tallas[t]) || {stock:0, barcode:""}; }
function stockTotal(p){ return tallasParaTipo(p.tipoArticulo||'zapatos').reduce((s,t)=> s+(tallaInfo(p,t).stock||0),0); }

function precioBaseConPromo(p){
  let base = p.precioVenta;
  if(p.promo && p.promo.activo){
    if(p.promo.tipo==="porcentaje") base = base*(1-p.promo.valor/100);
    else base = Math.max(0, base-p.promo.valor);
    // El precio ya redondeado del producto, al aplicarle la promoción, deja de terminar en
    // una cifra "bonita" con IVA. Volvemos a ajustar el precio CON IVA resultante para que
    // el cliente siga pagando un importe redondo (,00 / ,50 / ,90 / ,99).
    const conIvaBruto = precioConIVA(base);
    const conIvaBonito = precioConIvaBonito(conIvaBruto);
    base = conIvaBonito/(1+state.settings.ivaRate/100);
  }
  return base;
}
function precioConIVA(base){ return base*(1+state.settings.ivaRate/100); }

// ---- Recargo de Equivalencia: coste real al comprar al proveedor ----
// El proveedor cobra: precio neto + IVA + Recargo de Equivalencia
// Por eso el IVA cobrado al cliente se QUEDA el comerciante (no se declara)
function factorCosteRE(){
  return 1 + (state.settings.ivaRate||21)/100 + (state.settings.recargoEquivalencia||5.2)/100;
}
function costeRealUnidad(precioCompra){
  return precioCompra * factorCosteRE();
}
function beneficioRealUnidad(p){
  // PVP cobrado al cliente (ingreso real) − coste real (precio neto × 1,262)
  return precioConIVA(precioBaseConPromo(p)) - costeRealUnidad(p.precioCompra);
}
function margenRealPct(p){
  var pvp = precioConIVA(precioBaseConPromo(p));
  return pvp > 0 ? (beneficioRealUnidad(p) / pvp) * 100 : 0;
}
// Para ventas ya registradas: recalcular beneficio real desde los datos almacenados
function beneficioRealSale(s){
  if(s.esManual || s.productId === '__manual__') return 0;
  // precioCompra*cantidad = subtotal − beneficio (beneficio antiguo almacenado)
  var costeNetoTotal = s.subtotal - s.beneficio;
  return s.total - costeNetoTotal * factorCosteRE();
}

function margen(p){ if(!p.precioVenta) return 0; return ((p.precioVenta-p.precioCompra)/p.precioVenta)*100; }

// Redondea un precio con IVA al final "bonito" más cercano (,00 / ,50 / ,90 / ,99),
// como es habitual en comercio, para evitar precios finales como 51,32 €.
function precioConIvaBonito(conIvaBruto){
  if(conIvaBruto<=0) return 0;
  const terminaciones = [0.00, 0.50, 0.90, 0.99];
  const enteroBase = Math.floor(conIvaBruto);
  const candidatos = [];
  for(let delta=-1; delta<=1; delta++){
    const entero = enteroBase+delta;
    terminaciones.forEach(t=>{ const v = entero+t; if(v>=0) candidatos.push(Math.round(v*100)/100); });
  }
  candidatos.sort((a,b)=> Math.abs(a-conIvaBruto)-Math.abs(b-conIvaBruto));
  return candidatos[0];
}
// A partir de un precio de venta SIN IVA "en bruto", devuelve el precio sin IVA ya ajustado
// para que el precio CON IVA resultante termine en ,00 / ,50 / ,90 o ,99.
function precioVentaSinIvaRedondeado(precioVentaBruto, ivaRate){
  if(!precioVentaBruto || precioVentaBruto<=0) return 0;
  const conIvaBruto = precioVentaBruto*(1+ivaRate/100);
  const conIvaBonito = precioConIvaBonito(conIvaBruto);
  // Se guarda con precisión completa (sin redondear a céntimos) para que el precio CON IVA
  // resultante caiga exactamente en la terminación bonita; el redondeo a céntimos solo
  // ocurre al mostrar el precio (función eur()).
  return conIvaBonito/(1+ivaRate/100);
}
function studClass(qty){ if(!qty||qty<=0) return "stud empty"; if(qty<=2) return "stud low"; return "stud"; }
function generoLabel(g){
  return { mujer:"Mujer", hombre:"Hombre", unisex:"Unisex", nino:"Niño/a" }[g] || "Unisex";
}

// Desglose de la promoción de un producto (en vivo), para mostrar en el carrito:
// precio original, tipo/valor de la promoción, rebaja y precio final, todo con IVA.
function promoBreakdownLine(p){
  if(!(p.promo && p.promo.activo)) return "";
  const original = precioConIVA(p.precioVenta);
  const final = precioConIVA(precioBaseConPromo(p));
  const rebaja = original-final;
  const promoTxt = p.promo.tipo==='porcentaje' ? `-${p.promo.valor}%` : `-${eur(p.promo.valor)}`;
  return `<div class="promo-breakdown">PVP <s>${eur(original)}</s> · Promo ${promoTxt} · Rebaja ${eur(rebaja)} · Final <b>${eur(final)}</b></div>`;
}
// Mismo desglose pero reconstruido a partir de los datos guardados en una venta ya registrada
// (para el ticket/factura), de forma que no cambie aunque luego se edite el producto.
function promoBreakdownFromSale(s){
  if(!s.promoTipo) return "";
  const original = precioConIVA(s.precioOriginalUnit);
  const final = precioConIVA(s.precioTrasPromoUnit);
  const rebaja = original-final;
  const promoTxt = s.promoTipo==='porcentaje' ? `-${s.promoValor}%` : `-${eur(s.promoValor)}`;
  return `<div class="promo-breakdown">PVP orig. <s>${eur(original)}</s>/ud · Promo ${promoTxt} · Rebaja ${eur(rebaja)}/ud · Precio final ${eur(final)}/ud</div>`;
}

function findByBarcode(code){
  code = (code||"").trim();
  if(!code) return null;
  for(const p of state.products){
    for(const t of tallasParaTipo(p.tipoArticulo||'zapatos')){
      const info = tallaInfo(p,t);
      if(info.barcode && info.barcode===code) return {product:p, talla:t};
    }
  }
  return null;
}

// ---------------- AVISOS ----------------
// Los avisos no desaparecen solos: se cierran con un clic. Además quedan
// registrados con fecha y hora en un historial consultable desde Informes.
var MAX_AVISOS_HISTORIAL = 200;
var MAX_AVISOS_EN_PANTALLA = 4;
var _avisoSeq = 0;

// Un mismo aviso puede repetirse en cada sincronización (por ejemplo la
// advertencia de códigos duplicados). En vez de acumular copias, se agrupan:
// se actualiza la fecha y se cuenta cuántas veces ha ocurrido. Sin esto, el
// historial se rellenaba solo justo después de borrarlo.
var MINUTOS_SILENCIO_REPETIDO = 10;
// Al borrar el historial, esos textos quedan silenciados un rato. Así un
// error que se repite cada pocos segundos no vuelve a llenar la lista.
var MINUTOS_SILENCIO_BORRADO = 15;
var _avisosSilenciados = {};

function registrarAviso(msg, type){
  if(!state.avisos) state.avisos = [];
  var texto = String(msg);

  // Silenciado por un borrado reciente: no se registra ni se muestra
  var hasta = _avisosSilenciados[texto];
  if(hasta){
    if(Date.now() < hasta) return { mostrar: false };
    delete _avisosSilenciados[texto];
  }

  var repetido = null;
  for(var i=0; i<state.avisos.length; i++){
    if(!state.avisos[i].validado && state.avisos[i].texto === texto){ repetido = state.avisos[i]; break; }
  }

  var ahora = Date.now();
  if(repetido){
    var desde = ahora - new Date(repetido.fecha).getTime();
    repetido.veces = (repetido.veces || 1) + 1;
    repetido.fecha = new Date(ahora).toISOString();
    try{ storage.set(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    // Solo se vuelve a mostrar en pantalla si ha pasado un buen rato
    return { mostrar: desde > MINUTOS_SILENCIO_REPETIDO*60*1000, id: repetido.id };
  }

  var nuevoId = 'av' + (++_avisoSeq) + ahora.toString(36);
  state.avisos.unshift({
    id: nuevoId,
    texto: texto,
    tipo: type || 'info',
    fecha: new Date(ahora).toISOString(),
    veces: 1,
    validado: false
  });
  if(state.avisos.length > MAX_AVISOS_HISTORIAL) state.avisos.length = MAX_AVISOS_HISTORIAL;
  try{ storage.set(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  return { mostrar: true, id: nuevoId };
}

function cerrarAviso(el){
  if(!el) return;
  if(el._temporizador){ clearTimeout(el._temporizador); el._temporizador = null; }
  el.classList.add('saliendo');
  setTimeout(function(){
    if(el.parentNode) el.parentNode.removeChild(el);
    // Recalcular el contador con lo que quede DESPUÉS de retirar este aviso,
    // tanto si se cerró a mano como si se cerró solo. Antes el texto del
    // botón solo se actualizaba al crear un aviso nuevo, así que se quedaba
    // con el número inicial aunque fueras cerrando el resto uno a uno.
    actualizarContadorAvisos();
  }, 200);
}

// Crea, actualiza o retira el botón "Cerrar los N avisos" según cuántos
// avisos que esperan clic quedan realmente en pantalla ahora mismo.
function actualizarContadorAvisos(){
  var pila = document.getElementById('toast-stack');
  if(!pila) return;
  var contador = pila.querySelector('.toast-contador');
  var todos = [].slice.call(pila.querySelectorAll('.toast'));
  var n = todos.length;
  var persistentes = todos.filter(function(t){ return !t._temporizador; }).length;
  if(n >= 2 && persistentes >= 2){
    if(!contador){
      contador = document.createElement('div');
      contador.className = 'toast-contador';
      contador.onclick = cerrarTodosLosAvisos;
      pila.insertBefore(contador, pila.firstChild);
    }
    contador.textContent = 'Cerrar los ' + n + ' avisos';
  } else if(contador){
    contador.parentNode.removeChild(contador);
  }
}

function cerrarTodosLosAvisos(){
  var pila = document.getElementById('toast-stack');
  if(!pila) return;
  [].slice.call(pila.children).forEach(cerrarAviso);
}

// Los avisos rutinarios (ventas, devoluciones) se cierran solos a los 3 s.
// Los importantes —errores y advertencias— esperan a que hagas clic.
// El tercer parámetro permite forzar uno u otro comportamiento.
var SEGUNDOS_AVISO_RUTINA = 3;

function showToast(msg, type, persistente){
  var reg = registrarAviso(msg, type);
  // Si es una repetición reciente, queda anotada pero no se vuelve a mostrar
  if(reg && reg.mostrar === false) return reg.id;

  var pila = document.getElementById('toast-stack');
  if(!pila) return reg ? reg.id : null;

  // Por defecto: persistente solo si es un error o advertencia
  var esperaClic = (persistente === undefined) ? (type === 'err') : !!persistente;

  // Si ya hay demasiados en pantalla, retirar el más antiguo
  var visibles = [].slice.call(pila.querySelectorAll('.toast'));
  while(visibles.length >= MAX_AVISOS_EN_PANTALLA){
    cerrarAviso(visibles.shift());
  }

  var el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  el.title = 'Clic para cerrar';
  el.onclick = function(){ cerrarAviso(el); };
  pila.appendChild(el);
  // Forzar la transición de entrada
  setTimeout(function(){ el.classList.add('show'); }, 10);

  if(!esperaClic){
    el.title = 'Se cierra solo · clic para cerrar ya';
    el._temporizador = setTimeout(function(){ cerrarAviso(el); }, SEGUNDOS_AVISO_RUTINA * 1000);
    // Si pasas el ratón por encima, deja de contar: da tiempo a leerlo
    el.onmouseenter = function(){ clearTimeout(el._temporizador); };
    el.onmouseleave = function(){ el._temporizador = setTimeout(function(){ cerrarAviso(el); }, 1200); };
  }

  // Atajo para cerrarlos todos cuando se acumulan
  actualizarContadorAvisos();
  return reg ? reg.id : null;
}

// ---- Historial de avisos ----
function avisosPendientes(){
  return (state.avisos || []).filter(function(a){ return !a.validado; });
}

function validarAvisos(){
  var n = avisosPendientes().length;
  if(!n){ return; }
  (state.avisos || []).forEach(function(a){ a.validado = true; });
  try{ _ultimaIncidencia = firmaIncidencias().firma; }catch(e){}
  saveState();
  render();
}

function borrarHistorialAvisos(){
  if(!confirm('¿Borrar todo el historial de avisos?')) return;
  // Silenciar los textos borrados para que no reaparezcan al instante
  var hasta = Date.now() + MINUTOS_SILENCIO_BORRADO*60*1000;
  (state.avisos || []).forEach(function(a){ _avisosSilenciados[a.texto] = hasta; });
  state.avisos = [];
  try{ _ultimaIncidencia = firmaIncidencias().firma; }catch(e){}
  saveState();
  render();
}

// ---------------- RENDER ----------------
let lastRenderedTab = null;

function renderSinScroll(){
  // Para los checkboxes de modelos en Informes: actualizar solo el DOM sin re-render completo
  const modelChecks = document.querySelectorAll('[data-modelkey]');
  const sel = getSelectedModelKeys();
  if(modelChecks.length > 0){
    modelChecks.forEach(cb=>{ cb.checked = sel.includes(cb.dataset.modelkey); });
    try{ initCharts(); }catch(e){}
    return;
  }
  render();
}

// Hace un render completo pero preserva la posición de scroll de la página.
// Usar cuando se modifican datos (marcar pendiente, completar, etc.) y no queremos
// que el usuario pierda su posición en la lista.
function renderPreservandoScroll(){
  var scrollY = 0;
  try{ scrollY = window.pageYOffset || (document.documentElement && document.documentElement.scrollTop) || (document.body && document.body.scrollTop) || 0; }catch(e){}
  render();
  setTimeout(function(){
    try{
      if(window.scrollTo) window.scrollTo(0, scrollY);
      if(document.documentElement) document.documentElement.scrollTop = scrollY;
      if(document.body) document.body.scrollTop = scrollY;
    }catch(e){}
  }, 0);
}

function render(){
  document.querySelectorAll(".tabs button").forEach(b=> b.classList.toggle("active", b.dataset.tab===currentTab));

  // Recordar qué campo tenía el foco (y la posición del cursor) para no interrumpir al usuario mientras escribe
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const activeSelStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const activeSelEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;

  const tabChanged = currentTab !== lastRenderedTab;
  lastRenderedTab = currentTab;

  const view = document.getElementById("view");
  if(currentTab==="almacen") view.innerHTML = renderAlmacen();
  else if(currentTab==="ventas") view.innerHTML = renderVentas();
  else view.innerHTML = renderInformes();

  setTimeout(()=>{
    // Solo enfocar el escáner automáticamente en PC (no en táctil, para no abrir el teclado)
    var esTactil = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if(tabChanged && !esTactil){
      if(currentTab==="almacen"){
        const s = document.getElementById("scan-almacen"); if(s) s.focus();
      } else if(currentTab==="ventas"){
        const s = document.getElementById("scan-ventas"); if(s) s.focus();
      }
    } else if(!tabChanged && activeId){
      // Re-render dentro de la misma pestaña (p. ej. escribiendo en un buscador): devolver el foco y el cursor
      const el = document.getElementById(activeId);
      if(el){
        el.focus();
        if(activeSelStart!==null && typeof el.setSelectionRange==='function'){
          try{ el.setSelectionRange(activeSelStart, activeSelEnd); }catch(e){}
        }
      }
    }
    if(currentTab==="informes") initCharts();
  }, 0);
}

// Las categorías son texto libre en la ficha del producto, así que el
// desplegable se construye con las que realmente existen en el almacén.
// Antes tenía cuatro valores fijos que no se correspondían con nada.
function categoriasDelAlmacen(){
  var mapa = {};
  (state.products || []).forEach(function(p){
    var c = (p.categoria || '').trim();
    if(!c) return;
    var clave = c.toLowerCase();
    if(!mapa[clave]) mapa[clave] = { valor: clave, etiqueta: c, n: 0 };
    mapa[clave].n++;
  });
  return Object.keys(mapa).map(function(k){ return mapa[k]; })
    .sort(function(a,b){ return a.etiqueta.localeCompare(b.etiqueta, 'es'); });
}

// Al escribir en el buscador NO se repinta toda la pestaña: se sustituye solo
// la rejilla de productos. Si se repintara todo, el campo de texto se destruye
// y se vuelve a crear, y en pantalla táctil eso cierra y reabre el teclado en
// cada letra.
var _temporizadorBusqueda = null;
function buscarEnAlmacen(valor){
  filterText = valor;
  clearTimeout(_temporizadorBusqueda);
  _temporizadorBusqueda = setTimeout(function(){
    var rejilla = document.querySelector('#view .grid-cards');
    if(!rejilla){ render(); return; }
    rejilla.outerHTML = tarjetasAlmacen();
    // Actualizar el contador de resultados si está visible
    var cont = document.getElementById('almacen-contador');
    if(cont) cont.textContent = productosFiltrados().length + ' artículo(s)';
  }, 120);
}

// Filtrado y pintado de tarjetas, separados para poder refrescar solo la
// rejilla al escribir en el buscador.

  const term = filterText.trim().toLowerCase();
  return state.products.filter(p=>
    (!term || (p.marca+" "+p.modelo).toLowerCase().includes(term)) &&
    (almacenGeneroFiltro==='todos' || (p.genero||'unisex')===almacenGeneroFiltro) &&
    (almacenCategoriaFiltro==='todas'
      || (almacenCategoriaFiltro==='__sin__' ? !(p.categoria||'').trim() : (p.categoria||'').trim().toLowerCase()===almacenCategoriaFiltro))
  );
}
