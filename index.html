// Cálculo del historial de ventas: filtrado, orden, agrupación por ticket y
// construcción de las filas. Separado de renderVentas() para poder llamarlo
// al escribir en el buscador sin repintar la pestaña entera (eso destruye
// y recrea el propio campo de texto, y en pantalla táctil el teclado
// parpadea en cada letra).
// Al escribir en el buscador del historial NO se repinta la pestaña
// entera: se sustituyen solo el resumen y las filas de la tabla. Igual que
// en el buscador de Almacén, repintarlo todo destruye y recrea el propio
// campo de texto, y en pantalla táctil eso hace que el teclado parpadee en
// cada letra.
var _temporizadorBusquedaHistorial = null;
function buscarEnHistorialVentas(valor){
  historyFilter = valor;
  clearTimeout(_temporizadorBusquedaHistorial);
  _temporizadorBusquedaHistorial = setTimeout(function(){
    var resumen = document.getElementById('historial-resumen');
    var tbody = document.getElementById('historial-tbody');
    var pie = document.getElementById('historial-pie');
    if(!resumen || !tbody || !pie){ render(); return; }   // la pestaña ya no está: repintar entero
    var c = calcularHistorialVentas();
    resumen.innerHTML = '<span>Ventas en el filtro: <b>'+c.filtered.length+'</b></span>'
      + '<span>Total: <b>'+eur(c.filteredTotal)+'</b></span>'
      + '<span>Beneficio: <b>'+eur(c.filteredBeneficio)+'</b></span>';
    tbody.innerHTML = c.rowsHist;
    var nTickets = new Set(c.filtered.map(function(s){ return s.ticketId; })).size;
    pie.innerHTML = c.filtered.length+' línea(s) · '+nTickets+' ticket(s)'
      + (c.filtered.length>200 ? ' · <span style="color:var(--coral);">mostrando las 200 más recientes — afina la búsqueda para ver el resto</span>' : '');
  }, 120);
}

function calcularHistorialVentas(){
  const term = historyFilter.trim().toLowerCase();
    const preFiltered = state.sales.filter(s=> (!term || (s.marca+" "+s.modelo).toLowerCase().includes(term)) && matchesHistoryPeriod(s.fecha));
  
    // Ordenar por el criterio elegido, agrupando siempre las líneas del mismo ticket
    // Para mantener la agrupación por ticket, ordenamos tickets y luego reconstruimos las líneas
    const ticketIds = [...new Set(preFiltered.map(s=>s.ticketId))];
    const ticketMap = {};
    ticketIds.forEach(tid=>{
      const lineas = preFiltered.filter(s=>s.ticketId===tid);
      const t = state.tickets.find(x=>x.id===tid);
      ticketMap[tid] = { lineas, ticket:t,
        fecha: lineas[0]?.fecha || '',
        numero: t?.numero || 0,
        total: lineas.reduce((a,s)=>a+s.total,0),
        beneficio: lineas.reduce((a,s)=>a+s.beneficio,0),
        marca: lineas[0]?.marca || '',
        modelo: lineas[0]?.modelo || ''
      };
    });
  
    const ordenarTickets = (a,b) => {
      const ta=ticketMap[a], tb=ticketMap[b];
      switch(historyOrden){
        case 'fecha_asc':      return ta.fecha.localeCompare(tb.fecha);
        case 'fecha_desc':     return tb.fecha.localeCompare(ta.fecha);
        case 'ticket_asc':     return ta.numero - tb.numero;
        case 'ticket_desc':    return tb.numero - ta.numero;
        case 'total_asc':      return ta.total - tb.total;
        case 'total_desc':     return tb.total - ta.total;
        case 'beneficio_asc':  return beneficioRealSale(ta) - beneficioRealSale(tb);
        case 'beneficio_desc': return beneficioRealSale(tb) - beneficioRealSale(ta);
        case 'marca_asc':      return ta.marca.localeCompare(tb.marca, 'es');
        case 'marca_desc':     return tb.marca.localeCompare(ta.marca, 'es');
        case 'modelo_asc':     return ta.modelo.localeCompare(tb.modelo, 'es');
        case 'modelo_desc':    return tb.modelo.localeCompare(ta.modelo, 'es');
        default:               return tb.fecha.localeCompare(ta.fecha);
      }
    };
    ticketIds.sort(ordenarTickets);
  
    const filtered = ticketIds.flatMap(tid => ticketMap[tid].lineas);
    const filteredTotal = filtered.reduce((a,s)=>a+s.total,0);
    const filteredBeneficio = filtered.reduce((a,s)=>a+beneficioRealSale(s),0);
    let prevTicketId = null;
    let prevDia = null;
    const rowsHistArr = [];
    const visibles = filtered.slice(0,200);
  
    // Total cobrado por día, para mostrarlo en la cabecera de cada jornada
    const totalPorDia = {};
    visibles.forEach(s=>{
      const d = String(s.fecha||'').slice(0,10);
      totalPorDia[d] = (totalPorDia[d]||0) + (s.total||0);
    });
  
    // Posición de cada ticket dentro de su día (1º, 2º, 3º...). Se calcula de
    // una vez, en el orden en que se van a pintar. El 1º blanco, el 2º
    // sombreado, el 3º blanco... sin depender de ningún contador que se alterne.
    const claseTicket = {};
    const contadorDia = {};
    const yaVisto = {};
    visibles.forEach(s=>{
      if(yaVisto[s.ticketId]) return;
      yaVisto[s.ticketId] = true;
      const d = String(s.fecha||'').slice(0,10);
      contadorDia[d] = (contadorDia[d]||0) + 1;
      claseTicket[s.ticketId] = (contadorDia[d] % 2 === 1) ? 'ticket-row-a' : 'ticket-row-b';
    });
  
    visibles.forEach(s=>{
      const diaActual = String(s.fecha||'').slice(0,10);
      if(diaActual !== prevDia){
        // Cambio de jornada: banda separadora con la fecha y el total del día
        const fLarga = new Date(s.fecha).toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
        rowsHistArr.push(`<tr class="dia-sep"><td colspan="11">${escapeHtml(fLarga)}<span class="dia-total">${eur(totalPorDia[diaActual]||0)}</span></td></tr>`);
        prevDia = diaActual;
        prevTicketId = null;
      } else if(prevTicketId!==null && s.ticketId!==prevTicketId){
        rowsHistArr.push(`<tr class="ticket-spacer"><td colspan="11"></td></tr>`);
      }
      prevTicketId = s.ticketId;
      const estadoDev = estadoDevolucion(s);
      const badgeDev = estadoDev==='total' ? `<span class="dev-badge dev-total">Devuelta</span>`
                    : estadoDev==='parcial' ? `<span class="dev-badge dev-parcial" title="Quedan ${maxDevolvible(s)} par(es) sin devolver">Parcial</span>`
                    : "";
      const puedeDevolver = maxDevolvible(s)>0;
      const ticket = state.tickets.find(t=>t.id===s.ticketId);
      const estadoPago = ticket ? (ticket.estadoPago||'completada') : 'completada';
      const badgePago = estadoPago==='pendiente'
        ? `<button class="estado-pendiente" onclick="openPendienteModal('${ticket.id}')" title="${ticket.datosCliente&&ticket.datosCliente.nombre ? '👤 '+ticket.datosCliente.nombre : 'Sin datos de cliente'}">⏳ Pendiente${ticket.datosCliente&&ticket.datosCliente.nombre?' — '+escapeHtml(ticket.datosCliente.nombre):''}</button>`
        : `<span class="estado-completada">✅ Completada</span>`;
      rowsHistArr.push(`
      <tr class="${claseTicket[s.ticketId] || 'ticket-row-a'}" data-ticketid="${s.ticketId}">
        <td>${ticket? ticket.numSerieFactura : "—"}</td>
        <td>${new Date(s.fecha).toLocaleString('es-ES')}</td>
        <td>${escapeHtml(s.marca)}</td>
        <td>${escapeHtml(s.modelo)}</td>
        <td class="num">${s.talla}</td>
        <td class="num">${s.cantidad}</td>
        <td class="num">${eur(s.total)}</td>
        <td class="num">${eur(beneficioRealSale(s))}</td>
        <td>${badgePago}</td>
        <td>${badgeDev}</td>
        <td style="white-space:nowrap;min-width:110px;">
          <div style="display:flex;gap:4px;align-items:center;">
            ${estadoPago==='completada' && ticket ? `<button class="btn small" style="background:var(--gold);border-color:var(--gold);color:#3a2c00;" onclick="openPendienteModal('${ticket.id}')" title="Marcar como pendiente">⏳</button>` : ""}
            ${estadoPago==='pendiente' && ticket ? `<button class="btn small" style="background:var(--gold);border-color:var(--gold);color:#3a2c00;" onclick="openPendienteModal('${ticket.id}')" title="Ver / editar pendiente">⏳</button>` : ""}
            ${ticket ? `<button class="btn small secondary" onclick="abrirTicketImprimible('${ticket.id}')" title="Ver / reimprimir ticket">🖨️</button>` : ""}
            ${puedeDevolver? `<button class="btn small secondary" onclick="openDevolucionModal('${s.id}')" title="Registrar devolución">↩️</button>` : ""}
            ${ticket ? `<button class="btn small danger" onclick="eliminarTicket('${ticket.id}')" title="Eliminar ticket">🗑️</button>` : ""}
          </div>
        </td>
      </tr>`);
    });
    const rowsHist = rowsHistArr.join("") || `<tr><td colspan="11" style="text-align:center;color:var(--ink-dim);">No hay ventas para este filtro.</td></tr>`;
    return {filtered, filteredTotal, filteredBeneficio, rowsHist};
}

function renderVentas(){
  const totals = cartTotals();
  const rowsCart = cart.map((line,i)=>{
    // --- Artículo manual ---
    if(line.productId === '__manual__'){
      const dl = line.descuento || {activo:false,tipo:'porcentaje',valor:0};
      const pvp = line.precioManualConIva || 0;
      let totalLinea = pvp * line.cantidad;
      if(dl.activo && dl.valor>0){
        totalLinea = dl.tipo==='porcentaje' ? totalLinea*(1-dl.valor/100) : Math.max(0, totalLinea-dl.valor);
      }
      return `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:18px;">✏️</span>
            <div>
              <div style="font-weight:700;">${escapeHtml(line.marcaManual)}</div>
              <div style="font-size:11px;color:var(--ink-dim);">${escapeHtml(line.modeloManual)}</div>
            </div>
          </div>
        </td>
        <td class="num">${escapeHtml(line.tallaManual)}</td>
        <td class="num"><input type="number" min="1" value="${line.cantidad}" style="width:58px;font-size:16px;text-align:center;padding:6px 4px;" onchange="cart[${i}].cantidad=parseInt(this.value)||1; render()"></td>
        <td class="num" style="white-space:nowrap;"><span style="font-weight:700;font-size:15px;">${eur(pvp)}/ud</span></td>
        <td class="num" style="font-weight:700;font-size:17px;">${eur(totalLinea)}</td>
        <td>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <label style="display:flex;align-items:center;gap:4px;text-transform:none;font-size:12px;margin:0;cursor:pointer;">
              <input type="checkbox" ${dl.activo?'checked':''} onchange="toggleDescuentoLinea(${i})" style="width:auto;margin:0;">
              Dto.
            </label>
            ${dl.activo ? `
              <select style="padding:4px 6px;font-size:12px;" onchange="setDescuentoLineaTipo(${i},this.value)">
                <option value="porcentaje" ${dl.tipo==='porcentaje'?'selected':''}>%</option>
                <option value="importe" ${dl.tipo==='importe'?'selected':''}>€</option>
              </select>
              <input type="number" min="0" step="0.5" value="${dl.valor}" style="width:56px;padding:4px 6px;font-size:12px;" onchange="setDescuentoLineaValor(${i},this.value)">
            ` : ""}
            <button class="btn small danger" onclick="removeFromCart(${i})">✕</button>
          </div>
        </td>
      </tr>`;
    }

    // --- Artículo del catálogo ---
    const p = state.products.find(x=>x.id===line.productId);
    if(!p) return "";
    const info = tallaInfo(p, line.talla);
    const esBolso = esTipoUnico(p.tipoArticulo||'zapatos');
    const tallaOpciones = tallasParaTipo(p.tipoArticulo||'zapatos').filter(t=> tallaInfo(p,t).stock>0 || String(t)===String(line.talla));

    // Precio por unidad: base con promo del producto, y luego aplicar el descuento manual de la línea
    const baseConPromo = precioBaseConPromo(p);
    const dl = line.descuento || {activo:false,tipo:'porcentaje',valor:0};
    const pvpPromoConIva = precioConIVA(baseConPromo);
    let totalLinea;
    if(dl.activo && dl.valor>0){
      let pvpLineaTotal = pvpPromoConIva * line.cantidad;
      if(dl.tipo==='porcentaje') pvpLineaTotal = pvpLineaTotal * (1-dl.valor/100);
      else pvpLineaTotal = Math.max(0, pvpLineaTotal - dl.valor);
      totalLinea = pvpLineaTotal;
    } else {
      totalLinea = pvpPromoConIva * line.cantidad;
    }
    const unitConIva = totalLinea / line.cantidad;

    // Desglose visual de precios
    const precioOrigIva = precioConIVA(p.precioVenta);
    const precioPromoIva = precioConIVA(baseConPromo);
    let precioInfo = `<span style="font-weight:700;font-size:15px;">${eur(unitConIva)}/ud</span>`;
    if(p.promo && p.promo.activo){
      precioInfo = `<span style="font-size:11px;color:var(--ink-dim);"><s>${eur(precioOrigIva)}</s></span> <span style="color:var(--teal);font-weight:700;font-size:15px;">${eur(precioPromoIva)}/ud</span>`;
    }
    if(dl.activo && dl.valor>0){
      precioInfo += ` <span style="font-size:11px;color:var(--gold-dark);">−dto</span> <span style="font-weight:700;font-size:15px;color:var(--coral);">${eur(unitConIva)}/ud</span>`;
    }

    return `
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          ${p.foto
            ? `<img src="${p.foto}" style="width:76px;height:76px;border-radius:10px;object-fit:cover;flex-shrink:0;box-shadow:var(--shadow);cursor:zoom-in;" onclick="ampliarFoto('${p.id}')" title="Tocar para ampliar">`
            : `<div style="width:76px;height:76px;border-radius:10px;flex-shrink:0;background:var(--canvas);display:flex;align-items:center;justify-content:center;font-size:32px;">${tipoIcono(p.tipoArticulo)}</div>`}
          <div>
            <div style="font-weight:700;">${escapeHtml(p.marca)}${(p.promo && p.promo.activo) ? `<span class="promo-badge" style="margin-left:6px;padding:2px 7px;font-size:9.5px;">🏷️ PROMO ${p.promo.tipo==='porcentaje' ? '−'+p.promo.valor+'%' : '−'+eur(p.promo.valor)}</span>` : ""}</div>
            <div style="font-size:11px;color:var(--ink-dim);">${escapeHtml(p.modelo)}${(p.promo && p.promo.activo) ? ` · ahorra ${eur((precioConIVA(p.precioVenta)-precioConIVA(baseConPromo))*line.cantidad)}` : ""}</div>
          </div>
        </div>
      </td>
      <td class="num">
        ${esBolso ? "Único" : `
        <select onchange="updateCartTalla(${i}, this.value)" style="font-size:16px;font-weight:700;padding:5px 4px;">
          ${tallaOpciones.map(t=>`<option value="${t}" ${String(t)===String(line.talla)?'selected':''}>${t}</option>`).join("")}
        </select>`}
      </td>
      <td class="num"><input type="number" min="1" max="${info.stock + line.cantidad}" value="${line.cantidad}" style="width:58px;font-size:16px;text-align:center;padding:6px 4px;" onchange="updateCartQty(${i}, this.value)"></td>
      <td class="num" style="white-space:nowrap;">${precioInfo}</td>
      <td class="num" style="font-weight:700;font-size:17px;">${eur(totalLinea)}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <label style="display:flex;align-items:center;gap:4px;text-transform:none;font-size:12px;margin:0;white-space:nowrap;cursor:pointer;">
            <input type="checkbox" ${dl.activo?'checked':''} onchange="toggleDescuentoLinea(${i})" style="width:auto;margin:0;">
            Dto.
          </label>
          ${dl.activo ? `
            <select style="padding:4px 6px;font-size:12px;" onchange="setDescuentoLineaTipo(${i},this.value)">
              <option value="porcentaje" ${dl.tipo==='porcentaje'?'selected':''}>%</option>
              <option value="importe" ${dl.tipo==='importe'?'selected':''}>€</option>
            </select>
            <input type="number" min="0" step="0.5" value="${dl.valor}" style="width:56px;padding:4px 6px;font-size:12px;" onchange="setDescuentoLineaValor(${i},this.value)">
          ` : ""}
          <button class="btn small danger" onclick="removeFromCart(${i})">✕</button>
        </div>
      </td>
    </tr>`;
  }).join("");

  const cartTable = cart.length? `
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
    <table>
      <thead><tr><th>Artículo</th><th class="num">Talla</th><th class="num">Cant.</th><th class="num">Precio/ud (IVA inc.)</th><th class="num">Total</th><th>Descuento</th></tr></thead>
      <tbody>${rowsCart}</tbody>
    </table>
    </div>
  ` : `<div class="cart-empty">El carrito está vacío. Escanea un producto para añadirlo.</div>`;

  const _histCalc = calcularHistorialVentas();
  const filtered = _histCalc.filtered;
  const filteredTotal = _histCalc.filteredTotal;
  const filteredBeneficio = _histCalc.filteredBeneficio;
  const rowsHist = _histCalc.rowsHist;

  return `
    <h2 class="section-title">Punto de venta</h2>

    <div style="display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid var(--line);">
      <button onclick="ventasTab='catalogo';render();" style="border:none;background:none;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:3px solid ${ventasTab==='catalogo'?'var(--coral)':'transparent'};color:${ventasTab==='catalogo'?'var(--coral)':'var(--ink-dim)'};margin-bottom:-2px;">🏷️ Del catálogo</button>
      <button onclick="ventasTab='otro';render();" style="border:none;background:none;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:3px solid ${ventasTab==='otro'?'var(--coral)':'transparent'};color:${ventasTab==='otro'?'var(--coral)':'var(--ink-dim)'};margin-bottom:-2px;">✏️ Otro</button>
    </div>

    ${ventasTab==='catalogo' ? `
    <div class="scan-console">
      <div class="scan-label">Escanea el código de barras de cada par para añadirlo a la venta</div>
      <div class="scan-row">
        <span class="scan-cursor">▌</span>
        <input id="scan-ventas" class="scan-input" type="text" placeholder="Esperando código de barras..." autocomplete="off">
      </div>
    </div>
    ${state.products.length===0 ? `<div class="note" style="margin-top:8px;">Todavía no tienes productos en el almacén. Añade alguno en la pestaña "Almacén" antes de vender.</div>` : `
    <div class="toolbar" style="margin-top:8px;">
      <select onchange="if(this.value) addManualToCart(this.value); this.value='';" style="min-width:260px;">
        <option value="">Añadir manualmente (sin escáner)...</option>
        ${opcionesProductosPorMarca()}
      </select>
    </div>`}
    ` : `
    <div class="ticket" style="width:100%;margin-bottom:12px;max-width:480px;">
      <div style="font-size:13px;color:var(--ink-dim);margin-bottom:14px;">Para ventas puntuales de artículos que no están en el catálogo todavía. No afecta al stock.</div>
      <div class="field-row">
        <div class="field" style="flex:2;">
          <label>Nombre / Marca <span style="color:var(--red)">*</span></label>
          <input type="text" id="otro-nombre" value="${escapeAttr(otroNombre)}" placeholder="Ej: Sandalia verano" style="width:100%" oninput="otroNombre=this.value">
        </div>
        <div class="field" style="flex:2;">
          <label>Modelo (opcional)</label>
          <input type="text" id="otro-modelo" value="${escapeAttr(otroModelo)}" placeholder="Ej: Modelo X" style="width:100%" oninput="otroModelo=this.value">
        </div>
      </div>
      <div class="field-row">
        <div class="field" style="flex:1;">
          <label>Talla / Nº (opcional)</label>
          <input type="text" id="otro-talla" value="${escapeAttr(otroTalla)}" placeholder="Ej: 40" style="width:100%" oninput="otroTalla=this.value">
        </div>
        <div class="field" style="flex:1;">
          <label>Cantidad</label>
          <input type="number" id="otro-cantidad" min="1" value="${otroCantidad}" style="width:100%" oninput="otroCantidad=parseInt(this.value)||1">
        </div>
        <div class="field" style="flex:1.5;">
          <label>Precio con IVA (€) <span style="color:var(--red)">*</span></label>
          <input type="number" id="otro-precio" min="0" step="0.01" value="${otroPrecio}" placeholder="0,00" style="width:100%" oninput="otroPrecio=this.value">
        </div>
      </div>
      <button class="btn accent" style="width:100%;margin-top:4px;" onclick="addOtroToCart()">➕ Añadir al carrito</button>
    </div>
    `}

    <div class="ticket" style="margin-bottom:10px;">
      ${cartTable}
      ${cart.length? `
      <div class="field-row" style="align-items:center;margin-top:14px;border-top:1px dashed var(--receipt-line);padding-top:12px;">
        <label style="display:flex;align-items:center;gap:8px;text-transform:none;margin:0;">
          <input type="checkbox" ${cartDescuentoActivo?'checked':''} onchange="cartDescuentoActivo=this.checked; render();" style="width:auto;">
          Descuento sobre <b>toda la factura</b> (cliente habitual, etc.)
        </label>
        ${cartDescuentoActivo? `
          <select onchange="cartDescuentoTipo=this.value; render();">
            <option value="porcentaje" ${cartDescuentoTipo==='porcentaje'?'selected':''}>Porcentaje (%)</option>
            <option value="importe" ${cartDescuentoTipo==='importe'?'selected':''}>Importe fijo (€)</option>
          </select>
          <input type="number" step="0.01" min="0" value="${cartDescuentoValor}" style="width:90px" onchange="cartDescuentoValor=parseFloat(this.value)||0; render();" placeholder="Valor">
        ` : ""}
      </div>
      <div class="price-row" style="justify-content:flex-end;gap:22px;margin-top:12px;font-size:14.5px;">
        <span>Subtotal: <b style="font-size:16px;">${eur(totals.subtotal)}</b></span>
        ${(function(){
          var ahorro = 0;
          cart.forEach(function(l){
            if(l.productId === '__manual__') return;
            var pr = state.products.find(function(x){ return x.id===l.productId; });
            if(pr && pr.promo && pr.promo.activo){
              ahorro += (precioConIVA(pr.precioVenta) - precioConIVA(precioBaseConPromo(pr))) * l.cantidad;
            }
          });
          return ahorro > 0 ? `<span style="color:var(--teal);">🏷️ Ahorro en promociones: <b style="font-size:16px;">${eur(ahorro)}</b></span>` : "";
        })()}
        ${totals.descuentoImporte>0 ? `<span style="color:var(--coral);">Dto. total: <b style="font-size:16px;">-${eur(totals.descuentoImporte)}</b></span>` : ""}
        <span>IVA: <b style="font-size:16px;">${eur(totals.iva)}</b></span>
        <span style="font-size:19px;">Total: <b>${eur(totals.total)}</b></span>
      </div>
      <div class="ticket-actions" style="justify-content:flex-end;align-items:center;">
        <label style="margin:0;display:flex;align-items:center;gap:6px;text-transform:none;">
          Forma de pago

function asegurarPeriodoPredefinido(periodo){
  if(!fbTickets || !state.settings.ventasEnColeccion) return;
  if(periodo === 'todos'){ cargarHistorico(); return; }
  var atras = {hoy:1, ayer:2, semana:7, semana_pasada:14, mes:31, mes_pasado:62, ano:365, ano_pasado:730};
  var dias = atras[periodo];
  if(!dias || dias <= DIAS_EN_EQUIPO) return;   // ya está en el equipo
  var desde = new Date(); desde.setDate(desde.getDate() - dias);
  traerPeriodoDeBiblioteca(desde.toISOString(), new Date().toISOString());
}

// ============ DETECCIÓN Y ARREGLO DE DUPLICADOS ============
// Un código repetido en dos artículos distintos hace que el escáner cobre
// uno por otro. Aquí se listan y se pueden corregir de una vez.

function detalleCodigosDuplicados(){
  var vistos = {};
  (state.products || []).forEach(function(p){
    tallasParaTipo(p.tipoArticulo||'zapatos').forEach(function(t){
      var bc = (tallaInfo(p,t).barcode || '').trim();
      if(!bc) return;
      if(!vistos[bc]) vistos[bc] = [];
      vistos[bc].push({ productId:p.id, marca:p.marca, modelo:p.modelo, talla:t, stock:tallaInfo(p,t).stock||0 });
    });
  });
  var dup = [];
  Object.keys(vistos).forEach(function(bc){
    if(vistos[bc].length > 1) dup.push({ codigo:bc, usos:vistos[bc] });
  });
  return dup.sort(function(a,b){ return b.usos.length - a.usos.length; });
}

// Artículos repetidos en el almacén (misma marca y modelo). Suelen ser la
// causa de fondo de los códigos duplicados.
function productosDuplicados(){
  var mapa = {};
  (state.products || []).forEach(function(p){
    var k = ((p.marca||'')+'|'+(p.modelo||'')).trim().toLowerCase();
    if(!k || k==='|') return;
    if(!mapa[k]) mapa[k] = [];
    mapa[k].push(p);
  });
  return Object.keys(mapa).filter(function(k){ return mapa[k].length > 1; })
    .map(function(k){ return { clave:k, productos:mapa[k] }; });
}

// Deja el primer uso de cada código y genera uno nuevo para el resto.
function regenerarCodigosDuplicados(){
  var dup = detalleCodigosDuplicados();
  if(!dup.length){ showToast('No hay códigos duplicados.', 'ok'); return; }

  var aCambiar = dup.reduce(function(n,d){ return n + d.usos.length - 1; }, 0);
  if(!confirm('Se conservará el primer uso de cada código y se generará uno nuevo para los otros '+aCambiar+'.\n\n¿Continuar?')) return;

  var cambiados = 0;
  dup.forEach(function(d){
    // El primero se queda como está; los demás reciben un código nuevo
    d.usos.slice(1).forEach(function(u){
      var p = state.products.find(function(x){ return x.id===u.productId; });
      if(!p || !p.tallas || !p.tallas[u.talla]) return;
      var nuevo = generarEAN13();
      if(nuevo){ p.tallas[u.talla].barcode = nuevo; p._mod = Date.now(); cambiados++; }
    });
  });

  saveState();
  _ultimaIncidencia = null;   // volver a evaluar el estado real
  render();
  showToast(cambiados+' código(s) regenerado(s). Reimprime las etiquetas afectadas.', 'ok', true);
}

function renderDuplicados(){
  var dupCod = detalleCodigosDuplicados();
  var dupProd = productosDuplicados();
  if(!dupCod.length && !dupProd.length) return '';

  var filas = dupCod.slice(0, 40).map(function(d){
    return '<div style="padding:7px 0;border-bottom:1px solid var(--line);">'
      + '<div style="font-family:var(--font-mono);font-size:12.5px;font-weight:700;">' + escapeHtml(d.codigo) + '</div>'
      + '<div style="font-size:11.5px;color:var(--ink-dim);">'
      +   d.usos.map(function(u){ return escapeHtml(u.marca+' '+u.modelo)+' T'+u.talla; }).join(' · ')
      + '</div></div>';
  }).join('');

  var filasProd = dupProd.slice(0,30).map(function(g){
    return '<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;">'
      + '<b>' + escapeHtml(g.productos[0].marca + ' ' + g.productos[0].modelo) + '</b> — ' + g.productos.length + ' fichas'
      + '<div style="font-size:11px;color:var(--ink-dim);">Stock por ficha: '
      +   g.productos.map(function(p){ return stockTotal(p)+' ud.'; }).join(' · ') + '</div>'
      + '</div>';
  }).join('');

  var avisoProd = dupProd.length
    ? '<div class="note" style="margin:10px 0;font-size:12.5px;">'
      + 'Hay ' + dupProd.length + ' artículo(s) repetido(s) en el almacén (misma marca y modelo). '
      + 'Suele ser la causa de los códigos duplicados: '
      + dupProd.slice(0,4).map(function(g){ return escapeHtml(g.productos[0].marca+' '+g.productos[0].modelo)+' ×'+g.productos.length; }).join(', ')
      + (dupProd.length>4 ? '…' : '')
      + '</div>'
    : '';

  var titulo = dupCod.length ? '⚠️ Códigos de barras duplicados' : '⚠️ Artículos repetidos en el almacén';

  // Una sola caja de scroll para todo el contenido, en vez de una por cada
  // lista: con las dos por separado, pegadas una a la otra, parecía un
  // scroll duplicado dentro de la misma tarjeta.
  var listaCombinada = '';
  if(dupCod.length){
    listaCombinada += (dupProd.length ? '<div style="font-size:11.5px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.4px;margin:4px 0 2px;">Códigos</div>' : '') + filas;
  }
  if(dupProd.length){
    listaCombinada += (dupCod.length ? '<div style="font-size:11.5px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 2px;">Fichas repetidas</div>' : '') + filasProd;
  }

  return '<div><h3 class="sub-title" style="margin-top:0;">' + titulo + '</h3>'
    + '<div class="ticket" style="width:100%;border-left:4px solid var(--red);">'
    +   (dupCod.length
        ? '<div style="font-size:13px;margin-bottom:6px;"><b>' + dupCod.length + '</b> código(s) asignados a más de un artículo o talla. '
          + 'El escáner cobraría uno por otro.</div>'
        : '<div style="font-size:13px;margin-bottom:6px;">No hay códigos duplicados ✓</div>')
    +   avisoProd
    +   '<div style="max-height:340px;overflow-y:auto;">' + listaCombinada + '</div>'
    +   '<div class="ticket-actions" style="margin-top:10px;">'
    +     (dupCod.length ? '<button class="btn accent" onclick="regenerarCodigosDuplicados()">⚙️ Regenerar los códigos duplicados</button>' : '')
    +     (dupProd.length ? '<button class="btn secondary" onclick="currentTab=\'almacen\'; render();">📦 Ir al almacén a revisarlos</button>' : '')
    +   '</div>'
    +   (dupProd.length
        ? '<div class="note" style="margin:10px 0 0;font-size:12px;">Las fichas repetidas hay que borrarlas a mano: solo tú sabes cuál conservar. '
          + 'Elimina la que tenga el stock equivocado desde la ficha del producto en Almacén.</div>'
        : '')
    + '</div></div>';
}

// ============ DIAGNÓSTICO DEL NAVEGADOR KIOSCO ============
// Fully Kiosk expone un objeto global "fully" con funciones nativas cuando
// se activa Advanced Web Settings → Enable JavaScript Interface.
// Qué funciones existe depende de la versión, así que en vez de suponer,
// se le pregunta al propio dispositivo.

function inspeccionarEntorno(){
  var info = { entorno: [], fully: [], impresion: [], otros: [] };

  // ¿Qué envoltorio nos está ejecutando?
  if(typeof fully !== 'undefined')   info.entorno.push('Fully Kiosk (objeto "fully" disponible)');
  if(typeof Android !== 'undefined') info.entorno.push('Android Kiosk (objeto "Android" disponible)');
  if(typeof AndroidPrinter !== 'undefined') info.entorno.push('AndroidPrinter disponible');
  if(!info.entorno.length) info.entorno.push('Navegador normal (sin envoltorio nativo)');

  // Listar TODO lo que ofrece el objeto fully, si existe
  if(typeof fully !== 'undefined'){
    var nombres = [];
    for(var k in fully){
      try{ if(typeof fully[k] === 'function') nombres.push(k); }catch(e){}
    }
    nombres.sort();
    info.fully = nombres;
    // Separar lo que suene a impresión o a hardware
    info.impresion = nombres.filter(function(n){
      return /print|thermal|printer|escpos|drawer|cash|serial|usb/i.test(n);
    });
  }

  // Capacidades del navegador que nos interesan
  info.otros.push('Web Serial (cajón por USB en PC): ' + (navigator.serial ? 'sí' : 'no'));
  info.otros.push('Web Bluetooth: ' + (navigator.bluetooth ? 'sí' : 'no'));
  info.otros.push('Web USB: ' + (navigator.usb ? 'sí' : 'no'));
  info.otros.push('Service Worker: ' + (navigator.serviceWorker ? 'sí' : 'no'));
  info.otros.push('Pantalla táctil: ' + (esPantallaTactil() ? 'sí' : 'no'));
  info.otros.push('Resolución: ' + window.innerWidth + '×' + window.innerHeight);
  info.otros.push('Navegador: ' + navigator.userAgent.slice(0, 120));

  return info;
}

function copiarDiagnostico(){
  var i = inspeccionarEntorno();
  var txt = 'DIAGNÓSTICO Mil Pasos v' + APP_VERSION + '\n\n'

    + 'IMPRESIÓN/HARDWARE:\n' + (i.impresion.join('\n') || '(ninguna)') + '\n\n'
    + 'CAPACIDADES:\n' + i.otros.join('\n') + '\n\n'
    + 'FUNCIONES fully.* (' + i.fully.length + '):\n' + (i.fully.join(', ') || '(no disponible)');

  var ok = function(){ showToast('Informe copiado ✓', 'ok'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(function(){ pegarEnCuadro(txt); });
  } else {
    pegarEnCuadro(txt);

}

function renderAvisos(){
  var todos = state.avisos || [];
  var pend = avisosPendientes().length;

  var filas = todos.slice(0, 60).map(function(a){
    var f = new Date(a.fecha);
    var color = a.tipo === 'err' ? 'var(--red)' : (a.tipo === 'ok' ? 'var(--teal)' : 'var(--ink-dim)');
    var punto = '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+color+';flex-shrink:0;margin-top:5px;"></span>';
    return '<div style="display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);'
         + (a.validado ? 'opacity:.5;' : '') + '">'
         + punto
         + '<div style="min-width:0;flex:1;">'
         +   '<div style="font-size:12.5px;line-height:1.35;">' + escapeHtml(a.texto) + '</div>'
         +   '<div style="font-size:10.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums;">'
         +     f.toLocaleDateString('es-ES') + ' · ' + f.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
         +     (a.validado ? ' · validado' : '')
         +   '</div>'
         + '</div></div>';
  }).join('');

  if(!filas) filas = '<div style="padding:14px 0;color:var(--ink-dim);font-size:12.5px;">Sin avisos registrados.</div>';

  return '<div><h3 class="sub-title" style="margin-top:0;">🔔 Historial de avisos</h3>'
    + '<div class="ticket" style="width:100%;">'
    + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;">'
    +   '<span style="font-size:12.5px;color:var(--ink-dim);">Se guardan con fecha y hora</span>'
    +   '<span style="font-size:12px;color:' + (pend ? 'var(--red)' : 'var(--ink-dim)') + ';font-weight:700;">'
    +     (pend ? pend + ' sin validar' : 'todos validados') + '</span>'
    + '</div>'
    + '<div style="max-height:300px;overflow-y:auto;margin-top:10px;">' + filas + '</div>'
    + '<div class="ticket-actions" style="margin-top:10px;">'
    +   (pend ? '<button class="btn secondary" onclick="validarAvisos()">✔️ Validar avisos (' + pend + ')</button>' : '')
    +   (todos.length ? '<button class="btn small danger" onclick="borrarHistorialAvisos()">🗑️ Borrar historial</button>' : '')
    + '</div>'
    + '</div></div>';
}

    +     '</div>'

    +   '<div style="margin-top:14px;">'
    +     '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;">'
    +       '<span>Espacio usado en este equipo</span>'

    +     '</div>'
    +     '<div style="height:8px;background:var(--canvas);border-radius:4px;overflow:hidden;">'

        : '')
    +   '</div>'
    + '</div></div>';

function renderInformes(){
  const salesFiltradas = state.sales.filter(s=>matchesKpiPeriod(s.fecha));
  ultimasSalesFiltradas = salesFiltradas;
  const devolucionesFiltradas = state.devoluciones.filter(d=>matchesKpiPeriod(d.fecha));
  const ticketsFiltrados = state.tickets.filter(t=>matchesKpiPeriod(t.fecha));

  const valorStockCompra = state.products.reduce((sum,p)=> sum + stockTotal(p)*p.precioCompra, 0);
  const valorStockVenta = state.products.reduce((sum,p)=> sum + stockTotal(p)*precioConIVA(p.precioVenta), 0);
  const totalVentas = salesFiltradas.reduce((s,v)=>s+v.total,0);
  const totalIvaRepercutido = salesFiltradas.reduce((s,v)=>s+v.iva,0);
  const numPares = state.products.reduce((s,p)=>s+stockTotal(p),0);
  const ticketIds = new Set(salesFiltradas.map(s=>s.ticketId));
  const ticketPromedio = ticketIds.size ? totalVentas/ticketIds.size : 0;

  const totalDevoluciones = devolucionesFiltradas.filter(d=>d.motivo==='devolucion').reduce((a,d)=>a+d.importe,0);
  const totalGarantias = devolucionesFiltradas.filter(d=>d.motivo==='garantia').reduce((a,d)=>a+d.importe,0);
  const numDevoluciones = devolucionesFiltradas.filter(d=>d.motivo==='devolucion').reduce((a,d)=>a+d.cantidad,0);
  const numGarantias = devolucionesFiltradas.filter(d=>d.motivo==='garantia').reduce((a,d)=>a+d.cantidad,0);
  const totalDevueltoIva = devolucionesFiltradas.reduce((a,d)=>a+(d.iva||0),0);
  const ventasNetas = totalVentas - totalDevoluciones - totalGarantias;

  // Coste: solo artículos del catálogo (no artículos libres que no tienen precio de compra)
  const ventasCatalogo = salesFiltradas.filter(v=>!v.esManual && v.productId!=='__manual__');
  const totalCoste = ventasCatalogo.reduce((s,v)=>s+(v.subtotal-v.beneficio),0);
  const pctArticulosManuales = salesFiltradas.length ? Math.round(salesFiltradas.filter(v=>v.esManual||v.productId==='__manual__').length/salesFiltradas.length*100) : 0;

  // IVA soportado: estimación basada en coste de ventas × tipo IVA
  const ivaSoportadoEstimado = totalCoste * ((state.settings.ivaRate||21)/100);
  const ivaNeto = totalIvaRepercutido - ivaSoportadoEstimado;

  const totalBeneficio = salesFiltradas.filter(s=>s.productId!=='__manual__'&&!s.esManual)
    .reduce((a,s)=>a+beneficioRealSale(s), 0);
  const totalCosteReal = salesFiltradas.filter(s=>s.productId!=='__manual__'&&!s.esManual)
    .reduce((a,s)=>a+(s.subtotal-s.beneficio)*factorCosteRE(), 0);
  const subtotalVentas = salesFiltradas.reduce((s,v)=>s+v.subtotal,0);
  const margenMedioPct = totalVentas>0 ? (totalBeneficio/totalVentas)*100 : 0;

  // Número de tickets
  const numTickets = ticketIds.size;

  // Artículos vendidos
  const numArticulosVendidos = salesFiltradas.reduce((s,v)=>s+v.cantidad,0);
  const numZapatosVendidos = salesFiltradas.filter(function(v){
    if(v.esManual || v.productId==='__manual__') return false;
    var prod = state.products.find(function(x){ return x.id===v.productId; });
    return prod && prod.tipoArticulo==='zapatos';
  }).reduce((s,v)=>s+v.cantidad,0);
  const numOtrosVendidos = numArticulosVendidos - numZapatosVendidos;

  // Artículo más vendido
  const ventasPorModelo = {};
  salesFiltradas.forEach(function(v){
    const key = (v.marca||'') + ' ' + (v.modelo||'');
    if(!ventasPorModelo[key]) ventasPorModelo[key]=0;
    ventasPorModelo[key]+=v.cantidad;
  });
  const topModelo = Object.keys(ventasPorModelo).sort((a,b)=>ventasPorModelo[b]-ventasPorModelo[a])[0] || '—';
  const topModeloUnidades = ventasPorModelo[topModelo] || 0;

  // Desglose efectivo vs tarjeta
  const ticketsFiltradosArr = ticketsFiltrados;
  const totalEfectivo = ticketsFiltradosArr.filter(t=>(!t.metodoPago||t.metodoPago==='efectivo')).reduce((s,t)=>s+t.total,0);
  const totalTarjeta  = ticketsFiltradosArr.filter(t=>t.metodoPago==='tarjeta').reduce((s,t)=>s+t.total,0);

  const hasSales = state.sales.length>0;
  const hasSalesFiltradas = salesFiltradas.length>0;

  return `
    <h2 class="section-title">Informes y precios</h2>
    <div class="toolbar">
      <span style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-dim);">Periodo:</span>
      <select onchange="kpiPeriodo=this.value; kpiPeriodoFecha=null; render();">
        <option value="todos" ${kpiPeriodo==='todos'?'selected':''}>Todo el histórico</option>
        <option value="hoy" ${kpiPeriodo==='hoy'?'selected':''}>Hoy</option>
        <option value="ayer" ${kpiPeriodo==='ayer'?'selected':''}>Ayer</option>
        <option value="semana" ${kpiPeriodo==='semana'?'selected':''}>Esta semana</option>
        <option value="semana_pasada" ${kpiPeriodo==='semana_pasada'?'selected':''}>Semana pasada</option>
        <option value="mes" ${kpiPeriodo==='mes'?'selected':''}>Este mes</option>
        <option value="mes_pasado" ${kpiPeriodo==='mes_pasado'?'selected':''}>Mes pasado</option>
        <option value="anio" ${kpiPeriodo==='anio'?'selected':''}>Este año</option>
        <option value="anio_pasado" ${kpiPeriodo==='anio_pasado'?'selected':''}>Año pasado</option>
        <option value="personalizado" ${kpiPeriodo==='personalizado'?'selected':''}>Rango personalizado...</option>
      </select>
      <label style="margin:0;">Ver un día <input type="date" value="${kpiPeriodoFecha||''}" onchange="kpiPeriodoFecha=this.value; kpiPeriodo=this.value?'dia_especifico':'todos'; render()" style="margin-left:4px;"></label>
      ${kpiPeriodo==='personalizado' ? `
        <label style="margin:0;">Desde <input type="date" value="${kpiPeriodoFrom||''}" onchange="kpiPeriodoFrom=this.value;asegurarPeriodoDisponible(kpiPeriodoFrom,kpiPeriodoTo);render()" style="margin-left:4px;"></label>
        <label style="margin:0;">Hasta <input type="date" value="${kpiPeriodoTo||''}" onchange="kpiPeriodoTo=this.value;asegurarPeriodoDisponible(kpiPeriodoFrom,kpiPeriodoTo);render()" style="margin-left:4px;"></label>
      ` : ""}
    </div>
    <div class="kpis">
      <div class="kpi"><div class="kpi-icon">📦</div><div><div class="label">Pares en stock (actual)</div><div class="value">${numPares}</div></div></div>
      <div class="kpi"><div class="kpi-icon">💰</div><div><div class="label">Valor stock a precio de compra</div><div class="value">${eur(valorStockCompra)}</div></div></div>
      <div class="kpi"><div class="kpi-icon">🏷️</div><div><div class="label">Valor stock a PVP con IVA</div><div class="value">${eur(valorStockVenta)}</div></div></div>
    </div>

    <h4 class="sub-title" style="margin-top:18px;font-size:14px;">Ventas del periodo</h4>
    <div class="kpis">
      <div class="kpi"><div class="kpi-icon">🛒</div><div><div class="label">Ventas totales (PVP cobrado)</div><div class="value">${eur(totalVentas)}</div></div></div>
      <div class="kpi"><div class="kpi-icon">🎟️</div><div><div class="label">Nº tickets · Ticket medio</div><div class="value">${numTickets} · ${eur(ticketPromedio)}</div></div></div>
      <div class="kpi beneficio"><div class="kpi-icon">✅</div><div><div class="label">Ventas netas (tras devoluciones)</div><div class="value" style="${ventasNetas<0?'color:var(--red)':''}">${eur(ventasNetas)}</div></div></div>
      <div class="kpi"><div class="kpi-icon">💵</div><div><div class="label">Cobrado en efectivo</div><div class="value">${eur(totalEfectivo)}</div></div></div>
      <div class="kpi"><div class="kpi-icon">💳</div><div><div class="label">Cobrado con tarjeta</div><div class="value">${eur(totalTarjeta)}</div></div></div>
      <div class="kpi beneficio"><div class="kpi-icon">📈</div><div><div class="label">Beneficio real · Margen medio</div><div class="value">${eur(totalBeneficio)} · ${pct(margenMedioPct)}</div></div></div>
      <div class="kpi"><div class="kpi-icon">👟</div><div><div class="label">Artículos vendidos · Zapatos · Otros</div><div class="value">${numArticulosVendidos} · ${numZapatosVendidos} · ${numOtrosVendidos}</div></div></div>
      <div class="kpi"><div class="kpi-icon">🏆</div><div><div class="label">Artículo más vendido</div><div class="value" style="font-size:13px;">${escapeHtml(topModelo)}${topModeloUnidades>0?' ('+topModeloUnidades+' uds)':''}</div></div></div>
    </div>

    <h4 class="sub-title" style="margin-top:18px;font-size:14px;">Devoluciones y garantías</h4>
    <div class="kpis">
      <div class="kpi"><div class="kpi-icon">↩️</div><div><div class="label">Devoluciones</div><div class="value">${numDevoluciones} uds · ${eur(totalDevoluciones)}</div></div></div>
      <div class="kpi"><div class="kpi-icon">🛡️</div><div><div class="label">Garantías</div><div class="value">${numGarantias} uds · ${eur(totalGarantias)}</div></div></div>
    </div>

    <h4 class="sub-title" style="margin-top:18px;font-size:14px;">Régimen de Recargo de Equivalencia</h4>
    <div class="kpis">
      <div class="kpi"><div class="kpi-icon">🧾</div><div><div class="label">IVA repercutido en ventas (te lo quedas)</div><div class="value" style="color:var(--teal)">${eur(totalIvaRepercutido)}</div></div></div>
      <div class="kpi"><div class="kpi-icon">💸</div><div><div class="label">Coste real total (IVA+RE pagado al proveedor)</div><div class="value">${eur(totalCosteReal)}</div></div></div>
    </div>
    <div class="note" style="font-size:12px;margin-top:8px;">En Recargo de Equivalencia <b>no presentas Modelo 303 ni 390</b>. El IVA que cobras al cliente te lo quedas. El recargo (${state.settings.recargoEquivalencia||5.2}%) lo paga tu proveedor en la factura de compra.</div>
    ${kpiPeriodo!=='todos' && !hasSalesFiltradas ? `<div class="note">No hay ventas registradas en el periodo seleccionado. Los importes de arriba están a cero salvo el stock actual, que no depende del periodo.</div>` : ""}

    <h3 class="sub-title">Seguimiento de ventas</h3>
    ${hasSales ? `
    <div class="chart-controls">
      <div class="toolbar" style="margin-bottom:10px;">
        <span style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-dim);">Ver por:</span>
        <button class="btn small ${informesPeriodo==='mensual'?'accent':'secondary'}" onclick="setInformesPeriodo('mensual')">Mensual</button>
        <button class="btn small ${informesPeriodo==='anual'?'accent':'secondary'}" onclick="setInformesPeriodo('anual')">Anual</button>
      </div>
      <div class="ticket" style="margin-bottom:16px;">
        <div class="toolbar" style="margin-bottom:8px;">
          <label style="margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.5px;">Modelos/marcas en la gráfica de evolución</label>
          <button class="btn small secondary" onclick="seleccionarTopModelos()">Top 6</button>
          <button class="btn small secondary" onclick="seleccionarTodosModelos()">Todos</button>
          <button class="btn small secondary" onclick="seleccionarNingunModelo()">Ninguno</button>
        </div>
        <div class="model-checks">
          ${Object.keys(modelosPorMarca()).sort((a,b)=>a.localeCompare(b,'es')).map(marca=>{
            const modelos = modelosPorMarca()[marca];
            const seleccionados = getSelectedModelKeys();
            const todasSeleccionadas = modelos.every(k=>seleccionados.includes(k));
            const algunaSeleccionada = modelos.some(k=>seleccionados.includes(k));

                  return `<label class="model-check"><input type="checkbox" data-modelkey="${escapeAttr(k)}" ${seleccionados.includes(k)?'checked':''} onchange="toggleModeloSeleccionado('${escapeAttr(k)}', this.checked)"> ${escapeHtml(nombreModelo)}</label>`;
                }).join("")}
              </div>
            </details>`;
          }).join("")}
        </div>
      </div>
    </div>
    <div class="charts-grid">
      <div class="chart-card">
        <h4>Ventas ${informesPeriodo==='anual'?'anuales':'mensuales'} por modelo (unidades)</h4>
        ${getSelectedModelKeys().length? `<canvas id="chart-monthly"></canvas>` : `<div class="cart-empty">Selecciona al menos un modelo o marca para ver esta gráfica.</div>`}
      </div>

// ---------------- CALCULADORA DE CAMBIO ----------------
function abrirCalculadoraCambio(){
  // Total del carrito actual si hay artículos, si no 0
  var totalCarrito = cart.length > 0 ? cartTotals().total : 0;

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:340px;">
        <h3 style="margin-bottom:16px;">🧮 Calculadora de cambio</h3>

        <div class="field">
          <label>Total a cobrar (€)</label>
          <input type="number" id="calc-total" step="0.01" min="0"
            value="${totalCarrito>0 ? totalCarrito.toFixed(2) : ''}"
            placeholder="0,00"
            style="width:100%;font-size:20px;font-weight:700;text-align:right;"
            oninput="actualizarCambio()">
        </div>

        <div class="field" style="margin-top:8px;">
          <label>El cliente entrega (€)</label>
          <input type="number" id="calc-pago" step="0.01" min="0"
            placeholder="0,00"
            style="width:100%;font-size:24px;font-weight:700;text-align:right;color:var(--coral);"
            oninput="actualizarCambio()">
        </div>

        <!-- Teclado numérico rápido para pantalla táctil -->
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 6px;">
          ${[5,10,20,50,100].map(v=>`
            <button onclick="var i=document.getElementById('calc-pago');i.value=(Math.round(((parseFloat(i.value)||0)+${v})*100)/100).toFixed(2);actualizarCambio();"
              style="background:var(--canvas);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 2px;font-size:13.5px;font-weight:700;cursor:pointer;">
              ${v}€
            </button>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:6px;">
          ${[0.05,0.10,0.20,0.50,1,2].map(v=>`
            <button onclick="var i=document.getElementById('calc-pago');i.value=(Math.round(((parseFloat(i.value)||0)+${v})*100)/100).toFixed(2);actualizarCambio();"
              style="background:#FFF8E7;border:1.5px solid #E8D5A0;border-radius:var(--radius-sm);padding:8px 1px;font-size:12px;font-weight:700;cursor:pointer;color:#7A5C00;">
              ${v<1?(v*100).toFixed(0)+'¢':v+'€'}
            </button>`).join('')}
        </div>
        <div style="margin-bottom:10px;">
          <button onclick="document.getElementById('calc-pago').value='';actualizarCambio();"
            style="width:100%;background:#FEE;border:1.5px solid #F5C2C2;border-radius:var(--radius-sm);padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--red);">
            ⌫ Borrar
          </button>
        </div>

        <div id="calc-resultado" style="background:var(--teal-light);border-radius:var(--radius-sm);padding:16px;text-align:center;margin-bottom:16px;display:none;">
          <div style="font-size:12px;color:var(--teal);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Cambio a devolver</div>
          <div id="calc-cambio" style="font-size:36px;font-weight:800;color:var(--teal);"></div>
        </div>

        <div id="calc-error" style="background:#FEE;border-radius:var(--radius-sm);padding:12px;text-align:center;margin-bottom:16px;color:var(--red);font-weight:700;display:none;">
          ⚠️ El cliente no entrega suficiente dinero
        </div>

        <div class="modal-actions" style="justify-content:center;">
          <button class="btn secondary" onclick="closeModal()">Cerrar</button>
        </div>
      </div>
    </div>
  `;
  // Si hay total del carrito, enfocar el campo de pago
  var campoPago = document.getElementById('calc-pago');
  if(campoPago) campoPago.focus();
}

function actualizarCambio(){
  var total = parseFloat(document.getElementById('calc-total').value) || 0;
  var pago  = parseFloat(document.getElementById('calc-pago').value)  || 0;
  var resDiv = document.getElementById('calc-resultado');
  var errDiv = document.getElementById('calc-error');
  var cambioDiv = document.getElementById('calc-cambio');

  if(!resDiv || !errDiv || !cambioDiv) return;

  if(pago <= 0 || total <= 0){
    resDiv.style.display = 'none';
    errDiv.style.display = 'none';
    return;
  }

  // Comparar en céntimos enteros. El total puede llegar con arrastre de
  // coma flotante (73,450000000000003) y entonces un pago de 73,45 € se
  // consideraba insuficiente aunque fuese el importe exacto.
  var pagoCent  = Math.round(pago * 100);
  var totalCent = Math.round(total * 100);
  var cambio = (pagoCent - totalCent) / 100;
  if(pagoCent < totalCent){
    resDiv.style.display = 'none';
    errDiv.style.display = 'block';
  } else {
    errDiv.style.display = 'none';
    resDiv.style.display = 'block';
    cambioDiv.textContent = eur(cambio);
  }
}

// ---------------- CAJÓN / IMPRESORA (Bluetooth + USB) ----------------
var cajonPort = null;
var cajonBT = null;
var cajonBTChar = null;
var BLE_SERVICES = [
  '000018f0-0000-1000-8000-00805f9b34fb',  // genéricas
  '6e400001-b5a3-f393-e0a9-e50e24dcca9e',  // Nordic UART (muchas impresoras chinas)
  '49535343-fe7d-4ae5-8fa9-9fafd205e455',  // ISSC BLE UART
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2',  // algunas Epson BT
  '000018f0-0000-1000-8000-00805f9b34fb',
];
var BLE_WRITE_CHARS = [
  '00002af1-0000-1000-8000-00805f9b34fb',  // genérica
  '6e400002-b5a3-f393-e0a9-e50e24dcca9e',  // Nordic UART TX
  '49535343-8841-43f4-a818-efb9537f6347',  // ISSC TX
];

// ---- CONEXIÓN USB ----
async function conectarCajonUSB(){
  if(!navigator.serial){
    showToast("Web Serial no disponible. Usa Bluetooth o Chrome de escritorio para USB.", "err");
    return;
  }
  try{
    cajonPort = await navigator.serial.requestPort();
    await cajonPort.open({ baudRate: 9600 });
    state.settings.cajonHabilitado = true;
    state.settings.cajonModo = 'usb';
    saveState(); render();
    showToast("Impresora conectada por USB ✓", "ok");
  }catch(e){ console.error(e); showToast("No se pudo conectar por USB.", "err"); }
}

// ---- CONEXIÓN BLUETOOTH ----
async function conectarCajonBluetooth(){
  if(!navigator.bluetooth){
    showToast("Web Bluetooth no disponible en este navegador.", "err");
    return;
  }
  try{
    showToast("Buscando impresora Bluetooth...", "ok");
    var device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: BLE_SERVICES
    });
    showToast("Conectando con " + device.name + "...", "ok");
    var server = await device.gatt.connect();

    // Buscar el primer servicio+característica que permita escribir
    var encontrado = false;
    for(var si=0; si<BLE_SERVICES.length && !encontrado; si++){
      try{
        var service = await server.getPrimaryService(BLE_SERVICES[si]);
        var chars = await service.getCharacteristics();
        for(var ci=0; ci<chars.length && !encontrado; ci++){
          var props = chars[ci].properties;
          if(props.write || props.writeWithoutResponse){
            cajonBTChar = chars[ci];
            cajonBT = device;
            encontrado = true;
          }
        }
      }catch(e){ /* este servicio no existe en este dispositivo */ }
    }

    if(!encontrado){
      showToast("Impresora conectada pero no se encontró canal de escritura. Prueba a imprimir con 'window.print()'.", "err");
      return;
    }

    state.settings.cajonHabilitado = true;
    state.settings.cajonModo = 'bluetooth';
    saveState(); render();
    showToast("Impresora Bluetooth conectada: " + device.name + " ✓", "ok");

    // Reconectar automáticamente si el dispositivo se desconecta
    device.addEventListener('gattserverdisconnected', function(){
      cajonBT = null; cajonBTChar = null;
      showToast("Impresora Bluetooth desconectada", "err");
    });
  }catch(e){
    console.error(e);
    if(e.name !== 'NotFoundError') showToast("No se pudo conectar por Bluetooth: " + e.message, "err");
  }
}

// ---- COMPATIBILIDAD: conectar según lo disponible ----
async function conectarCajon(){
  if(navigator.bluetooth){
    await conectarCajonBluetooth();
  } else if(navigator.serial){
    await conectarCajonUSB();
  } else {
    showToast("Sin soporte de conexión directa en este navegador.", "err");
  }
}

async function desconectarCajon(){
  try{ if(cajonBT && cajonBT.gatt.connected) cajonBT.gatt.disconnect(); }catch(e){}
  try{ if(cajonPort) await cajonPort.close(); }catch(e){}
  cajonPort = null; cajonBT = null; cajonBTChar = null;
  state.settings.cajonHabilitado = false;
  saveState(); render();
}

async function intentarReconectarCajon(){
  if(!state.settings.cajonHabilitado) return;
  if(state.settings.cajonModo === 'usb' && navigator.serial){
    try{
      var ports = await navigator.serial.getPorts();
      if(ports.length){ cajonPort = ports[0]; if(!cajonPort.writable) await cajonPort.open({ baudRate: 9600 }); }
    }catch(e){ console.error("No se pudo reconectar USB:", e); }
  }
  // Bluetooth no se puede reconectar automáticamente sin interacción del usuario
}

// ---- ABRIR CAJÓN: envía el comando ESC/POS por el canal disponible ----
async function abrirCajon(){
  // Si la impresión térmica está activa, el cajón se abre por la impresora,
  // que es como está conectado. La vía antigua (Web Serial / Bluetooth) se
  // conserva para el PC, donde sí está disponible.
  if(state.settings.escposActivo === true){ abrirCajonESCPOS(); return; }

  var CMD = new Uint8Array([0x1B, 0x70, 0x00, 0x19, 0xFA]);

  // Bluetooth primero
  if(cajonBTChar){
    try{
      if(cajonBTChar.properties.writeWithoutResponse){
        await cajonBTChar.writeValueWithoutResponse(CMD);
      } else {
        await cajonBTChar.writeValue(CMD);
      }
      return;
    }catch(e){ console.error("Error abriendo cajón BT:", e); }
  }

  // USB como alternativa
  if(cajonPort && cajonPort.writable){
    try{
      var writer = cajonPort.writable.getWriter();
      await writer.write(CMD);
      writer.releaseLock();
      return;
    }catch(e){ console.error("Error abriendo cajón USB:", e); }
  }

  // Sin conexión directa: intentar abrir el diálogo de impresión de Android
  // que puede enrutar a la impresora BT si está configurada en el sistema
  showToast("Sin conexión directa con la caja. Conecta la impresora primero.", "err");
}

// Imprime usando un iframe oculto en la propia página.
// Antes se abría una ventana emergente, y los navegadores en modo kiosco
// (Fully Kiosk) y muchos móviles las bloquean: salía "pop-ups disabled".
// El iframe no necesita ningún permiso y funciona en todas partes.
function imprimirHTML(contenidoHTML, etiqueta){
  var previo = document.getElementById('marco-impresion');
  if(previo && previo.parentNode) previo.parentNode.removeChild(previo);

  var marco = document.createElement('iframe');
  marco.id = 'marco-impresion';
  marco.setAttribute('aria-hidden','true');
  marco.style.cssText = 'position:fixed;left:-10000px;top:0;width:80mm;height:100vh;border:0;visibility:hidden;';
  document.body.appendChild(marco);

  var doc = marco.contentWindow.document;
  doc.open();
  doc.write('<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>'
    + (etiqueta || 'Ticket') + '</title><style>' + estilosTicket() + '</style></head><body>'
    + contenidoHTML + '</body></html>');
  doc.close();

  var lanzar = function(){
    try{
      marco.contentWindow.focus();
      marco.contentWindow.print();
    }catch(e){
      console.error('Error al imprimir:', e);
      showToast('No se pudo abrir el diálogo de impresión.', 'err');
    }
    // Retirar el iframe cuando el diálogo ya se ha mostrado
    setTimeout(function(){ if(marco.parentNode) marco.parentNode.removeChild(marco); }, 60000);
  };

  // Dar tiempo a que carguen las imágenes del ticket antes de imprimir
  if(marco.contentWindow.document.readyState === 'complete') setTimeout(lanzar, 250);
  else marco.onload = function(){ setTimeout(lanzar, 250); };
}

// Igual que imprimirHTML pero para documentos que traen su propio <style>
// (informe PDF, hoja de etiquetas). Sin ventanas emergentes.
function imprimirDocumento(htmlCompleto, etiqueta){
  var previo = document.getElementById('marco-impresion');
  if(previo && previo.parentNode) previo.parentNode.removeChild(previo);

  var marco = document.createElement('iframe');
  marco.id = 'marco-impresion';
  marco.setAttribute('aria-hidden','true');
  marco.style.cssText = 'position:fixed;left:-10000px;top:0;width:210mm;height:100vh;border:0;visibility:hidden;';
  document.body.appendChild(marco);

  var doc = marco.contentWindow.document;
  doc.open(); doc.write(htmlCompleto); doc.close();

  var lanzar = function(){
    try{ marco.contentWindow.focus(); marco.contentWindow.print(); }
    catch(e){ console.error(e); showToast('No se pudo abrir el diálogo de impresión.', 'err'); }
    setTimeout(function(){ if(marco.parentNode) marco.parentNode.removeChild(marco); }, 60000);
  };
  if(doc.readyState === 'complete') setTimeout(lanzar, 350);
  else marco.onload = function(){ setTimeout(lanzar, 350); };
}

// ============ IMPRESIÓN ESC/POS DIRECTA (RawBT) ============
// Enviar el ticket como imagen obliga a la impresora a tragar cientos de
// kilobytes y su búfer se desborda: es el error "No ACK". Con ESC/POS se
// manda texto plano con códigos de formato, unos pocos kilobytes, que es
// como imprimen los TPV de verdad.

// Páginas de códigos habituales en impresoras térmicas. La correcta depende
// del modelo, así que se elige en Ajustes y se comprueba con el ticket de prueba.
var PAGINAS_CODIGOS = [
  {id:19, nombre:'CP858 — Europa occidental con € (la más habitual)', euro:213},
  {id:16, nombre:'CP1252 — Windows Europa occidental', euro:128},
  {id:32, nombre:'ISO 8859-15 — Latín 9 con €', euro:164},
  {id:15, nombre:'ISO 8859-1 — Latín 1', euro:164},
  {id:2,  nombre:'CP850 — Multilingüe (sin €)', euro:null},
  {id:0,  nombre:'CP437 — Estados Unidos (sin €)', euro:null},
  {id:-1, nombre:'Sin acentos (ASCII, funciona siempre)', euro:null}
];

// Posición del € en la página elegida, o null si esa página no lo tiene
function posicionEuro(){
  // Si se ha encontrado el byte real con el mapa de caracteres, se usa ese
  // directamente y no depende de qué página seleccione ESC t (que muchas
  // impresoras baratas ignoran).
  if(state.settings.escposEuroByte !== undefined && state.settings.escposEuroByte !== null && state.settings.escposEuroByte !== ''){
    var n = parseInt(state.settings.escposEuroByte, 10);
    if(!isNaN(n) && n >= 0 && n <= 255) return n;
  }
  var p = state.settings.escposPagina;
  if(p === undefined) p = 19;
  var f = PAGINAS_CODIGOS.find(function(x){ return x.id === p; });
  return f ? f.euro : null;
}

// Equivalencias para cuando se imprime sin acentos
var SIN_ACENTOS = {
  'á':'a','é':'e','í':'i','ó':'o','ú':'u','ü':'u','ñ':'n','ç':'c',
  'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U','Ü':'U','Ñ':'N','Ç':'C',
  'à':'a','è':'e','ì':'i','ò':'o','ù':'u','€':'EUR','º':'o','ª':'a','·':'-',
  '–':'-','—':'-','“':'"','”':'"','‘':"'",'’':"'",'…':'...'
};

// Posición de los caracteres acentuados en CP850/CP858 (las más usadas en España)
var CP850 = {
  'Ç':128,'ü':129,'é':130,'â':131,'ä':132,'à':133,'å':134,'ç':135,'ê':136,'ë':137,
  'è':138,'ï':139,'î':140,'ì':141,'Ä':142,'Å':143,'É':144,'æ':145,'Æ':146,'ô':147,
  'ö':148,'ò':149,'û':150,'ù':151,'ÿ':152,'Ö':153,'Ü':154,'ø':155,'£':156,'Ø':157,
  'á':160,'í':161,'ó':162,'ú':163,'ñ':164,'Ñ':165,'ª':166,'º':167,'¿':168,
  'Á':181,'Â':182,'À':183,'©':184,'Ã':199,'Í':214,'Ó':224,'Ú':233,'Õ':229,
  // El euro NO existe en CP850: solo en CP858, en la posición 213.
  // En CP850 esa posición es la 'ı' sin punto, que se imprime como un "1".
  // El euro se trata aparte, según la página elegida
};

// Cómo imprimir el símbolo del euro. Muchas impresoras no lo tienen en su
// página de códigos y sacan un carácter equivocado, así que se puede elegir.
var OPCIONES_EURO = [
  {id:'eur',    nombre:'EUR  (recomendado — funciona en cualquier impresora)'},
  {id:'simbolo',nombre:'€  (pruébalo con el Mapa de caracteres primero)'},
  {id:'nada',   nombre:'Sin símbolo, solo la cifra'}
];

function escposTexto(txt){
  var pagina = state.settings.escposPagina;
  if(pagina === undefined) pagina = 19;
  var salida = '';
  txt = String(txt);

  // Sustituir el euro antes de nada, según lo configurado
  var modoEuro = state.settings.escposEuro || 'eur';
  if(modoEuro === 'eur')       txt = txt.replace(/\s*€/g, ' EUR');
  else if(modoEuro === 'nada') txt = txt.replace(/\s*€/g, '');
  else if(posicionEuro() === null){
    // Se pidió el símbolo pero la página elegida no lo tiene
    txt = txt.replace(/\s*€/g, ' EUR');
  }
  // Si la página sí lo tiene, el € se convierte dentro del bucle de abajo,
  // para que el byte resultante no se vuelva a procesar.

  if(pagina === -1){
    // Modo ASCII: se sustituyen los acentos
    for(var i=0;i<txt.length;i++){
      var c = txt.charAt(i);
      if(c === '€'){ salida += 'EUR'; continue; }
      salida += (SIN_ACENTOS[c] !== undefined) ? SIN_ACENTOS[c] : (txt.charCodeAt(i) < 128 ? c : '?');
    }
    return salida;
  }

  var posEuro = posicionEuro();
  for(var j=0;j<txt.length;j++){
    var ch = txt.charAt(j), cod = txt.charCodeAt(j);
    if(cod < 128){ salida += ch; continue; }
    if(ch === '€'){
      salida += (posEuro !== null) ? String.fromCharCode(posEuro) : 'EUR';
      continue;
    }
    if(pagina === 16){
      // CP1252 coincide con Unicode hasta 255
      salida += (cod <= 255) ? String.fromCharCode(cod)
              : (SIN_ACENTOS[ch] !== undefined ? SIN_ACENTOS[ch] : '?');
    } else if(CP850[ch] !== undefined){
      salida += String.fromCharCode(CP850[ch]);
    } else {
      salida += (SIN_ACENTOS[ch] !== undefined) ? SIN_ACENTOS[ch] : '?';
    }
  }
  return salida;
}

// Decodifica el arte (sin relleno) a una matriz de bytes por fila, para
// poder desplazarla dentro del lienzo del ancho del papel.
function _logoFilasBytes(art){
  var bin = atob(art.b64);
  var anchoBytes = art.ancho / 8;
  var filas = [];
  for(var y=0; y<art.alto; y++){
    filas.push(bin.slice(y*anchoBytes, y*anchoBytes+anchoBytes));
  }
  return filas;
}

function logoESCPOS(){
  var columnas = state.settings.escposColumnas || 48;
  var art = (columnas <= 32) ? LOGO_ART_58MM : LOGO_ART_80MM;
  var lienzoAncho = (columnas <= 32) ? 384 : 576;   // puntos totales del papel
  var lienzoBytes = lienzoAncho / 8;

  try{
    var filas = _logoFilasBytes(art);
    var anchoArteBytes = art.ancho / 8;

    // Posición deseada del centro del zapato: el centro del papel, corregido
    // con el ajuste manual (en puntos; negativo = más a la izquierda).
    var offsetPt = state.settings.escposLogoOffsetX || 0;
    var centroDeseado = (lienzoAncho/2) + offsetPt;
    var inicioArte = centroDeseado - art.cxCirculo;   // dónde empieza el arte
    // Se trabaja en bytes enteros (pasos de 8 puntos, ~1mm): suficiente
    // precisión para un ajuste a mano y evita partir bits entre bytes.
    var padIzqBytes = Math.round(inicioArte / 8);
    if(padIzqBytes < 0) padIzqBytes = 0;
    if(padIzqBytes > lienzoBytes - anchoArteBytes) padIzqBytes = Math.max(0, lienzoBytes - anchoArteBytes);
    var padDerBytes = Math.max(0, lienzoBytes - anchoArteBytes - padIzqBytes);

    var vacioIzq = String.fromCharCode(0).repeat(padIzqBytes);
    var vacioDer = String.fromCharCode(0).repeat(padDerBytes);
    var cuerpo = '';
    for(var y=0; y<filas.length; y++){
      cuerpo += vacioIzq + filas[y] + vacioDer;
    }

    var cabecera = String.fromCharCode(0x1D,0x76,0x30,0,
      lienzoBytes & 0xFF, (lienzoBytes>>8) & 0xFF,
      art.alto & 0xFF, (art.alto>>8) & 0xFF);

    return cabecera + cuerpo + String.fromCharCode(10);
  }catch(e){ return ''; }
}

// --- Constructor de comandos ---
function ESCPOS(){
  this.b = '';
  this.ancho = state.settings.escposColumnas || 48;
}
ESCPOS.prototype.raw = function(){ for(var i=0;i<arguments.length;i++) this.b += String.fromCharCode(arguments[i]); return this; };
ESCPOS.prototype.init = function(){
  this.raw(27,64);                                  // ESC @ — reiniciar
  var p = state.settings.escposPagina;
  if(p === undefined) p = 19;
  if(p >= 0) this.raw(27,116,p);                    // ESC t n — página de códigos
  return this;
};
ESCPOS.prototype.texto = function(t){ this.b += escposTexto(t); return this; };
ESCPOS.prototype.linea = function(t){ return this.texto(t === undefined ? '' : t).raw(10); };
ESCPOS.prototype.centrar = function(){ return this.raw(27,97,1); };
ESCPOS.prototype.izquierda = function(){ return this.raw(27,97,0); };
ESCPOS.prototype.derecha = function(){ return this.raw(27,97,2); };
ESCPOS.prototype.negrita = function(on){ return this.raw(27,69, on?1:0); };
ESCPOS.prototype.doble = function(on){ return this.raw(29,33, on?0x11:0); };  // GS ! — doble alto y ancho
ESCPOS.prototype.altoDoble = function(on){ return this.raw(29,33, on?0x01:0); };
ESCPOS.prototype.separador = function(car){
  return this.linea(new Array(this.ancho+1).join(car || '-'));
};
// Dos columnas: etiqueta a la izquierda, importe a la derecha
ESCPOS.prototype.fila = function(izq, der){
  izq = String(izq); der = String(der);
  var hueco = this.ancho - izq.length - der.length;
  if(hueco < 1){
    izq = izq.slice(0, Math.max(0, this.ancho - der.length - 1));
    hueco = Math.max(1, this.ancho - izq.length - der.length);
  }
  return this.linea(izq + new Array(hueco+1).join(' ') + der);
};
ESCPOS.prototype.avanzar = function(n){ return this.raw(27,100, n||3); };
ESCPOS.prototype.cortar = function(){ return this.raw(29,86,66,0); };          // GS V B — corte parcial
ESCPOS.prototype.cajon = function(){ return this.raw(27,112,0,25,250); };      // ESC p — pulso al cajón
ESCPOS.prototype.bytes = function(){ return this.b; };

      + ';action=' + RAWBT_ACCION
      + ';package=' + RAWBT_PAQUETE
      + ';S.' + RAWBT_EXTRA + '=' + encodeURIComponent('base64,' + b64)
      + ';end';
    window.location.href = url;
    return true;
  }catch(e){ return false; }
}

// Vía 3: interfaz JavaScript de Fully Kiosk
function _rawbtPorFully(b64){
  if(typeof fully === 'undefined' || typeof fully.startApplication !== 'function') return false;
  try{
    fully.startApplication(RAWBT_PAQUETE, 'android.intent.action.VIEW', 'rawbt:base64,' + b64);
    return true;
  }catch(e){ return false; }
}

function enviarARawBT(datos, etiqueta){
  var b64 = _rawbtBase64(datos);
  if(!b64) return false;

  var metodo = state.settings.rawbtMetodo || 'auto';
  var usado = null;

  if(metodo === 'fully')       { if(_rawbtPorFully(b64))  usado = 'Fully Kiosk'; }
  else if(metodo === 'intent') { if(_rawbtPorIntent(b64)) usado = 'intent'; }
  else if(metodo === 'url')    { if(_rawbtPorUrl(b64))    usado = 'rawbt:'; }
  else {
    // Automático: de la más fiable a la más genérica
    if(_rawbtPorFully(b64))       usado = 'Fully Kiosk';
    else if(_rawbtPorIntent(b64)) usado = 'intent';
    else if(_rawbtPorUrl(b64))    usado = 'rawbt:';
  }

  if(!usado){
    showToast('No se pudo abrir RawBT. Prueba otro método de envío en Informes.', 'err');
    return false;
  }

  _ultimoEnvioRawBT = { via: usado, bytes: datos.length, hora: new Date() };
  return true;
}

var _ultimoEnvioRawBT = null;

// --- Ticket completo en ESC/POS ---
function ticketESCPOS(ticketId){
  var t = state.tickets.find(function(x){ return x.id === ticketId; });
  if(!t) return null;
  var lineas = state.sales.filter(function(s){ return s.ticketId === ticketId; });
  var s = state.settings;
  var ver = function(clave){ return s[clave] !== false; };

  var p = new ESCPOS();
  p.init().centrar();

  if(s.escposLogo === true){ p.b += logoESCPOS(); }

  if(ver('ticket_nombre') && s.nombreTienda){ p.negrita(true).altoDoble(true).linea(s.nombreTienda.toUpperCase()).altoDoble(false).negrita(false); }
  if(ver('ticket_direccion') && s.direccion) p.linea(s.direccion);
  if(ver('ticket_telefono')  && s.telefono)  p.linea('Tel. ' + s.telefono);
  if(ver('ticket_email')     && s.email)     p.linea(s.email);
  if(ver('ticket_web')       && s.web)       p.linea(s.web);
  if(ver('ticket_nif')       && s.nif)       p.linea('NIF: ' + s.nif);
  if((s.ticket_cabecera||'').trim()) p.linea(s.ticket_cabecera.trim());

  p.izquierda().separador('=');
  if(ver('ticket_numero')) p.fila('Ticket', t.numSerieFactura || '');
  p.fila('Fecha', new Date(t.fecha).toLocaleString('es-ES'));
  p.linea('(Importes en euros)');
  p.separador('=');

  lineas.forEach(function(ln){
    p.negrita(true).linea((ln.marca||'') + ' ' + (ln.modelo||'')).negrita(false);
    p.fila('  Talla ' + ln.talla + ' x' + ln.cantidad, eurSinDivisa(ln.total||0));

    if(ln.promoTipo && ver('ticket_promos')){
      // Mismo formato que la previsualización en pantalla.
      // ESC/POS no tiene comando de tachado, así que el PVP original va
      // subrayado, que es lo más parecido que admiten estas impresoras.
      var origUnit = precioConIVA(ln.precioOriginalUnit || 0);
      p.texto('  PVP orig. ')
       .raw(27,45,1)               // ESC - 1 : subrayado
       .texto(eurSinDivisa(origUnit))
       .raw(27,45,0)               // ESC - 0 : fin del subrayado
       .texto('/ud - Promo ' + (ln.promoTipo==='porcentaje' ? '-'+ln.promoValor+'%' : '-'+eurSinDivisa(ln.promoValor)))
       .raw(10);
    }

    if(ln.descManualActivo && ver('ticket_descuentos')){
      p.linea('  Dto. ' + (ln.descManualTipo==='porcentaje' ? '-'+ln.descManualValor+'%' : '-'+eurSinDivisa(ln.descManualValor))
              + '   -' + eurSinDivisa(ln.descManualImporte || 0));
    }
  });

  p.separador('-');
  if(t.descuento && ver('ticket_descuentos')) p.fila('Descuento', '-' + eurSinDivisa(t.descuento.importe||0));
  if(ver('ticket_desgloseIva')){
    p.fila('Base imponible', eurSinDivisa(t.subtotal||0));
    p.fila('IVA (' + (s.ivaRate||21) + '%)', eurSinDivisa(t.iva||0));
  }
  // El TOTAL en tamaño doble va en su propia línea: si se combina con la
  // etiqueta "TOTAL" y el relleno de espacios de fila(), el texto entero se
  // dobla de ancho y desborda la línea física, partiendo "EUR" en dos
  // renglones ("...128,00 E" / "UR"). Separado así nunca desborda, sea cual
  // sea el importe.
  p.negrita(true).linea('TOTAL').negrita(false);
  p.negrita(true).doble(true).derecha().linea(eur(t.total||0)).doble(false).izquierda().negrita(false);
  if(ver('ticket_formaPago')) p.fila('Forma de pago', metodoPagoLabel(t.metodoPago));

  var pie = (s.ticket_pie !== undefined ? s.ticket_pie : '¡Gracias por su compra!').trim();
  if(pie){ p.linea().separador('-').linea().centrar().linea(pie).izquierda(); }

  p.avanzar(state.settings.escposMargenPie || 6);
  if(s.escposCajon === true && t.metodoPago === 'efectivo') p.cajon();
  if(s.escposCortar !== false) p.cortar();

  return p.bytes();
}

// Ticket de prueba: sirve para elegir la página de códigos correcta
// ============ DIAGNÓSTICO DE LA IMPRESORA ============
// Muchas térmicas baratas ignoran ESC t (selección de página de códigos) y
// usan la suya fija. Entonces no hay forma de acertar el byte del euro
// probando páginas: hay que ver el mapa real que imprime el aparato.

function mapaCaracteres(){
  var p = new ESCPOS();
  p.raw(27,64);   // reiniciar, sin tocar la página: queremos ver la de fábrica
  p.centrar().negrita(true).linea('MAPA DE CARACTERES').negrita(false);
  p.linea('Busca el simbolo del euro').izquierda();
  p.separador('=');

  // Bytes 128 a 255, ocho por fila, con su número delante
  for(var base=128; base<256; base+=8){
    var etiqueta = '';
    for(var k=0;k<8;k++){
      etiqueta += String(base+k).padStart(3,' ') + ' ';
    }
    p.texto(etiqueta).raw(10);
    p.texto('  ');
    for(var k2=0;k2<8;k2++){
      p.raw(base+k2).texto('   ');
    }
    p.raw(10);
  }
  p.separador('=');
  p.linea('Anota el numero bajo el simbolo EUR');
  p.avanzar(state.settings.escposMargenPie || 6);
  if(state.settings.escposCortar !== false) p.cortar();

  if(enviarARawBT(p.bytes(), 'Mapa')){
    showToast('Mapa enviado. Si no ves el símbolo € en ningún número, esta impresora no lo tiene: usa el modo EUR en texto.', 'ok', true);
  }
}

function eliminarTicket(ticketId){
  borrarTicketRemoto(ticketId);

  const t = state.tickets.find(x=>x.id===ticketId);
  if(!t) return;
  // Guardar scroll AHORA, antes de que el modal toque el DOM
  try{ _scrollGuardado = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0; }catch(e){ _scrollGuardado=0; }

  const lineas = state.sales.filter(s=>s.ticketId===ticketId);
  const devs = state.devoluciones.filter(d=>d.ticketId===ticketId);
  const tieneDevs = devs.length > 0;

  const aviso = tieneDevs
    ? `<p style="color:var(--red);font-size:13px;">⚠️ Este ticket tiene <b>${devs.length} devolución(es)</b> registrada(s). Al eliminarlo también se borrarán esas devoluciones.</p>`
    : `<p style="color:var(--ink-dim);font-size:13px;">Se repondrá el stock de ${lineas.length} artículo(s). Esta acción no se puede deshacer.</p>`;

  document.getElementById("modal-root").innerHTML = `
    <div class="modal-overlay">
      <div class="modal" style="max-width:400px;">
        <h3>🗑️ Eliminar ticket</h3>
        <p>¿Eliminar el ticket <b>${t.numSerieFactura}</b> por <b>${eur(t.total)}</b>?</p>
        ${aviso}
        <div class="modal-actions" style="justify-content:center;gap:12px;">
          <button class="btn secondary" onclick="closeModal()">Cancelar</button>
          <button class="btn danger" onclick="confirmarEliminarTicket('${ticketId}')">🗑️ Sí, eliminar</button>
        </div>
      </div>
    </div>`;
}

function confirmarEliminarTicket(ticketId){
  const lineas = state.sales.filter(s=>s.ticketId===ticketId);
  // Reponer stock de los artículos del catálogo
  lineas.forEach(s=>{
    if(s.productId==='__manual__') return;
    const p = state.products.find(x=>x.id===s.productId);
    if(p){
      const info = tallaInfo(p, s.talla);
      if(!p.tallas[s.talla]) p.tallas[s.talla] = {stock:0, barcode:""};
      p.tallas[s.talla].stock = (info.stock||0) + s.cantidad;
    }
  });
  // Borrar ventas, devoluciones y ticket
  state.sales = state.sales.filter(s=>s.ticketId!==ticketId);
  state.devoluciones = state.devoluciones.filter(d=>d.ticketId!==ticketId);
  state.tickets = state.tickets.filter(x=>x.id!==ticketId);
  saveState();
  closeModal();
  render();
  showToast("Ticket eliminado y stock repuesto ✓", "ok");
}

// Cancela la venta más reciente del carrito actual si el cliente se arrepiente.
// También permite cancelar cualquier ticket del historial de ventas.
function cancelarUltimaVenta(){
  if(state.tickets.length===0){ showToast("No hay ventas registradas.", "err"); return; }
  const ultimoTicket = state.tickets[state.tickets.length-1];
  eliminarTicket(ultimoTicket.id);
}

function exportLedgerJSON(){
  const data = JSON.stringify({ settings:state.settings, tickets:state.tickets, sales:state.sales }, null, 2);
  const blob = new Blob([data], {type:"application/json"});

// ---------------- EXPORTACIÓN PDF DE INFORMES ----------------
const PERIODOS_PDF = [
  { value:'hoy',          label:'Hoy' },
  { value:'ayer',         label:'Ayer' },
  { value:'semana',       label:'Esta semana' },
  { value:'semana_pasada',label:'Semana pasada' },
  { value:'mes',          label:'Este mes' },
  { value:'mes_pasado',   label:'Mes pasado' },
  { value:'trimestre',    label:'Este trimestre' },
  { value:'trimestre_pasado', label:'Trimestre pasado' },
  { value:'anio',         label:'Este año' },
  { value:'anio_pasado',  label:'Año pasado' },
  { value:'personalizado',label:'Rango personalizado' },
];

let pdfPeriodo = 'mes';
let pdfFrom = null;
let pdfTo = null;

function matchesPdfPeriod(fechaIso){
  const d = new Date(fechaIso);
  const now = new Date();
  const mes = d.getMonth(), anio = d.getFullYear();
  const nowMes = now.getMonth(), nowAnio = now.getFullYear();
  if(pdfPeriodo==='hoy') return d.toDateString()===now.toDateString();
  if(pdfPeriodo==='ayer'){ const y=new Date(now); y.setDate(y.getDate()-1); return d.toDateString()===y.toDateString(); }
  if(pdfPeriodo==='semana'){ const sw=startOfWeek(now); return d>=sw; }
  if(pdfPeriodo==='semana_pasada'){ const sw=startOfWeek(now); const sp=new Date(sw); sp.setDate(sp.getDate()-7); return d>=sp && d<sw; }
  if(pdfPeriodo==='mes') return anio===nowAnio && mes===nowMes;
  if(pdfPeriodo==='mes_pasado'){ const pm=new Date(nowAnio, nowMes-1,1); return anio===pm.getFullYear() && mes===pm.getMonth(); }
  if(pdfPeriodo==='trimestre'){
    const t = Math.floor(nowMes/3);
    return anio===nowAnio && Math.floor(mes/3)===t;
  }
  if(pdfPeriodo==='trimestre_pasado'){
    const tNow = Math.floor(nowMes/3);
    const tPrev = tNow===0 ? 3 : tNow-1;
    const aPrev = tNow===0 ? nowAnio-1 : nowAnio;
    return anio===aPrev && Math.floor(mes/3)===tPrev;
  }
  if(pdfPeriodo==='anio') return anio===nowAnio;
  if(pdfPeriodo==='anio_pasado') return anio===nowAnio-1;
  if(pdfPeriodo==='personalizado'){
    if(pdfFrom && d < new Date(pdfFrom+"T00:00:00")) return false;
    if(pdfTo && d > new Date(pdfTo+"T23:59:59")) return false;
    return true;
  }
  return true;
}
